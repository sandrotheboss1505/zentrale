<!DOCTYPE html>
<html lang="de">
<head>
<title>Zentrale</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zentrale">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#073763">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3EF; --karte: #FFFFFF; --text: #232321; --leise: #67655F; --linie: #E6E4DE; --titel: #3A3935;
    --akzent: #1155CC; --chip: #F1EFEA; --schatten: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --karte: #1F1F1D; --text: #EDEBE6; --leise: #ABA9A2; --linie: #2E2E2B; --titel: #D6D3CC;
            --akzent: #7BA4F0; --chip: #2A2A27; --schatten: none; }
  }
  /* Stufe 2: Skala. Neue Werte nur von hier (tests/stil_test.js prüft). Gleich in hell und dunkel */
  :root {
    --schrift-mini: 11px; --schrift-klein: 13px; --schrift-text: 15px; --schrift-gross: 17px; --schrift-titel: 22px; --schrift-zahl: 30px;
    --radius-klein: 4px; --radius-mittel: 8px; --radius-gross: 12px; --radius-karte: 18px; --radius-rund: 999px;
    --abstand-1: 2px; --abstand-2: 4px; --abstand-3: 6px; --abstand-4: 8px; --abstand-5: 10px; --abstand-6: 12px; --abstand-7: 16px; --abstand-8: 20px; --abstand-9: 24px; --abstand-10: 32px;
    /* Bereiche (COS_FARBEN, MAC_FARBEN lesen daraus) und Ringe (RINGE) */
    --bereich-fw: #C2507F; --bereich-projekte: #A391D9; --bereich-hfbk: #75A5AF; --bereich-admin: #EF9E26; --bereich-sport: #6AA77A; --bereich-system: #8C8C8C; --bereich-claude: #D97757; --bereich-ablenkung: #B3261E; --bereich-sonstiges: #CFCBC2; --bereich-ohne: #9A968C;
    --ring-fokus: #6F5CE6; --ring-koerper: #0C9A6C; --ring-kopf: #E0447A;
    /* Feste Farben nach Rolle */
    --abdunkeln-blatt: rgba(20,20,18,.42); --abdunkeln-mac: rgba(0,0,0,.4); --anf-puls: rgba(17, 85, 204, .32);
    --anf-puls-aus: rgba(17, 85, 204, 0); --anf-puls-dunkel: rgba(123, 164, 240, .35); --anf-puls-dunkel-aus: rgba(123, 164, 240, 0);
    --checkin-offen: #B0577F; --checkin-rosa: #D5A6BD; --gold-funken: #F5C542; --gold-glanz-1: #E0A92E; --gold-glanz-2: #F5D36A;
    --gruen-fertig: #1D9E75; --gruen-gut: #0B8043; --halb: #C99A06; --jetzt-linie: #D9473F; --jetzt-linie-mac: #E04848; --knopf-blau: #073763;
    --knopf-blau-dunkel: #2F5AA8; --koe-checkin: #7CC9A9; --meldung-grund: #2b2b29; --rot-loeschen: #B3261E; --schalter-leer: #A8A69F;
    --schatten-blatt: rgba(0,0,0,.3); --schatten-leiste: rgba(0,0,0,.12); --schatten-schalter: rgba(0,0,0,.25);
    --schatten-segment: rgba(0,0,0,.1); --schatten-tab: rgba(0,0,0,.08); --schatten-ziehen: rgba(0,0,0,.18); --sport-lange: #E07B1F;
    --stat-gelb: #F6BF26; --stat-gelb-text: #3A2F00; --stat-grau: #616161; --vornehmen-lila: #A391D9; --warnung: #C77700; --weiss: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: var(--schrift-text)/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  .logo { background: var(--knopf-blau); padding: calc(var(--abstand-7) + env(safe-area-inset-top)) var(--abstand-7) var(--abstand-7); text-align: center; }
  .logo span { font: italic 800 var(--schrift-zahl)/1 Inter, -apple-system, sans-serif; color: var(--weiss); letter-spacing: .01em; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: var(--abstand-5) var(--abstand-7); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--abstand-4); }
  /* V78: links und rechts gleich breit, der Titel steht genau in der Mitte */
  header > #zurueck { justify-self: start; }
  .kopf-rechts { justify-self: end; display: flex; align-items: center; gap: var(--abstand-3); }
  .titel { text-align: center; white-space: nowrap; }
  .titel b { display: block; font-size: var(--schrift-gross); }
  .titel span { font-size: var(--schrift-klein); color: var(--leise); }
  .rund { width: 38px; height: 38px; border-radius: var(--radius-rund); background: var(--karte); box-shadow: var(--schatten);
    display: grid; place-items: center; font-size: var(--schrift-gross); position: relative; }
  .rund:disabled { opacity: .3; }
  .rund.dreht svg { animation: drehen 1s linear infinite; }
  @keyframes drehen { to { transform: rotate(360deg); } }
  #neu.sync::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
    border-radius: var(--radius-rund); background: var(--akzent); }

  main { padding: var(--abstand-2) var(--abstand-7) var(--abstand-7); max-width: 560px; margin: 0 auto; }
  .karte { background: var(--karte); border-radius: var(--radius-karte); box-shadow: var(--schatten); padding: var(--abstand-6) var(--abstand-7); margin-bottom: var(--abstand-6); }
  .bereich { display: flex; align-items: center; gap: var(--abstand-4); font-size: var(--schrift-klein); font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase; color: var(--titel); margin-bottom: var(--abstand-4); }
  .punkt { width: 8px; height: 8px; border-radius: var(--radius-rund); }

  .tageszahl { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--abstand-7); padding: var(--abstand-5) 0 var(--abstand-8); }
  .neben { display: flex; flex-direction: column; gap: var(--abstand-5); justify-self: start; }
  .neben.links { justify-self: end; text-align: right; }
  .neben small { display: block; white-space: nowrap; font-size: var(--schrift-mini); color: var(--leise); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--abstand-1); }
  .neben b { display: inline-block; font-size: var(--schrift-text); font-variant-numeric: tabular-nums; padding: var(--abstand-1) var(--abstand-5); border-radius: var(--radius-mittel); background: var(--chip); white-space: nowrap; }
  .tageszahl .zahl.pop { animation: hzpop .5s ease-out; }
  .tageszahl .zahl { width: 96px; height: 96px; border-radius: var(--radius-rund); display: grid; place-items: center;
    font-size: var(--schrift-zahl); font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

  .feld { padding: var(--abstand-5) 0; border-top: 1px solid var(--linie); }
  .bereich + .feld { border-top: 0; }
  .zeile { display: flex; align-items: center; justify-content: space-between; gap: var(--abstand-6); min-height: 28px; }
  .name { font-size: var(--schrift-text); }
  .name small { color: var(--leise); font-size: var(--schrift-klein); margin-left: var(--abstand-3); }
  .pille { padding: var(--abstand-2) var(--abstand-5); border-radius: var(--radius-gross); font-weight: 600; font-variant-numeric: tabular-nums;
    min-width: 44px; text-align: center; background: var(--chip); }
  .leer { color: var(--leise); font-weight: 400; }

  .skala { display: grid; grid-template-columns: repeat(10, 1fr); gap: var(--abstand-2); margin-top: var(--abstand-4); }
  .skala button { height: 36px; border-radius: var(--radius-gross); background: var(--chip); font-weight: 700; font-variant-numeric: tabular-nums;
    transition: transform .08s; }
  .skala button:active { transform: scale(.92); }
  .skala.wahl { grid-template-columns: repeat(3, 1fr); }
  .eintraege { display: flex; flex-wrap: wrap; gap: var(--abstand-3); margin-top: var(--abstand-4); }
  .eintraege button { font-size: var(--schrift-klein); padding: var(--abstand-2) var(--abstand-4); border-radius: var(--radius-mittel); background: var(--chip);
    font-variant-numeric: tabular-nums; color: var(--text); }
  .eintraege button i { font-style: normal; color: var(--leise); margin-left: var(--abstand-2); }

  .zaehler { display: flex; align-items: center; gap: var(--abstand-3); }
  .zaehler button { width: 34px; height: 34px; border-radius: var(--radius-rund); background: var(--chip); font-size: var(--schrift-titel); line-height: 1; }
  .zaehler .pille { min-width: 40px; }

  .schalter { width: 50px; height: 30px; border-radius: var(--radius-rund); background: var(--linie); position: relative; transition: background .15s; }
  .schalter::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: var(--radius-rund);
    background: var(--weiss); box-shadow: 0 1px 3px var(--schatten-schalter); transition: transform .15s; }
  .schalter.an::after { transform: translateX(20px); }

  input[type=time], input[type=text], textarea {
    font: inherit; color: var(--text); background: var(--chip); border: 0; border-radius: var(--radius-gross); padding: var(--abstand-3) var(--abstand-5); }
  input[type=time] { min-width: 96px; text-align: center; }
  input[type=text] { width: 140px; text-align: right; }
  textarea { width: 100%; min-height: 84px; margin-top: var(--abstand-4); resize: vertical; }
  /* Notizfelder: genau so hoch wie der Inhalt, mindestens eine Zeile. Ohne field-sizing hilft notizHoehe() in hilfen.js */
  textarea.notizfeld, body.mac .tag-spalten textarea.notizfeld, .pj-notiz textarea.notizfeld, .pj-notiz-r textarea.notizfeld { min-height: 0; field-sizing: content; overflow: hidden; resize: none; }
  .loeschen { font-size: var(--schrift-klein); color: var(--leise); margin-left: var(--abstand-3); }
  .jetzt { padding: var(--abstand-4) var(--abstand-7); border-radius: var(--radius-gross); font-weight: 600; color: var(--weiss); }
  .unter { font-size: var(--schrift-klein); color: var(--leise); text-align: right; margin-top: var(--abstand-2); }
  .zuletzt { color: var(--checkin-rosa); font-weight: 600; }
  /* Jedes Antippen federt kurz nach, auch wenn die Ansicht dabei neu gezeichnet wird */
  .tipp { animation: tipp .32s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tipp { 0% { transform: scale(.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--karte); border-top: 1px solid var(--linie);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; padding: var(--abstand-6) 0 var(--abstand-5); font-size: var(--schrift-klein); color: var(--leise); }
  nav button.aktiv { color: var(--akzent); font-weight: 600; }

  #meldung { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--meldung-grund); color: var(--weiss); padding: var(--abstand-4) var(--abstand-6); border-radius: var(--radius-gross); font-size: var(--schrift-klein); opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; z-index: 9; }
  #meldung.sichtbar { opacity: 1; }
  .laden { text-align: center; color: var(--leise); padding: 60px 0; }
  .klappbar { cursor: pointer; }
  .pfeil { display: inline-block; color: var(--leise); font-size: var(--schrift-mini); margin-left: var(--abstand-3); transition: transform .15s; }
  .klappbar.auf .pfeil { transform: rotate(90deg); }
  .liste { margin-top: var(--abstand-4); }
  .mac-balken { display: flex; gap: var(--abstand-1); height: 6px; margin-top: var(--abstand-4); border-radius: var(--radius-rund); overflow: hidden; }
  .mac-balken span { min-width: 3px; }
  .knopf { display: inline-block; margin-top: var(--abstand-5); padding: var(--abstand-4) var(--abstand-6); border-radius: var(--radius-gross); background: var(--akzent); color: var(--weiss); font-weight: 600; }

  /* Köö: Fokus und Kopf grau, nur Körper in Farbe */
  body.koeansicht .ringe-svg [data-spur="0"], body.koeansicht .ringe-svg [data-spur="2"] { stroke: var(--kreis); opacity: .28; }
  body.koeansicht .ringe-svg .ring[data-ring="0"], body.koeansicht .ringe-svg .ring[data-ring="2"] { stroke: var(--kreis); }
  body.koeansicht .ringe-leg span:not(:nth-child(2)) { opacity: .55; }
  body.koeansicht .ringe-leg span:not(:nth-child(2)) i { background: var(--kreis) !important; }
  body.koeansicht .ringe-leg span:nth-child(2) { color: var(--ring-koerper); }
  body.koeansicht .tageszahl .zahl { background: var(--chip) !important; color: var(--leise) !important; }
  .ringe-leg span.pop { animation: hzpop .5s ease-out; }
  /* Stufe 3: Kästchen, Uhrzeiten und Zusatz zeichnet React mit Tailwind (ui/src/koeoe/). Die Farben vom letzten Sport bleiben hier, der Test liest die Klasse */
  .koe-sport b.sp-heute { color: var(--ring-koerper); }
  .koe-sport b.sp-lange { color: var(--sport-lange); }
  /* V93: Check ins (Halsi, Migna) in Köö grün wie der Körperring statt Kopf Rosa */
  body.koeansicht .ci-offen, body.koeansicht .ci-status.offen { color: var(--ring-koerper); }
  body.koeansicht .ci-punkt, body.koeansicht .ci-haken { background: var(--koe-checkin); }
  .woche-karte { cursor: pointer; }
  .woche-karte .bereich { margin-bottom: var(--abstand-5); }
  .wk-schnitt { margin-left: auto; font-size: var(--schrift-klein); font-weight: 700; color: var(--text); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .wk-pfeil { margin-left: var(--abstand-4); color: var(--leise); font-size: var(--schrift-gross); line-height: 1; text-transform: none; }
  .wk-balken { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--abstand-4); }
  .wk-tag { display: flex; flex-direction: column; align-items: center; gap: var(--abstand-2); }
  .wk-bahn { position: relative; width: 100%; max-width: 30px; height: 44px; border-radius: var(--radius-klein); background: var(--chip); overflow: hidden; }
  .wk-bahn i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: var(--radius-klein); transition: height .6s cubic-bezier(.2, .8, .2, 1); }
  .wk-tag small { font-size: var(--schrift-mini); font-weight: 600; color: var(--leise); }
  .wk-tag.heute small { color: var(--text); }
  .wk-tag.heute .wk-bahn { box-shadow: inset 0 0 0 1.5px var(--kreis); }
  .tag-zeile { display: flex; align-items: center; gap: var(--abstand-6); padding: var(--abstand-5) 0; border-top: 1px solid var(--linie); width: 100%; text-align: left; }
  .tag-zeile:first-child { border-top: 0; }
  .tag-zeile .datum { width: 86px; font-weight: 600; white-space: nowrap; flex: none; }
  .tag-zeile .mini { flex: 1; display: flex; flex-wrap: wrap; gap: var(--abstand-2); }
  .mini span { font-size: var(--schrift-klein); padding: var(--abstand-1) var(--abstand-3); border-radius: var(--radius-mittel); background: var(--chip); font-variant-numeric: tabular-nums; }
  .posten { display: flex; align-items: center; gap: var(--abstand-4); padding: var(--abstand-3) 0; font-size: var(--schrift-klein); border-top: 1px solid var(--linie); }
  .posten:first-child { border-top: 0; }
  .posten .pzeit { font-size: var(--schrift-klein); color: var(--leise); font-variant-numeric: tabular-nums; width: 38px; flex: none; }
  .posten .ppunkt { font-size: var(--schrift-mini); width: 14px; text-align: center; flex: none; }
  .posten .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .posten .pbetrag { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Geld Karte: letzte 7 Tage, nach Tag */
  .tag7 { display: flex; justify-content: space-between; font-size: var(--schrift-klein); font-weight: 600; color: var(--leise); margin: var(--abstand-6) 0 var(--abstand-1); font-variant-numeric: tabular-nums; }
  .liste .tag7:first-child { margin-top: var(--abstand-2); }
  .tag7 + .posten { border-top: 0; }
  .ci-offen { margin-left: auto; font-size: var(--schrift-mini); font-weight: 600; color: var(--checkin-offen); text-transform: none; letter-spacing: 0; }
  .version { text-align: center; font-size: var(--schrift-mini); color: var(--leise); opacity: .7; padding: var(--abstand-3) 0 var(--abstand-6); font-variant-numeric: tabular-nums; }
  .ci-status { display: flex; align-items: center; justify-content: flex-end; gap: var(--abstand-3); margin-top: var(--abstand-3); font-size: var(--schrift-klein); font-weight: 600; }
  .ci-status.offen { color: var(--checkin-offen); }
  .ci-status.drin { color: var(--leise); font-weight: 500; }
  .ci-punkt { width: 8px; height: 8px; border-radius: var(--radius-rund); background: var(--checkin-rosa); animation: ciatmen 1.6s ease-in-out infinite; }
  @keyframes ciatmen { 0%, 100% { transform: scale(.8); opacity: .6; } 50% { transform: scale(1.3); opacity: 1; } }
  .ci-haken { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: var(--radius-rund); background: var(--checkin-rosa); color: var(--weiss); font-size: var(--schrift-mini); }
  .ci-status.frisch .ci-haken { animation: cihaken .5s cubic-bezier(.3, 1.6, .5, 1); }
  .ci-status.frisch { animation: ciein .5s ease-out; }
  @keyframes cihaken { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes ciein { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
  .jetztwahl { display: flex; align-items: center; gap: var(--abstand-3); }
  .jetztwahl .jetzt { padding: var(--abstand-3) var(--abstand-6); }
  .nicht { font-size: var(--schrift-klein); color: var(--leise); text-decoration: underline; margin-top: var(--abstand-3); }

  .termin { display: flex; align-items: center; gap: var(--abstand-6); padding: var(--abstand-4) 0; border-top: 1px solid var(--linie); }
  .termin:first-child { border-top: 0; }
  .termin .zeit { width: 44px; font-variant-numeric: tabular-nums; color: var(--leise); font-size: var(--schrift-klein); }
  .termin .was { flex: 1; min-width: 0; }
  .termin .was div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .termin .was small { color: var(--leise); font-size: var(--schrift-klein); }
  .terminliste { margin-top: var(--abstand-3); }
  .hinweis { font-size: var(--schrift-klein); color: var(--leise); padding: var(--abstand-3) 0 var(--abstand-1); }

  /* Blöcke */
  .block { display: flex; align-items: center; gap: var(--abstand-5); padding: var(--abstand-4) 0; border-top: 1px solid var(--linie); }
  .terminliste .block:first-child { border-top: 0; }
  .block.spaeter { opacity: .55; }
  .block .zeit { width: 44px; font-variant-numeric: tabular-nums; color: var(--leise); font-size: var(--schrift-klein); flex: none; }
  .block .was { flex: 1; min-width: 0; }
  .block .was div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block .was small { color: var(--leise); font-size: var(--schrift-klein); }
  .stat { display: flex; gap: var(--abstand-2); flex: none; }
  .stat button { width: 34px; height: 34px; border-radius: var(--radius-rund); background: var(--chip); font-weight: 700; font-size: var(--schrift-text);
    color: var(--leise); transition: transform .08s; }
  .stat button:active { transform: scale(.9); }
  .stat button.g.an { background: var(--gruen-gut); color: var(--weiss); }
  .stat button.t.an { background: var(--stat-gelb); color: var(--stat-gelb-text); }
  .stat button.n.an { background: var(--stat-grau); color: var(--weiss); }
  .pkt { font-size: var(--schrift-klein); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; color: var(--leise); flex: none; white-space: nowrap; }
  .pkt.plus { color: var(--gruen-gut); }
  .unterkopf { font-size: var(--schrift-mini); font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--titel); margin: var(--abstand-6) 0 0; }
  @keyframes hops { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .hops { animation: hops .4s ease-out; display: inline-block; }
  .balken { height: 6px; border-radius: var(--radius-klein); background: var(--linie); margin: var(--abstand-5) 0 var(--abstand-3); overflow: hidden; }
  .balken i { display: block; height: 100%; background: var(--akzent); }
  .reihe { display: grid; gap: var(--abstand-4); margin-top: var(--abstand-4); }

  /* Heute Karte nach Vorschau */

  /* Planen */
  #planen { position: fixed; inset: 0; z-index: 8; background: var(--bg); overflow-y: auto; display: none;
    padding: calc(var(--abstand-6) + env(safe-area-inset-top)) var(--abstand-7) calc(var(--abstand-10) + env(safe-area-inset-bottom)); }

  /* ── Mac: breites Layout (Klasse mac ab 760 px mit Maus oder Trackpad, mac3 ab 1100 px). Handy bleibt einspaltig ── */

<script>
/* ── Chief of Staff: Projekte, Etappen, Schritte, Kästchen. Daten aus appChief (Tabs Projekte und Schritte), Zeit aus den Blöcken ──
   Ein Kästchen sind 30 Minuten Fokuszeit. Die Kästchen des Tages sind die Fokuszeit des Tages durch 30, also genau das,
   was im Tageswert schon zählt. Hier ändert sich keine Gewichtung. Ändern geht über appChiefAendern, Rückgängig über merken. */
const COS_SPEICHER = 'zentrale_chief_2', COS_KQ = 'zentrale_kq_1', COS_MIN = 30, COS_SITZUNG = 3, COS_AKTIV_MAX = 3;
const COS_KAP = 30;   // V65: Kästchen pro Woche, wenn in Projekte!J1 nichts steht
const COS_CLAUDE = 'https://claude.ai/project/01a17340-0436-7789-9c22-8fa8b14c4299';
/* Stufe 2: Farben aus der Skala in basis/basis.css (das CSS steht vor den Skripten). Läuft vor dem Hauptteil, deshalb hier */
function stilWert(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const COS_FARBEN = { FW: stilWert('--bereich-fw'), Projekte: stilWert('--bereich-projekte'), HFBK: stilWert('--bereich-hfbk'),
  Admin: stilWert('--bereich-admin'), Sport: stilWert('--bereich-sport'), System: stilWert('--bereich-system') };
const COS_FARBE_OHNE = stilWert('--bereich-ohne');
const COS_BEREICHE = ['FW', 'Projekte', 'HFBK', 'Admin', 'Sport', 'System'];
const COS_WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

let C = null;                 // Chief Paket vom Server
let cosGeladen = 0, cosLaedt = false, cosFehlt = false;
let cosProjekt = null;        // offenes Projekt (ID)
let cosWahl = null;           // per Tauschen gewählter Schritt
let cosStartet = null;        // Schlüssel des Blocks, der gerade beim Server angelegt wird
let cosAuf = { fertig: false, geparkt: false };
const cosKeys = {};           // Block Schlüssel → Schritt ID, bis der Server es kennt
let cosAusstehend = 0, cosAenderung = 0;   // Änderungen unterwegs zum Server, Zeitpunkt der letzten
let cosBlatt = null;          // offenes Blatt (Schritt, Projekt, Etappe, Zerlegen)
const cosFrisch = {};         // gerade entstandene Schritte, für die Einblendung
let cosZieh = null;           // laufendes Ziehen
try { C = JSON.parse(localStorage.getItem(COS_SPEICHER) || 'null'); } catch (e) { C = null; }

function cosFarbe(bereich) { return COS_FARBEN[bereich] || COS_FARBE_OHNE; }
function cosUhr(min) { return zwei(Math.floor(min / 60)) + ':' + zwei(min % 60); }
function cosTageBis(von, bis) {
  const a = von.split('-').map(Number), b = bis.split('-').map(Number);
  return Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 864e5);
}
/* V90: Arbeitstage sind Mo bis Fr, Sa und So haben 0 Kästchen */
function cosArbeitstag(iso) { const t = iso.split('-').map(Number), w = new Date(Date.UTC(t[0], t[1] - 1, t[2])).getUTCDay(); return w >= 1 && w <= 5; }
/* Arbeitstage nach von bis einschließlich bis. Von Montag bis Freitag sind es 4, mit heute also 5 */
function cosArbeitstageBis(von, bis) {
  const n = cosTageBis(von, bis);
  let a = 0;
  for (let i = 1; i <= n; i++) if (cosArbeitstag(tagPlus(von, i))) a++;
  return a;
}
/* Arbeitstage von heute bis zur Deadline, heute mitgezählt, wenn es ein Arbeitstag ist. Mindestens 1 */
function cosArbeitstageMit(von, bis) { return Math.max(1, cosArbeitstageBis(von, bis) + (cosArbeitstag(von) ? 1 : 0)); }

/* Räder (Uhrzeit, Datum): iOS meldet jede Drehung schon als change. Zeichnet die App dann neu, schließt das Rad, bevor du Fertig tippst.
   Deshalb zählt ein Wert erst, wenn das Rad zu ist (Fertig, daneben tippen, am Mac Enter oder wegklicken). Gilt für alle Räder der App */
const RAD = 'input[type=time], input[type=date]';
let radDurch = null;
function radOffen(box) { const a = document.activeElement; return !!(a && a.matches && a.matches(RAD) && (!box || box.contains(a))); }
// Uhrzeitfelder melden beim Wechsel zwischen Stunde und Minute selbst Fokus rein und raus. Gezählt wird nur das erste Rein und das echte Raus
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.matches && el.matches(RAD) && !el._offen) { el._offen = true; el._gemeldet = el.value; }
}, true);
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.matches || !el.matches(RAD) || radDurch === el) return;
  if (document.activeElement === el || el.value === el._gemeldet) { e.stopImmediatePropagation(); e.stopPropagation(); return; }
  el._gemeldet = el.value;
}, true);
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!el.matches || !el.matches(RAD)) return;
  setTimeout(() => {
    if (document.activeElement === el) return;   // nur zwischen Stunde und Minute gewechselt
    el._offen = false;
    if (el.isConnected && el.value !== el._gemeldet) {
      el._gemeldet = el.value;
      radDurch = el;
      try { el.dispatchEvent(new Event('change', { bubbles: true })); } finally { radDurch = null; }
    }
    // Was während des offenen Rads warten musste, jetzt nachholen
    if (radOffen()) return;
    if (plan && plan.spaeter) planZeichnen();
    else if (spaeterZeichnen && !plan && !hwahl) zeichnen();
  }, 0);
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches(RAD)) { e.preventDefault(); e.target.blur(); } }, true);

(function start() {
  tagIso = starttag();
  if (START && START.werte) {
    uebernehmen(START);
    abfragen();
  } else {
    try { const s = localStorage.getItem(SPEICHER); if (s) P = JSON.parse(s); } catch (e) { P = null; }
    if (P) zeichnen();
    abfragen(true);
  }
  ortMelden();
  heuteLaden(true);
  setTimeout(() => tasksVorladen(true), 1500);   // Tasks schon mal holen, damit das Plus Fenster sofort steht
})();
</script>
