<!DOCTYPE html>
<html lang="de">
<head>
<title>Zentrale</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zentrale">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#073763">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3EF; --karte: #FFFFFF; --text: #232321; --leise: #67655F; --linie: #E6E4DE; --titel: #3A3935;
    --akzent: #1155CC; --chip: #F1EFEA; --schatten: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --karte: #1F1F1D; --text: #EDEBE6; --leise: #ABA9A2; --linie: #2E2E2B; --titel: #D6D3CC;
            --akzent: #7BA4F0; --chip: #2A2A27; --schatten: none; }
  }
  /* Stufe 2: Skala. Neue Werte nur von hier (tests/stil_test.js prüft). Gleich in hell und dunkel */
  :root {
    --schrift-mini: 11px; --schrift-klein: 13px; --schrift-text: 15px; --schrift-gross: 17px; --schrift-titel: 22px; --schrift-zahl: 30px;
    --radius-klein: 4px; --radius-mittel: 8px; --radius-gross: 12px; --radius-karte: 18px; --radius-rund: 999px;
    --abstand-1: 2px; --abstand-2: 4px; --abstand-3: 6px; --abstand-4: 8px; --abstand-5: 10px; --abstand-6: 12px; --abstand-7: 16px; --abstand-8: 20px; --abstand-9: 24px; --abstand-10: 32px;
    /* Bereiche (COS_FARBEN, MAC_FARBEN lesen daraus) und Ringe (RINGE) */
    --bereich-fw: #C2507F; --bereich-projekte: #A391D9; --bereich-hfbk: #75A5AF; --bereich-admin: #EF9E26; --bereich-sport: #6AA77A; --bereich-system: #8C8C8C; --bereich-claude: #D97757; --bereich-ablenkung: #B3261E; --bereich-sonstiges: #CFCBC2; --bereich-ohne: #9A968C;
    --ring-fokus: #6F5CE6; --ring-koerper: #0C9A6C; --ring-kopf: #E0447A;
    /* Feste Farben nach Rolle */
    --abdunkeln-blatt: rgba(20,20,18,.42); --abdunkeln-mac: rgba(0,0,0,.4); --anf-puls: rgba(17, 85, 204, .32);
    --anf-puls-aus: rgba(17, 85, 204, 0); --anf-puls-dunkel: rgba(123, 164, 240, .35); --anf-puls-dunkel-aus: rgba(123, 164, 240, 0);
    --checkin-offen: #B0577F; --checkin-rosa: #D5A6BD; --gold-funken: #F5C542; --gold-glanz-1: #E0A92E; --gold-glanz-2: #F5D36A;
    --gruen-fertig: #1D9E75; --gruen-gut: #0B8043; --halb: #C99A06; --jetzt-linie: #D9473F; --jetzt-linie-mac: #E04848; --knopf-blau: #073763;
    --knopf-blau-dunkel: #2F5AA8; --koe-checkin: #7CC9A9; --meldung-grund: #2b2b29; --rot-loeschen: #B3261E; --schalter-leer: #A8A69F;
    --schatten-blatt: rgba(0,0,0,.3); --schatten-leiste: rgba(0,0,0,.12); --schatten-schalter: rgba(0,0,0,.25);
    --schatten-segment: rgba(0,0,0,.1); --schatten-tab: rgba(0,0,0,.08); --schatten-ziehen: rgba(0,0,0,.18); --sport-lange: #E07B1F;
    --stat-gelb: #F6BF26; --stat-gelb-text: #3A2F00; --stat-grau: #616161; --vornehmen-lila: #A391D9; --warnung: #C77700; --weiss: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: var(--schrift-text)/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  .logo { background: var(--knopf-blau); padding: calc(var(--abstand-7) + env(safe-area-inset-top)) var(--abstand-7) var(--abstand-7); text-align: center; }
  .logo span { font: italic 800 var(--schrift-zahl)/1 Inter, -apple-system, sans-serif; color: var(--weiss); letter-spacing: .01em; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: var(--abstand-5) var(--abstand-7); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--abstand-4); }
  /* V78: links und rechts gleich breit, der Titel steht genau in der Mitte */
  header > #zurueck { justify-self: start; }
  .kopf-rechts { justify-self: end; display: flex; align-items: center; gap: var(--abstand-3); }
  .titel { text-align: center; white-space: nowrap; }
  .titel b { display: block; font-size: var(--schrift-gross); }
  .titel span { font-size: var(--schrift-klein); color: var(--leise); }
  .rund { width: 38px; height: 38px; border-radius: var(--radius-rund); background: var(--karte); box-shadow: var(--schatten);
    display: grid; place-items: center; font-size: var(--schrift-gross); position: relative; }
  .rund:disabled { opacity: .3; }
  .rund.dreht svg { animation: drehen 1s linear infinite; }
  @keyframes drehen { to { transform: rotate(360deg); } }
  #neu.sync::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
    border-radius: var(--radius-rund); background: var(--akzent); }

  main { padding: var(--abstand-2) var(--abstand-7) var(--abstand-7); max-width: 560px; margin: 0 auto; }
  .karte { background: var(--karte); border-radius: var(--radius-karte); box-shadow: var(--schatten); padding: var(--abstand-6) var(--abstand-7); margin-bottom: var(--abstand-6); }
  .bereich { display: flex; align-items: center; gap: var(--abstand-4); font-size: var(--schrift-klein); font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase; color: var(--titel); margin-bottom: var(--abstand-4); }
  .punkt { width: 8px; height: 8px; border-radius: var(--radius-rund); }

  .tageszahl { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--abstand-7); padding: var(--abstand-5) 0 var(--abstand-8); }
  .neben { display: flex; flex-direction: column; gap: var(--abstand-5); justify-self: start; }
  .neben.links { justify-self: end; text-align: right; }
  .neben small { display: block; white-space: nowrap; font-size: var(--schrift-mini); color: var(--leise); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--abstand-1); }
  .neben b { display: inline-block; font-size: var(--schrift-text); font-variant-numeric: tabular-nums; padding: var(--abstand-1) var(--abstand-5); border-radius: var(--radius-mittel); background: var(--chip); white-space: nowrap; }
  .tageszahl .zahl.pop { animation: hzpop .5s ease-out; }
  .tageszahl .zahl { width: 96px; height: 96px; border-radius: var(--radius-rund); display: grid; place-items: center;
    font-size: var(--schrift-zahl); font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

  .feld { padding: var(--abstand-5) 0; border-top: 1px solid var(--linie); }
  .bereich + .feld { border-top: 0; }
  .zeile { display: flex; align-items: center; justify-content: space-between; gap: var(--abstand-6); min-height: 28px; }
  .name { font-size: var(--schrift-text); }
  .name small { color: var(--leise); font-size: var(--schrift-klein); margin-left: var(--abstand-3); }
  .pille { padding: var(--abstand-2) var(--abstand-5); border-radius: var(--radius-gross); font-weight: 600; font-variant-numeric: tabular-nums;
    min-width: 44px; text-align: center; background: var(--chip); }
  .leer { color: var(--leise); font-weight: 400; }

  .skala { display: grid; grid-template-columns: repeat(10, 1fr); gap: var(--abstand-2); margin-top: var(--abstand-4); }
  .skala button { height: 36px; border-radius: var(--radius-gross); background: var(--chip); font-weight: 700; font-variant-numeric: tabular-nums;
    transition: transform .08s; }
  .skala button:active { transform: scale(.92); }
  .skala.wahl { grid-template-columns: repeat(3, 1fr); }
  .eintraege { display: flex; flex-wrap: wrap; gap: var(--abstand-3); margin-top: var(--abstand-4); }
  .eintraege button { font-size: var(--schrift-klein); padding: var(--abstand-2) var(--abstand-4); border-radius: var(--radius-mittel); background: var(--chip);
    font-variant-numeric: tabular-nums; color: var(--text); }
  .eintraege button i { font-style: normal; color: var(--leise); margin-left: var(--abstand-2); }

  .zaehler { display: flex; align-items: center; gap: var(--abstand-3); }
  .zaehler button { width: 34px; height: 34px; border-radius: var(--radius-rund); background: var(--chip); font-size: var(--schrift-titel); line-height: 1; }
  .zaehler .pille { min-width: 40px; }

  .schalter { width: 50px; height: 30px; border-radius: var(--radius-rund); background: var(--linie); position: relative; transition: background .15s; }
  .schalter::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: var(--radius-rund);
    background: var(--weiss); box-shadow: 0 1px 3px var(--schatten-schalter); transition: transform .15s; }
  .schalter.an::after { transform: translateX(20px); }

  input[type=time], input[type=text], textarea {
    font: inherit; color: var(--text); background: var(--chip); border: 0; border-radius: var(--radius-gross); padding: var(--abstand-3) var(--abstand-5); }
  input[type=time] { min-width: 96px; text-align: center; }
  input[type=text] { width: 140px; text-align: right; }
  textarea { width: 100%; min-height: 84px; margin-top: var(--abstand-4); resize: vertical; }
  /* Notizfelder: genau so hoch wie der Inhalt, mindestens eine Zeile. Ohne field-sizing hilft notizHoehe() in hilfen.js */
  textarea.notizfeld, body.mac .tag-spalten textarea.notizfeld, .pj-notiz textarea.notizfeld, .pj-notiz-r textarea.notizfeld { min-height: 0; field-sizing: content; overflow: hidden; resize: none; }
  .loeschen { font-size: var(--schrift-klein); color: var(--leise); margin-left: var(--abstand-3); }
  .jetzt { padding: var(--abstand-4) var(--abstand-7); border-radius: var(--radius-gross); font-weight: 600; color: var(--weiss); }
  .unter { font-size: var(--schrift-klein); color: var(--leise); text-align: right; margin-top: var(--abstand-2); }
  .zuletzt { color: var(--checkin-rosa); font-weight: 600; }
  /* Jedes Antippen federt kurz nach, auch wenn die Ansicht dabei neu gezeichnet wird */
  .tipp { animation: tipp .32s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tipp { 0% { transform: scale(.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--karte); border-top: 1px solid var(--linie);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; padding: var(--abstand-6) 0 var(--abstand-5); font-size: var(--schrift-klein); color: var(--leise); }
  nav button.aktiv { color: var(--akzent); font-weight: 600; }

  #meldung { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--meldung-grund); color: var(--weiss); padding: var(--abstand-4) var(--abstand-6); border-radius: var(--radius-gross); font-size: var(--schrift-klein); opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; z-index: 9; }
  #meldung.sichtbar { opacity: 1; }
  .laden { text-align: center; color: var(--leise); padding: 60px 0; }
  .klappbar { cursor: pointer; }
  .pfeil { display: inline-block; color: var(--leise); font-size: var(--schrift-mini); margin-left: var(--abstand-3); transition: transform .15s; }
  .klappbar.auf .pfeil { transform: rotate(90deg); }
  .liste { margin-top: var(--abstand-4); }
  .mac-balken { display: flex; gap: var(--abstand-1); height: 6px; margin-top: var(--abstand-4); border-radius: var(--radius-rund); overflow: hidden; }
  .mac-balken span { min-width: 3px; }
  .knopf { display: inline-block; margin-top: var(--abstand-5); padding: var(--abstand-4) var(--abstand-6); border-radius: var(--radius-gross); background: var(--akzent); color: var(--weiss); font-weight: 600; }

  /* Köö: Fokus und Kopf grau, nur Körper in Farbe */
  body.koeansicht .ringe-svg [data-spur="0"], body.koeansicht .ringe-svg [data-spur="2"] { stroke: var(--kreis); opacity: .28; }
  body.koeansicht .ringe-svg .ring[data-ring="0"], body.koeansicht .ringe-svg .ring[data-ring="2"] { stroke: var(--kreis); }
  body.koeansicht .ringe-leg span:not(:nth-child(2)) { opacity: .55; }
  body.koeansicht .ringe-leg span:not(:nth-child(2)) i { background: var(--kreis) !important; }
  body.koeansicht .ringe-leg span:nth-child(2) { color: var(--ring-koerper); }
  body.koeansicht .tageszahl .zahl { background: var(--chip) !important; color: var(--leise) !important; }
  .ringe-leg span.pop { animation: hzpop .5s ease-out; }
  /* Stufe 3: Kästchen, Uhrzeiten und Zusatz zeichnet React mit Tailwind (ui/src/koeoe/). Die Farben vom letzten Sport bleiben hier, der Test liest die Klasse */
  .koe-sport b.sp-heute { color: var(--ring-koerper); }
  .koe-sport b.sp-lange { color: var(--sport-lange); }
  /* V93: Check ins (Halsi, Migna) in Köö grün wie der Körperring statt Kopf Rosa */
  body.koeansicht .ci-offen, body.koeansicht .ci-status.offen { color: var(--ring-koerper); }
  body.koeansicht .ci-punkt, body.koeansicht .ci-haken { background: var(--koe-checkin); }
  .woche-karte { cursor: pointer; }
  .woche-karte .bereich { margin-bottom: var(--abstand-5); }
  .wk-schnitt { margin-left: auto; font-size: var(--schrift-klein); font-weight: 700; color: var(--text); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .wk-pfeil { margin-left: var(--abstand-4); color: var(--leise); font-size: var(--schrift-gross); line-height: 1; text-transform: none; }
  .wk-balken { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--abstand-4); }
  .wk-tag { display: flex; flex-direction: column; align-items: center; gap: var(--abstand-2); }
  .wk-bahn { position: relative; width: 100%; max-width: 30px; height: 44px; border-radius: var(--radius-klein); background: var(--chip); overflow: hidden; }
  .wk-bahn i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: var(--radius-klein); transition: height .6s cubic-bezier(.2, .8, .2, 1); }
  .wk-tag small { font-size: var(--schrift-mini); font-weight: 600; color: var(--leise); }
  .wk-tag.heute small { color: var(--text); }
  .wk-tag.heute .wk-bahn { box-shadow: inset 0 0 0 1.5px var(--kreis); }
  .tag-zeile { display: flex; align-items: center; gap: var(--abstand-6); padding: var(--abstand-5) 0; border-top: 1px solid var(--linie); width: 100%; text-align: left; }
  .tag-zeile:first-child { border-top: 0; }
  .tag-zeile .datum { width: 86px; font-weight: 600; white-space: nowrap; flex: none; }
  .tag-zeile .mini { flex: 1; display: flex; flex-wrap: wrap; gap: var(--abstand-2); }
  .mini span { font-size: var(--schrift-klein); padding: var(--abstand-1) var(--abstand-3); border-radius: var(--radius-mittel); background: var(--chip); font-variant-numeric: tabular-nums; }
  .posten { display: flex; align-items: center; gap: var(--abstand-4); padding: var(--abstand-3) 0; font-size: var(--schrift-klein); border-top: 1px solid var(--linie); }
  .posten:first-child { border-top: 0; }
  .posten .pzeit { font-size: var(--schrift-klein); color: var(--leise); font-variant-numeric: tabular-nums; width: 38px; flex: none; }
  .posten .ppunkt { font-size: var(--schrift-mini); width: 14px; text-align: center; flex: none; }
  .posten .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .posten .pbetrag { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Geld Karte: letzte 7 Tage, nach Tag */
  .tag7 { display: flex; justify-content: space-between; font-size: var(--schrift-klein); font-weight: 600; color: var(--leise); margin: var(--abstand-6) 0 var(--abstand-1); font-variant-numeric: tabular-nums; }
  .liste .tag7:first-child { margin-top: var(--abstand-2); }
  .tag7 + .posten { border-top: 0; }
  .ci-offen { margin-left: auto; font-size: var(--schrift-mini); font-weight: 600; color: var(--checkin-offen); text-transform: none; letter-spacing: 0; }
  .version { text-align: center; font-size: var(--schrift-mini); color: var(--leise); opacity: .7; padding: var(--abstand-3) 0 var(--abstand-6); font-variant-numeric: tabular-nums; }
  .ci-status { display: flex; align-items: center; justify-content: flex-end; gap: var(--abstand-3); margin-top: var(--abstand-3); font-size: var(--schrift-klein); font-weight: 600; }
  .ci-status.offen { color: var(--checkin-offen); }
  .ci-status.drin { color: var(--leise); font-weight: 500; }
  .ci-punkt { width: 8px; height: 8px; border-radius: var(--radius-rund); background: var(--checkin-rosa); animation: ciatmen 1.6s ease-in-out infinite; }
  @keyframes ciatmen { 0%, 100% { transform: scale(.8); opacity: .6; } 50% { transform: scale(1.3); opacity: 1; } }
  .ci-haken { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: var(--radius-rund); background: var(--checkin-rosa); color: var(--weiss); font-size: var(--schrift-mini); }
  .ci-status.frisch .ci-haken { animation: cihaken .5s cubic-bezier(.3, 1.6, .5, 1); }
  .ci-status.frisch { animation: ciein .5s ease-out; }
  @keyframes cihaken { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes ciein { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
  .jetztwahl { display: flex; align-items: center; gap: var(--abstand-3); }
  .jetztwahl .jetzt { padding: var(--abstand-3) var(--abstand-6); }
  .nicht { font-size: var(--schrift-klein); color: var(--leise); text-decoration: underline; margin-top: var(--abstand-3); }

  .termin { display: flex; align-items: center; gap: var(--abstand-6); padding: var(--abstand-4) 0; border-top: 1px solid var(--linie); }
  .termin:first-child { border-top: 0; }
  .termin .zeit { width: 44px; font-variant-numeric: tabular-nums; color: var(--leise); font-size: var(--schrift-klein); }
  .termin .was { flex: 1; min-width: 0; }
  .termin .was div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .termin .was small { color: var(--leise); font-size: var(--schrift-klein); }
  .terminliste { margin-top: var(--abstand-3); }
  .hinweis { font-size: var(--schrift-klein); color: var(--leise); padding: var(--abstand-3) 0 var(--abstand-1); }

  /* Blöcke */
  .block { display: flex; align-items: center; gap: var(--abstand-5); padding: var(--abstand-4) 0; border-top: 1px solid var(--linie); }
  .terminliste .block:first-child { border-top: 0; }
  .block.spaeter { opacity: .55; }
  .block .zeit { width: 44px; font-variant-numeric: tabular-nums; color: var(--leise); font-size: var(--schrift-klein); flex: none; }
  .block .was { flex: 1; min-width: 0; }
  .block .was div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block .was small { color: var(--leise); font-size: var(--schrift-klein); }
  .stat { display: flex; gap: var(--abstand-2); flex: none; }
  .stat button { width: 34px; height: 34px; border-radius: var(--radius-rund); background: var(--chip); font-weight: 700; font-size: var(--schrift-text);
    color: var(--leise); transition: transform .08s; }
  .stat button:active { transform: scale(.9); }
  .stat button.g.an { background: var(--gruen-gut); color: var(--weiss); }
  .stat button.t.an { background: var(--stat-gelb); color: var(--stat-gelb-text); }
  .stat button.n.an { background: var(--stat-grau); color: var(--weiss); }
  .pkt { font-size: var(--schrift-klein); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; color: var(--leise); flex: none; white-space: nowrap; }
  .pkt.plus { color: var(--gruen-gut); }
  .unterkopf { font-size: var(--schrift-mini); font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--titel); margin: var(--abstand-6) 0 0; }
  @keyframes hops { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .hops { animation: hops .4s ease-out; display: inline-block; }
  .balken { height: 6px; border-radius: var(--radius-klein); background: var(--linie); margin: var(--abstand-5) 0 var(--abstand-3); overflow: hidden; }
  .balken i { display: block; height: 100%; background: var(--akzent); }
  .reihe { display: grid; gap: var(--abstand-4); margin-top: var(--abstand-4); }

  /* Heute Karte nach Vorschau */

  /* Planen */
  #planen { position: fixed; inset: 0; z-index: 8; background: var(--bg); overflow-y: auto; display: none;
    padding: calc(var(--abstand-6) + env(safe-area-inset-top)) var(--abstand-7) calc(var(--abstand-10) + env(safe-area-inset-bottom)); }

  /* ── Mac: breites Layout (Klasse mac ab 760 px mit Maus oder Trackpad, mac3 ab 1100 px). Handy bleibt einspaltig ── */

  /* ── V69 Fokus: eine Liste nach Uhrzeit. Spalte Zeit, Strich in der Projektfarbe, Was, rechts Kästchen oder Knopf ── */
  .cos-tl { margin-top: var(--abstand-5); }

    font-weight: 700; font-size: var(--schrift-text); animation: cosanf 2.6s ease-in-out infinite; transition: transform .1s; }

  /* Morgens ohne Plan: eine Zeile mit Vorschlag */

  /* Bewegung */
  .cos-tr.rein, .cos-morgen.rein { animation: cosrein .42s cubic-bezier(.2, .8, .2, 1) both; }

/* ── Laden ── */
function cosLaden(erzwingen) {

  if (!erzwingen && (cosFehlt ? Date.now() - cosGeladen < 300000 : C && Date.now() - cosGeladen < 60000)) return;
  cosLaedt = true;
  const ab = Date.now();
  server('appChief').then(d => {
    cosGeladen = Date.now(); cosFehlt = false;
    if (!d || !d.projekte) return;
    if (cosAusstehend > 0 || ab < cosAenderung) return;   // eine Änderung ist unterwegs, deren Antwort bringt den neuen Stand
    cosUebernehmen(d);
  }).catch(e => {
    cosGeladen = Date.now();
    if (/Unbekannte Funktion/.test(String(e && e.message))) { cosFehlt = true; if (ansicht === 'chief') zeichnen(); }
  }).finally(() => { cosLaedt = false; });
}
function cosUebernehmen(d) {

/* Wie nacheinander, gibt aber die Antwort zurück */
function cosNach(fn, ...args) {
  offen++;
  let erg = null;
  kette = kette.then(() => server(fn, ...args)
    .then(d => { erg = d; offen--; geschrieben++; })
    .catch(e => { offen--; erg = null; melden(e.message || String(e)); }));
  return kette.then(() => erg);
}

/* ── Ändern: erst hier, dann beim Server. Jede Änderung merkt sich, wie sie zurückgeht ── */
function cosAnwenden(ops) {
  ops.forEach(o => {
    if (o.op === 'projekt') {
      const q = o.p;
      let p = C.projekte.find(x => x.id === q.id);
      if (q.status === 'weg') {
        if (p) { const name = p.name; C.projekte = C.projekte.filter(x => x !== p); C.schritte = C.schritte.filter(s => s.projekt !== name); }
        return;
      }
      if (!p) { p = { id: q.id, name: '', bereich: '', status: 'aktiv', deadline: '', art: 'ziel', wofuer: '', reserve: 0 }; C.projekte.push(p); }
      if (q.name && q.name !== p.name) {
        const alt = p.name;
        C.schritte.forEach(s => { if (s.projekt === alt) s.projekt = q.name; });
        p.name = q.name;
      }
      ['bereich', 'status', 'deadline', 'art', 'wofuer', 'reserve'].forEach(k => { if (q[k] !== undefined) p[k] = q[k]; });
      if (!p.deadline) p.art = 'ziel';
    } else if (o.op === 'reihe') {
      const r = {};
      o.ids.forEach((id, i) => { r[id] = i; });
      C.projekte = C.projekte.filter(p => r[p.id] != null).sort((a, b) => r[a.id] - r[b.id]).concat(C.projekte.filter(p => r[p.id] == null));
    } else if (o.op === 'schritte') {
      const p = cosPid(o.pid);
      if (!p) return;
      const bisher = {}, ids = {};
      C.schritte.forEach(s => { bisher[s.id] = s; });
      o.liste.forEach(x => { ids[x.id] = true; });
      const neu = o.liste.map(x => {
        const alt = bisher[x.id];
        return Object.assign({}, x, { projekt: p.name, min: alt ? alt.min : (x.min || 0), bl: alt ? alt.bl : (x.bl || {}) });
      });
      let stelle = C.schritte.findIndex(s => s.projekt === p.name);
      const rest = C.schritte.filter((s, i) => {
        const raus = s.projekt === p.name || ids[s.id];
        if (raus && i < stelle) stelle--;
        return !raus;
      });
      if (stelle < 0 || stelle > rest.length) stelle = rest.length;
      C.schritte = rest.slice(0, stelle).concat(neu, rest.slice(stelle));
    } else if (o.op === 'kapazitaet') C.kapazitaet = o.n;
  });
}
function cosAendern(ops, zurueck, name) {
  if (!C) return;
  if (cosServerAlt()) { melden('Der Server ist noch alt. Einmal ./bereitstellen.sh server'); return; }
  cosAnwenden(ops);
  if (zurueck) merken({ art: 'cosAend', tag: tagIso, ops: zurueck, name: name || 'Änderung' });
  cosSpeichern();
  cosAenderung = Date.now();
  zeichnen();
  cosSenden(ops);
}
function cosSenden(ops) {
  cosAusstehend++;
  cosNach('appChiefAendern', ops).then(d => {
    cosAusstehend--;
    if (cosAusstehend > 0) return;
    if (d && d.projekte) cosUebernehmen(d);
    else cosLaden(true);   // ging schief: Stand vom Server holen
  });
}
/* Rückgängig (aus rueckgaengig in AppSeite) */
function cosRueck(a) {
  if (a.art === 'cosGruppe') {   // V70: ein Tipp, mehrere Änderungen: alle zurück, die letzte zuerst
    a.teile.slice().reverse().forEach(t => { verlauf.push(t); rueckgaengig(); });
    melden('Rückgängig: ' + a.name);
    return;
  }
  const r = cosRueckTag(a);
  if (r === 'warte') { verlauf.push(a); $('undo').disabled = false; melden('Einen Moment, das wird noch angelegt. Dann geht Rückgängig.'); return; }
  if (r) { melden('Rückgängig: ' + a.name); return; }
  if (a.art === 'cosHaken') { cosHakenSetzen(a.id, a.alt, true); melden('Rückgängig: ' + a.name); return; }
  if (a.art === 'cosAend') { cosAendern(a.ops, null); melden('Rückgängig: ' + a.name); }

/* V70: mehrere Änderungen aus einem Tipp werden ein Eintrag im Verlauf. Ein Rückgängig nimmt alle zurück */

  fn();

  if (teile.length < 2) return;
  teile.forEach(x => verlauf.splice(verlauf.indexOf(x), 1));

/* Schritte eines Projekts in die Form fürs Ändern; Etappen bleiben zusammen, Geparktes steht hinten */

    weiterBei: s.weiterBei || '', wann: s.wann || '', verschoben: s.verschoben || 0, min: s.min || 0, bl: Object.assign({}, s.bl || {}) };

/* ── Rechnen ── */
function cosAlleBloecke() {

  return out;

function cosSchrittVon(b) {
  if (!C || !b) return null;
  const id = b.schritt || cosKeys[b.key];
  if (id) return C.schritte.find(s => s.id === id) || null;
  const ev = String(b.key || '').split('|')[0];   // verschobene Blöcke: gleiche Event ID, andere Startzeit
  return C.schritte.find(s => (s.bl && s.bl[b.key] != null) || (s.keys || []).some(k => String(k).split('|')[0] === ev)) || null;
}
/* Minuten eines Schritts: live aus den Blöcken im Paket, sonst der Stand vom Server */
function cosMin(s, alle) {
  alle = alle || cosAlleBloecke();
  const gesehen = {};
  let m = 0;
  Object.keys(s.bl || {}).forEach(k => {
    const x = alle.find(y => y.b.key === k);
    gesehen[k] = true;
    m += x ? fokusMin(x.iso, x.b) : (Number(s.bl[k]) || 0);
  });
  alle.forEach(x => { if (!gesehen[x.b.key] && (x.b.schritt === s.id || cosKeys[x.b.key] === s.id)) m += fokusMin(x.iso, x.b); });
  return m;

/* Kästchen eines Projekts: geschafft, offen, Reserve übrig. Geparktes zählt nicht zum Plan */
function cosZahlen(name, alle) {
  alle = alle || cosAlleBloecke();
  const p = cosNachName(name);
  let geschafft = 0, offen = 0, plan = 0;
  C.schritte.filter(s => s.projekt === name).forEach(s => {
    const sp = Math.floor(cosMin(s, alle) / COS_MIN);
    geschafft += sp;
    if (s.status === 'park') return;
    plan += s.k;
    if (s.status !== 'fertig') offen += Math.max(0, s.k - sp);
  });
  return { geschafft: geschafft, offen: offen, reserve: Math.max(0, plan + (p ? p.reserve : 0) - geschafft - offen) };

/* Was passt nicht mehr vor die Deadline: nach Deadline sortiert, Kapazität pro Woche auf Mo bis Fr verteilt (V90) */
function cosUeber(alle) {
  const out = {};
  if (!C) return out;
  const h = heute(), proTag = (Number(C.kapazitaet) || COS_KAP) / 5;
  let bedarf = 0, vergeben = 0;
  C.projekte.filter(p => p.status === 'aktiv' && p.deadline).map(p => ({ p: p, z: cosZahlen(p.name, alle) }))
    .sort((a, b) => a.p.deadline.localeCompare(b.p.deadline)).forEach(x => {
      const platz = x.p.deadline < h ? 0 : Math.floor(proTag * (cosArbeitstageBis(h, x.p.deadline) + (cosArbeitstag(h) ? 1 : 0)) + 1e-9);
      bedarf += x.z.offen;
      const u = Math.max(0, Math.min(x.z.offen, bedarf - platz - vergeben));
      vergeben += u; out[x.p.name] = u;

}
/* Reihenfolge der nächsten Schritte. Fest für heute zuerst. Sonst vor dem ersten Kästchen des Tages der Rang,
   danach zuerst, was nicht mehr passt. Schritte mit einem späteren festen Tag warten */
function cosKandidaten() {
  if (!C || !P) return [];
  const alle = cosAlleBloecke(), ueber = cosUeber(alle), h = heute();
  const aktiv = C.projekte.filter(p => p.status === 'aktiv');
  const fest = [], liste = [], drin = {};
  aktiv.forEach((p, rang) => C.schritte.forEach(s => {
    if (s.projekt === p.name && s.wann === h && cosOffen(s)) { fest.push({ p: p, s: s, rang: rang, ueber: ueber[p.name] || 0, min: cosMin(s, alle), fest: true }); drin[s.id] = true; }
  }));
  aktiv.forEach((p, rang) => {
    const s = C.schritte.find(x => x.projekt === p.name && cosOffen(x) && !drin[x.id] && !(x.wann && x.wann > h));
    if (s) liste.push({ p: p, s: s, rang: rang, ueber: ueber[p.name] || 0, min: cosMin(s, alle) });
  });

  const rot = x => x.ueber > 0 && (!vorErstem || x.p.art === 'extern');
  liste.sort((a, b) => (rot(b) - rot(a)) || (rot(a) && rot(b) ? a.p.deadline.localeCompare(b.p.deadline) : 0) || a.rang - b.rang);
  const alleK = fest.concat(liste);
  if (cosWahl) { const i = alleK.findIndex(x => x.s.id === cosWahl); if (i > 0) alleK.unshift(alleK.splice(i, 1)[0]); else if (i < 0) cosWahl = null; }
  return alleK;
}
function cosSitzung(s, min) { return Math.min(COS_SITZUNG, Math.max(1, Math.ceil(s.k - min / COS_MIN))) * COS_MIN; }
/* Etappen eines Projekts: Schritte mit derselben Etappe, in der Reihenfolge ihres ersten Auftretens. Geparktes extra */
function cosEtappen(liste) {
  const gruppen = [], idx = {};
  liste.forEach(s => {
    if (s.status === 'park') return;
    const n = s.abschnitt || '';
    if (idx[n] == null) { idx[n] = gruppen.length; gruppen.push({ name: n, schritte: [] }); }
    gruppen[idx[n]].schritte.push(s);
  });
  let laeuft = false;
  gruppen.forEach(g => {
    const offen = g.schritte.filter(cosOffen);
    g.fertig = !offen.length;
    g.grob = offen.length > 0 && offen.every(s => s.status === 'grob');
    g.zustand = g.fertig ? 'fertig' : g.grob ? 'grob geschätzt' : laeuft ? 'wartet' : 'läuft';
    if (!g.fertig && !g.grob) laeuft = true;
  });

/* ── Kästchen zeichnen ── */
function cosKq(farbe, klasse, teil) {
  return '<span class="kq' + (klasse ? ' ' + klasse : '') + '" style="--kf:' + farbe + '">' + (teil != null ? '<i style="height:' + Math.round(teil * 100) + '%"></i>' : '') + '</span>';

function cosViele(n, farbe, klasse, max) {
  n = Math.max(0, Math.round(n)); max = max || 60;
  let h = '';
  for (let i = 0; i < Math.min(n, max); i++) h += cosKq(farbe, klasse);
  return h + (n > max ? '<span class="kmehr">+' + (n - max) + '</span>' : '');

/* Kästchen eines Schritts: Schätzung, gefüllt was drin ist, darüber hinaus aus der Reserve */
function cosSchrittKq(s, farbe, min) {
  const voll = Math.floor(min / COS_MIN), teil = (min % COS_MIN) / COS_MIN, fertig = s.status === 'fertig';
  let h = cosViele(Math.min(voll, s.k), farbe, 'an', 12);
  if (!fertig) {
    if (voll < s.k) { h += teil > 0 ? cosKq(farbe, s.status === 'grob' ? 'gr' : '', teil) : cosKq(farbe, s.status === 'grob' ? 'gr' : ''); h += cosViele(s.k - voll - 1, farbe, s.status === 'grob' ? 'gr' : '', 12); }
  }
  if (voll > s.k) h += cosViele(voll - s.k, farbe, 'aus', 6);
  return h;
}

/* ── Kästchen des Tages: Fokuszeit durch 30. Reihe unter der Tageszahl ── */
function cosTag(iso) {
  const l = bloeckeVon(iso).filter(zaehlt).slice().sort((a, b) => a.start.localeCompare(b.start));
  const farben = [];
  let rest = 0, summe = 0, letzte = null;
  l.forEach(b => {
    let m = fokusMin(iso, b);
    if (m <= 0) return;
    summe += m; letzte = cosFarbe(b.bereich); m += rest;
    while (m >= COS_MIN) { farben.push(letzte); m -= COS_MIN; }
    rest = m;
  });
  return { farben: farben, rest: rest, summe: summe, letzte: letzte };
}

  const h = heute(), alle = cosAlleBloecke(), ueber = cosUeber(alle), kap = Number(C.kapazitaet) || COS_KAP;
  const tage = [];
  for (let i = 0; i < 7; i++) {   // V90: Sa und So 0, sonst Kapazität durch 5, der Rest geht an die ersten Tage der Woche
    const iso = tagPlus(ab || h, i), t = iso.split('-').map(Number), wt = new Date(Date.UTC(t[0], t[1] - 1, t[2])).getUTCDay();
    const cap = wt >= 1 && wt <= 5 ? Math.floor(kap / 5) + (wt - 1 < kap % 5 ? 1 : 0) : 0;
    tage.push({ iso: iso, cap: cap, k: 0, items: [], geschafft: 0 });
  }
  if (tage[0].iso === h) {
    tage[0].geschafft = cosTag(h).farben.length;
    tage[0].cap = Math.max(0, tage[0].cap - tage[0].geschafft);
  }
  const aktiv = C.projekte.filter(p => p.status === 'aktiv' && !(ohneSystem && p.bereich === 'System'));
  const warte = {};
  aktiv.forEach(p => {
    warte[p.id] = [];
    cosListe(p).forEach(s => {
      if (!cosOffen(s)) return;
      const rest = Math.max(0, s.k - Math.floor(cosMin(s, alle) / COS_MIN));
      if (!rest) return;
      const t = s.wann && tage.find(x => x.iso === s.wann);
      if (t) { t.items.push({ p: p, s: s, k: rest, fest: true }); t.k += rest; }
      else if (!s.wann || s.wann < h) warte[p.id].push({ p: p, s: s, rest: rest });
    });
  });
  // Wie am Tag: externe Deadline auf Rot zuerst, dann Rang 1, dann was nicht mehr passt, dann der Rang
  const rot = p => (ueber[p.name] || 0) > 0, idx = p => aktiv.indexOf(p);
  const ext = aktiv.filter(p => rot(p) && p.art === 'extern').sort((a, b) => a.deadline.localeCompare(b.deadline));
  const sonst = aktiv.filter(p => ext.indexOf(p) < 0);
  const reihe = ext.concat(sonst.length ? [sonst[0]].concat(sonst.slice(1).sort((a, b) => (rot(b) - rot(a)) || idx(a) - idx(b))) : []);
  tage.forEach(t => {
    let frei = t.cap - t.k, ri = 0, leer = 0;
    while (frei > 0 && reihe.length && leer < reihe.length) {
      const p = reihe[ri % reihe.length]; ri++;
      const q = warte[p.id];
      if (!q.length) { leer++; continue; }
      leer = 0;
      const x = q[0], n = Math.min(COS_SITZUNG, frei, x.rest);
      const da = t.items.find(y => y.s.id === x.s.id);
      if (da) da.k += n; else t.items.push({ p: p, s: x.s, k: n, fest: false });
      t.k += n; frei -= n; x.rest -= n;
      if (!x.rest) q.shift();
    }
  });
  return tage;
}

</style>
<div id="senBlatt" class="sen-blatt"></div>
<script>
/* ── Sensi: Tiefe ist Muße, nicht Arbeit. Nur Plus, ändert nichts am Tageswert. Daten aus appSensi (Tabs Signale und Werke) ──
   Aufbau als Liste von Abschnitten (SEN_ABSCHNITTE). Neuer Abschnitt: eine Zeile dort und eine Funktion, die HTML liefert. */

const SEN_SPEICHER = 'zentrale_sensi_1', SEN_UHR_SPEICHER = 'zentrale_sensi_uhr';
const SEN_ABSCHNITTE = [
  { id: 'kopf', breit: true, html: senKopfHtml },
  { id: 'lesen', html: senLesenHtml },
  { id: 'gesehen', html: senGesehenHtml },
  { id: 'audio', html: senAudioHtml },
  { id: 'handy', html: senHandyHtml }

let SN = {};                  // Pakete je Tag vom Server
let senUhrL = null;           // laufende Uhr { art, werkId, start }
let senFehlt = false, senAusstehend = 0, senPopBis = 0, senNeuBis = 0;
const senLaedt = {}, senGeladen = {};
let senB = null;              // offenes Blatt
try { SN = JSON.parse(localStorage.getItem(SEN_SPEICHER) || '{}') || {}; } catch (e) { SN = {}; }
try { senUhrL = JSON.parse(localStorage.getItem(SEN_UHR_SPEICHER) || 'null'); } catch (e) { senUhrL = null; }

/* ── Laden: sofort aus dem Gerätespeicher, frisch im Hintergrund ── */
function senLaden(iso, erzwingen) {
  if (!iso || senLaedt[iso] || typeof server !== 'function') return;
  if (!erzwingen && SN[iso] && Date.now() - (senGeladen[iso] || 0) < 60000) return;
  if (!erzwingen && senFehlt && Date.now() - (senGeladen[iso] || 0) < 300000) return;
  senLaedt[iso] = true;
  const ab = Date.now();
  server('appSensi', iso).then(d => {
    senGeladen[iso] = Date.now(); senFehlt = false;
    if (!d || senAusstehend > 0 || ab < senLetzte) return;   // eine Änderung ist unterwegs, deren Antwort bringt den neuen Stand
    senUebernehmen(d);
  }).catch(e => {
    senGeladen[iso] = Date.now();
    if (/Unbekannte Funktion/.test(String(e && e.message))) { senFehlt = true; if (ansicht === 'sensi') zeichnen(); }
  }).finally(() => { senLaedt[iso] = false; });
}
let senLetzte = 0;
function senUebernehmen(d) {
  if (!d || !d.datum) return;
  SN[d.datum] = d;
  const tage = Object.keys(SN).sort();
  tage.slice(0, Math.max(0, tage.length - 10)).forEach(t => { delete SN[t]; });
  if (!d.fehlt && senAusstehend === 0) senUhrSetzenL(d.uhr || null);
  senSpeichern();
  if (ansicht === 'sensi' && tagIso === d.datum) zeichneSensi();
}
function senSpeichern() { try { localStorage.setItem(SEN_SPEICHER, JSON.stringify(SN)); } catch (e) { /* ohne Speicher */ } }
function senUhrSetzenL(u) {
  senUhrL = u && u.start ? u : null;
  try { localStorage.setItem(SEN_UHR_SPEICHER, JSON.stringify(senUhrL)); } catch (e) { /* egal */ }
}
/* Wie nacheinander, gibt die Antwort zurück. Kommt ein Paket mit, ersetzt es den Stand, sobald nichts mehr unterwegs ist */
function senNach(fn, ...args) {
  offen++; senAusstehend++; senLetzte = Date.now();
  let erg = null;
  kette = kette.then(() => server(fn, ...args)
    .then(d => { erg = d; })
    .catch(e => { erg = null; melden(e.message || String(e)); }))
    .then(() => {
      offen--; geschrieben++; senAusstehend--;
      if (erg && erg.paket && senAusstehend === 0) senUebernehmen(erg.paket);
      else if (!erg && senAusstehend === 0) senLaden(tagIso, true);   // ging schief: Stand vom Server holen
    });
  return kette.then(() => erg);
}

/* ── Rechnen wie der Server (nur für die sofortige Anzeige, die Antwort ersetzt es) ── */
function senP() { const d = SN[tagIso]; return (d && d.punkte) || { lesen: { je: 15, punkte: 1, ab: 15 }, buch: { fertig: 3, ganz: 2 }, film: { ganz: 3, handyWeg: 1, nichtGanz: 0 }, serie: 0 }; }
function senLesenPkt(min) { const L = senP().lesen; return min >= L.ab ? Math.floor(min / L.je) * L.punkte : 0; }
function senFilmPkt(f) { const F = senP().film; if (f.art === 'Serie') return senP().serie || 0; return f.ganz ? F.ganz + (f.handyWeg || f.ort === 'Kino' ? F.handyWeg : 0) : F.nichtGanz; }
function senZahl(x) { return String(Math.round((Number(x) || 0) * 10) / 10).replace('.', ','); }
function senKopie(x) { return JSON.parse(JSON.stringify(x)); }
function senMin() { return senUhrL ? Math.max(0, Math.round((Date.now() - senUhrL.start) / 60000)) : 0; }
/* Tag einer Lesesitzung: bis 5 Uhr zählt zum Vortag (der Server nimmt dazu die Einschlafzeit) */
function senTagVon(ms) { const d = new Date(ms); return d.getHours() < 5 ? tagPlus(isoVon(d), -1) : isoVon(d); }

function senGewinn(iso, punkte, text, teil) {
  const d = SN[iso];
  if (!d) { melden(text); return; }
  const vorher = d.tiefe || 0;
  d.tiefe = Math.round((vorher + punkte) * 10) / 10;
  d.woche = Math.round(((d.woche || 0) + punkte) * 10) / 10;
  (d.wocheTage || []).forEach(t => { if (t.tag === iso) t.tiefe = d.tiefe; });
  if (teil) { (d.teile = d.teile || []).push(teil); senNeuBis = Date.now() + 900; }
  melden(text + (punkte > 0 ? ' · +' + senZahl(punkte) + ' Tiefe · ' + senZahl(vorher) + ' → ' + senZahl(d.tiefe) : ''));

function senFliegt(p) {

/* ── Zeichnen ── */
function zeichneSensi() {
  const h = heute(), liste = tageListe(), i = liste.indexOf(tagIso);

  const teile = SEN_ABSCHNITTE.map(a => ({ a: a, html: a.html(d) })).filter(x => x.html);

/* Kopf: Tiefe heute, Balken 1 bis 10, Tiefe Woche, darunter woher die Punkte kommen */
function senKopfHtml(d) {
  const pop = Date.now() < senPopBis ? ' class="pop"' : '';

  // Unter dem Ring wie im Tag: eine Legende (woher die Tiefe kommt, kurz) und eine Zeile in Höhe von "Kästchen einsammeln"
  const leg = (d.teile || []).map((t, i, l) => '<span' + (Date.now() < senNeuBis && i === l.length - 1 ? ' class="neu"' : '') + ' title="' + esc(t.text) + '">' + esc(senKurz(t)) +
    (t.punkte ? ' <b>+' + senZahl(t.punkte) + '</b>' : '') + '</span>').join('');
  const reihe = P && P.bloecke ? '<div class="cos-reihe">' + (leg ? '' : 'Lesen und Filme geben Tiefe.') + '</div>' : '';
  return '<div class="sen-kopf"><div class="sen-zahl"><small>' + esc(name) + '</small><b id="senHeute"' + pop + '>' + senZahl(d.tiefe) + '</b></div>' +

    '<div class="sen-zahl"><small>Tiefe Woche</small><b id="senWoche">' + senZahl(d.woche) + '</b></div></div>';
}
/* Kurzname für die Legende unter dem Ring, der ganze Text steht als title daran */
function senKurz(t) {
  const x = String(t.text || '');
  if (t.art === 'lesen') return (x.match(/^Lesen \d+ min/) || ['Lesen'])[0];
  return { buch: 'Buch fertig', film: 'Film', serie: 'Serie' }[t.art] || x.split(' ')[0];
}
/* Wert des Tages von 1 bis 10. Vorläufig: Tiefe des Tages, ein Punkt eine Stufe, höchstens 10.
   Die Gewichtung bauen wir später, dann ändert sich nur diese Funktion */
function senWert(d) { const t = Number(d && d.tiefe) || 0; return t > 0 ? Math.min(10, t) : null; }
let senBalkenStand = { iso: null, w: 0 };   // zuletzt gezeigt, damit der Balken vom alten Stand aus wächst
function senBalkenHtml(d) {
  const w = senWert(d), alt = senBalkenStand.iso === d.datum ? senBalkenStand.w : 0, neu = w == null ? 0 : w;

    '<div class="sen-balken-skala"><span>1</span><span>10</span></div></div>';
}

function senCover(w, klein) {

/* Lesen: aktuelles Buch mit Cover und Seite, Start oder laufende Uhr, weitere Bücher, Sitzungen des Tages */
function senLesenHtml(d) {
  const buecher = d.buecher || [];

      (haupt.von ? '<small>' + esc(haupt.von) + '</small>' : '') + '<div class="sen-seite">S. ' + (haupt.seite || 0) + (haupt.umfang ? ' von ' + haupt.umfang : '') + '</div>' +

}
function senStoppBlatt() {

  senBlattAuf({ art: 'stopp', seite: b ? b.seite : 0, umfang: b ? b.umfang : 0, fertig: false, titel: b ? b.titel : 'Lesen' });

function senStoppSenden() {
  if (!senUhrL || !senB) return;

  const fertig = !!senB.fertig, uhr = senUhrL, min = senMin();
  const iso = senTagVon(uhr.start), d = SN[iso], vorher = d ? senKopie(d) : null;
  const b = d && (d.buecher || []).find(x => x.id === uhr.werkId);
  const titel = b ? b.titel : '';
  let p = senLesenPkt(min);
  const ein = { zeit: zwei(new Date(uhr.start).getHours()) + ':' + zwei(new Date(uhr.start).getMinutes()), min: min, titel: titel, notiz: b ? 'S. ' + (b.seite || 0) + ' bis ' + seite : '', punkte: p };
  if (d) {
    (d.lesen = d.lesen || []).push(ein);

  }

  merken(eintrag);

  if (fertig) senGewinn(iso, senP().buch.fertig, titel + ' beendet', { text: titel + ' beendet', punkte: senP().buch.fertig });
  zeichnen();
  senNach('appSensiStopp', { seite: seite, fertig: fertig }).then(r => { if (r && r.schluessel) eintrag.schluessel = r.schluessel; else if (!r) { eintrag.kaputt = true; } });
}
function senVerwerfen() {

/* ── Rückgängig (aus rueckgaengig in AppSeite) ── */
function senRueck(a) {
  if (a.art === 'senStart') {
    senUhrSetzenL(null); zeichnen();
    senNach('appSensiStopp', { verwerfen: true });
  } else if (a.art === 'senVerwerfen') {
    senUhrSetzenL(a.uhr); zeichnen();
    senNach('appSensiStart', a.uhr.art, a.uhr.werkId, a.uhr.start);
  } else if (a.art === 'senStopp') {
    if (a.kaputt) { melden('Das wurde nicht gespeichert.'); return; }
    if (!a.schluessel) { verlauf.push(a); $('undo').disabled = false; melden('Einen Moment, das wird noch gespeichert. Dann geht Rückgängig.'); return; }
    if (a.vorher) SN[a.iso] = a.vorher;
    senUhrSetzenL(a.uhr); zeichnen();
    senNach('appSensiZurueck', a.schluessel, true);
  } else if (a.art === 'senWerk') {
    if (!a.zurueck) { verlauf.push(a); $('undo').disabled = false; melden('Einen Moment, das wird noch gespeichert. Dann geht Rückgängig.'); return; }
    if (a.vorher) SN[a.iso] = a.vorher;
    zeichnen();
    senNach('appSensiWerk', a.zurueck.op, Object.assign({ tag: a.iso }, a.zurueck.daten));
  }
  melden('Rückgängig: ' + a.name);
}

/* Bücher und Filme ändern: sofort hier, dann beim Server. Der Server gibt den Gegenschritt für Rückgängig */
function senWerk(op, daten, name, lokal) {
  const iso = tagIso, d = SN[iso];
  const eintrag = { art: 'senWerk', tag: iso, iso: iso, vorher: d ? senKopie(d) : null, zurueck: null, name: name };
  if (d && lokal) lokal(d);
  merken(eintrag);
  zeichnen();
  return senNach('appSensiWerk', op, Object.assign({ tag: iso }, daten)).then(r => {
    if (r && r.zurueck) eintrag.zurueck = r.zurueck;
    else { const i = verlauf.indexOf(eintrag); if (i >= 0) verlauf.splice(i, 1); $('undo').disabled = !verlauf.length; }
    return r;
  });
}

/* V75 Reiter Köö: die Bereiche Schlaf und Körper aus der Tabelle stehen dort statt im Tag. Daten und Tageswert bleiben gleich */
/* V77: Zuordnung nach dem Namen der Spalte (Anfang reicht), egal in welchem Bereich sie in der Tabelle steht.

/* Felder als HTML: braucht nur noch Sensi (Handy Haken, Bildschirm) und die Werkbank. Tag und Köö zeichnen die React Felder in ui/src/felder/ */

      }

      });

/* Mac: ein Balken aus den Bereichen, darunter beim Aufklappen die Liste. Farben fest pro Bereich */
const MAC_FARBEN = Object.assign({}, COS_FARBEN, { Claude: stilWert('--bereich-claude'), Ablenkung: stilWert('--bereich-ablenkung'), Sonstiges: stilWert('--bereich-sonstiges') });   // Stufe 2: aus basis.css
function macFarbe(b) { return MAC_FARBEN[b] || MAC_FARBEN.Sonstiges; }

function macListe(l, anz) {

/* Check ins: drei Fenster pro Tag. Unter der Skala steht, welche schon eingetragen sind, das laufende ist markiert */
/* V93: auch Halsi und Migna in Köö (Karte Körper), gleicher Aufbau wie Stimmung */
const CHECKIN_FELDER = ['Stimmung 1/10', 'Energie 1/10', 'Konzentration 1/10', 'Halsi 1/10', 'Migna 1/10'];
const istCheckin = f => !!f && f.mehrfach && CHECKIN_FELDER.indexOf(f.spalte) !== -1;
const CHECKIN = [['Morgens', 0, 12 * 60], ['Mittags', 12 * 60, 17 * 60], ['Abends', 17 * 60, 24 * 60]];
function checkinFenster(liste) {
  return CHECKIN.map(([name, von, bis]) => {
    const drin = liste.filter(e => { const m = /^\d{1,2}:\d{2}$/.test(e.zeit) ? minVon(e.zeit) : -1; return m >= von && m < bis; });
    return { name: name, von: von, bis: bis, wert: drin.length ? drin[drin.length - 1].wert : null };
  });
}
/* Nur das laufende Fenster: offen pulsiert ein Punkt, eingetragen erscheint ein Haken mit kleinem Sprung */
let checkinNeu = { spalte: '', t: 0 };
function checkinHtml(f, liste) {
  if (tagIso !== heute()) return '';
  const jm = jetztMin(), c = checkinFenster(liste).find(x => jm >= x.von && jm < x.bis);
  if (!c) return '';
  const frisch = checkinNeu.spalte === f.spalte && Date.now() - checkinNeu.t < 1500;
  return c.wert != null
    ? '<div class="ci-status drin' + (frisch ? ' frisch' : '') + '"><span class="ci-haken">✓</span>' + c.name + ' drin</div>'
    : '<div class="ci-status offen"><span class="ci-punkt"></span>' + c.name + ' noch offen</div>';
}
/* Karte (Kopf, in Köö Körper): wie viele Check ins im laufenden Fenster noch fehlen. Ohne Liste: alle Felder */
function checkinFehlt(f) {
  if (tagIso !== heute() || !istCheckin(f)) return false;
  const jm = jetztMin(), c = CHECKIN.find(([, von, bis]) => jm >= von && jm < bis);
  if (!c) return false;
  return !checkinFenster((zelle(f.spalte) || {}).eintraege || []).some(x => x.name === c[0] && x.wert != null);
}
function checkinOffen(felder) {
  if (!P) return 0;
  return (felder || P.felder).filter(checkinFehlt).length;
}

/* Mehrfach: jedes Antippen ist ein neuer Eintrag, oben steht der Schnitt */
/* V67: Skala 1 bis 10 in der Farbe des Bereichs, nach oben kräftiger */
function skalaTon(f, n) { return f && f.farbe ? 'background:color-mix(in srgb, ' + f.farbe + ' ' + (5 + n * 2.3).toFixed(0) + '%, var(--chip));' : ''; }
function mehrfachHtml(f, id, w, s, kopf, pille) {

/* Geld Karte: Ausgaben der letzten 7 Tage (heute zählt mit). Antippen zeigt die Abbuchungen nach Tag, neuester zuerst */
const SIEBEN = 'Ausgaben 7 Tage';
function siebenHtml(f) {

  const werte = tage.map(iso => wertVon(f.spalte, iso)).filter(x => typeof x === 'number');
  const geld = x => x.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const summe = werte.reduce((x, y) => x + y, 0), schnitt = werte.length ? summe / werte.length : null;

    }).join('');

  }
