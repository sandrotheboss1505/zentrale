<!DOCTYPE html>
<html lang="de">
<head>
<title>Zentrale Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Test">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#073763">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3EF; --karte: #FFFFFF; --text: #232321; --leise: #77756F; --linie: #E6E4DE;
    --akzent: #1155CC; --chip: #F1EFEA; --schatten: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --karte: #1F1F1D; --text: #EDEBE6; --leise: #9C9A93; --linie: #2E2E2B;
            --akzent: #7BA4F0; --chip: #2A2A27; --schatten: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  .logo { background: #073763; padding: calc(16px + env(safe-area-inset-top)) 16px 16px; text-align: center; }
  .logo span { font: italic 800 34px/1 Inter, -apple-system, sans-serif; color: #FFFFFF; letter-spacing: .01em; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
  .titel { flex: 1; text-align: center; }
  .titel b { display: block; font-size: 17px; }
  .titel span { font-size: 12px; color: var(--leise); }
  .rund { width: 38px; height: 38px; border-radius: 19px; background: var(--karte); box-shadow: var(--schatten);
    display: grid; place-items: center; font-size: 18px; position: relative; }
  .rund:disabled { opacity: .3; }
  .rund.dreht svg { animation: drehen 1s linear infinite; }
  @keyframes drehen { to { transform: rotate(360deg); } }
  #neu.sync::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
    border-radius: 4px; background: var(--akzent); }

  main { padding: 4px 16px 16px; max-width: 560px; margin: 0 auto; }
  .karte { background: var(--karte); border-radius: 18px; box-shadow: var(--schatten); padding: 14px 16px; margin-bottom: 12px; }
  .bereich { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; color: var(--leise); margin-bottom: 6px; }
  .punkt { width: 8px; height: 8px; border-radius: 4px; }

  .tageszahl { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 18px; padding: 10px 0 22px; }
  .neben { display: flex; flex-direction: column; gap: 10px; justify-self: start; }
  .neben.links { justify-self: end; text-align: right; }
  .neben small { display: block; font-size: 11px; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .neben b { display: inline-block; font-size: 15px; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 8px; background: var(--chip); white-space: nowrap; }
  .tageszahl .zahl.pop { animation: hzpop .5s ease-out; }
  .tageszahl .zahl { width: 96px; height: 96px; border-radius: 48px; display: grid; place-items: center;
    font-size: 34px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

  .feld { padding: 10px 0; border-top: 1px solid var(--linie); }
  .bereich + .feld { border-top: 0; }
  .zeile { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
  .name { font-size: 15px; }
  .name small { color: var(--leise); font-size: 12px; margin-left: 6px; }
  .pille { padding: 4px 10px; border-radius: 10px; font-weight: 600; font-variant-numeric: tabular-nums;
    min-width: 44px; text-align: center; background: var(--chip); }
  .leer { color: var(--leise); font-weight: 400; }

  .skala { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 8px; }
  .skala button { height: 36px; border-radius: 10px; background: var(--chip); font-weight: 600; font-variant-numeric: tabular-nums;
    transition: transform .08s; }
  .skala button:active { transform: scale(.92); }
  .skala.wahl { grid-template-columns: repeat(3, 1fr); }
  .eintraege { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .eintraege button { font-size: 13px; padding: 4px 8px; border-radius: 9px; background: var(--chip);
    font-variant-numeric: tabular-nums; color: var(--text); }
  .eintraege button i { font-style: normal; color: var(--leise); margin-left: 4px; }

  .zaehler { display: flex; align-items: center; gap: 6px; }
  .zaehler button { width: 34px; height: 34px; border-radius: 17px; background: var(--chip); font-size: 20px; line-height: 1; }
  .zaehler .pille { min-width: 40px; }

  .schalter { width: 50px; height: 30px; border-radius: 15px; background: var(--linie); position: relative; transition: background .15s; }
  .schalter::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .schalter.an::after { transform: translateX(20px); }

  input[type=time], input[type=text], textarea {
    font: inherit; color: var(--text); background: var(--chip); border: 0; border-radius: 10px; padding: 7px 10px; }
  input[type=time] { min-width: 96px; text-align: center; }
  input[type=text] { width: 140px; text-align: right; }
  textarea { width: 100%; min-height: 84px; margin-top: 8px; resize: vertical; }
  .loeschen { font-size: 13px; color: var(--leise); margin-left: 6px; }
  .jetzt { padding: 8px 16px; border-radius: 12px; font-weight: 600; color: #fff; }
  .unter { font-size: 12px; color: var(--leise); text-align: right; margin-top: 4px; }
  .zuletzt { color: #D5A6BD; font-weight: 600; }
  .ci-offen { margin-left: auto; font-size: 11px; font-weight: 600; color: #B0577F; text-transform: none; letter-spacing: 0; }
  .ci-status { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; font-size: 12px; font-weight: 600; }
  .ci-status.offen { color: #B0577F; }
  .ci-status.drin { color: var(--leise); font-weight: 500; }
  .ci-punkt { width: 8px; height: 8px; border-radius: 4px; background: #D5A6BD; animation: ciatmen 1.6s ease-in-out infinite; }
  @keyframes ciatmen { 0%, 100% { transform: scale(.8); opacity: .6; } 50% { transform: scale(1.3); opacity: 1; } }
  .ci-haken { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 8px; background: #D5A6BD; color: #fff; font-size: 10px; }
  .ci-status.frisch .ci-haken { animation: cihaken .5s cubic-bezier(.3, 1.6, .5, 1); }
  .ci-status.frisch { animation: ciein .5s ease-out; }
  @keyframes cihaken { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes ciein { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
  /* Jedes Antippen federt kurz nach, auch wenn die Ansicht dabei neu gezeichnet wird */
  .tipp { animation: tipp .32s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tipp { 0% { transform: scale(.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .jetztwahl { display: flex; align-items: center; gap: 6px; }
  .jetztwahl .jetzt { padding: 7px 14px; }
  .nicht { font-size: 12px; color: var(--leise); text-decoration: underline; margin-top: 6px; }

  .termin { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--linie); }
  .termin:first-child { border-top: 0; }
  .termin .zeit { width: 44px; font-variant-numeric: tabular-nums; color: var(--leise); font-size: 14px; }
  .termin .was { flex: 1; min-width: 0; }
  .termin .was div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .termin .was small { color: var(--leise); font-size: 12px; }
  .haken { width: 30px; height: 30px; border-radius: 15px; border: 2px solid var(--linie); display: grid; place-items: center; flex: none; }
  .haken svg { opacity: 0; }
  .haken.an svg { opacity: 1; }
  .terminliste { margin-top: 6px; }
  .hinweis { font-size: 13px; color: var(--leise); padding: 6px 0 2px; }

  .tag-zeile { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linie); width: 100%; text-align: left; }
  .tag-zeile:first-child { border-top: 0; }
  .tag-zeile .datum { width: 86px; font-weight: 600; white-space: nowrap; flex: none; }
  .tag-zeile .mini { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; }
  .mini span { font-size: 12px; padding: 2px 7px; border-radius: 7px; background: var(--chip); font-variant-numeric: tabular-nums; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--karte); border-top: 1px solid var(--linie);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; padding: 12px 0 10px; font-size: 13px; color: var(--leise); }
  nav button.aktiv { color: var(--akzent); font-weight: 600; }

  #meldung { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #2b2b29; color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; z-index: 9; }
  #meldung.sichtbar { opacity: 1; }
  .laden { text-align: center; color: var(--leise); padding: 60px 0; }
  .klappbar { cursor: pointer; }
  .pfeil { display: inline-block; color: var(--leise); font-size: 11px; margin-left: 6px; transition: transform .15s; }
  .klappbar.auf .pfeil { transform: rotate(90deg); }
  .liste { margin-top: 8px; }
  .posten { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; border-top: 1px solid var(--linie); }
  .posten:first-child { border-top: 0; }
  .posten .pzeit { font-size: 12px; color: var(--leise); font-variant-numeric: tabular-nums; width: 38px; flex: none; }
  .posten .ppunkt { font-size: 10px; width: 14px; text-align: center; flex: none; }
  .posten .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .posten .pbetrag { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .knopf { display: inline-block; margin-top: 10px; padding: 9px 14px; border-radius: 12px; background: var(--akzent); color: #fff; font-weight: 600; }

  /* Blöcke */
  .block { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linie); }
  .terminliste .block:first-child { border-top: 0; }
  .block.spaeter { opacity: .55; }
  .block .zeit { width: 44px; font-variant-numeric: tabular-nums; color: var(--leise); font-size: 14px; flex: none; }
  .block .was { flex: 1; min-width: 0; }
  .block .was div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block .was small { color: var(--leise); font-size: 12px; }
  .stat { display: flex; gap: 5px; flex: none; }
  .stat button { width: 34px; height: 34px; border-radius: 17px; background: var(--chip); font-weight: 700; font-size: 15px;
    color: var(--leise); transition: transform .08s; }
  .stat button:active { transform: scale(.9); }
  .stat button.g.an { background: #0B8043; color: #fff; }
  .stat button.t.an { background: #F6BF26; color: #3A2F00; }
  .stat button.n.an { background: #616161; color: #fff; }
  .pkt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; color: var(--leise); flex: none; white-space: nowrap; }
  .pkt.plus { color: #0B8043; }
  .unterkopf { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--leise); margin: 12px 0 0; }
  @keyframes hops { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .hops { animation: hops .4s ease-out; display: inline-block; }
  /* Heute Karte */
  .lbl { font-size: 12px; color: var(--leise); margin: 14px 0 6px; }
  .jetztbox { background: var(--chip); border-radius: 14px; padding: 12px 14px; }
  .jtitel { font-size: 16px; font-weight: 700; line-height: 1.35; }
  .jmeta { font-size: 12px; color: var(--leise); margin-top: 3px; }
  .balken { height: 6px; border-radius: 3px; background: var(--linie); margin: 10px 0 6px; overflow: hidden; }
  .balken i { display: block; height: 100%; background: var(--akzent); }
  .jzeit { display: flex; justify-content: space-between; font-size: 13px; color: var(--leise); }
  .jzeit b { color: var(--text); }
  .dranbox { border-top: 1px solid var(--linie); margin-top: 10px; padding-top: 10px; font-size: 14px; }
  .reihe { display: grid; gap: 8px; margin-top: 8px; }
  .reihe.zwei { grid-template-columns: 1fr 1fr; }
  .reihe.drei { grid-template-columns: repeat(3, 1fr); }
  .reihe button { height: 42px; border-radius: 12px; background: var(--karte); font-weight: 600; }
  .reihe button:active { transform: scale(.96); }
  .jfuss { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--leise); margin-top: 6px; }
  .jfuss .nicht { margin-top: 0; }
  .lob { color: #0B8043; font-weight: 600; }
  .erl { display: flex; gap: 10px; align-items: baseline; font-size: 14px; padding: 6px 0; }
  .erl .z { width: 40px; flex: none; color: var(--leise); font-size: 13px; font-variant-numeric: tabular-nums; }
  .erl .r { margin-left: auto; font-size: 13px; color: #0B8043; font-weight: 600; white-space: nowrap; }
  .erl .r.leise { color: var(--leise); font-weight: 400; }
  .erl.task { color: var(--leise); }
  .aendern { font-size: 11px; color: var(--leise); font-weight: 400; margin-left: 6px; }
  .ok { color: #0B8043; } .halb { color: #C99A06; } .weg { color: var(--leise); }
  .trenn { border-top: 1px solid var(--linie); margin-top: 14px; }
  /* Heute Karte, Variante B */
  .hkopf { display: flex; align-items: center; gap: 10px; }
  .hkopf .name { flex: 1; }
  .plus { width: 34px; height: 34px; border-radius: 17px; background: var(--chip); font-size: 22px; line-height: 1; }
  .tbar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; margin: 10px 0 3px; }
  .tbar i { display: block; height: 100%; background: var(--akzent); border-radius: 3px; }
  .tlegende { display: flex; justify-content: space-between; font-size: 11px; color: var(--leise); }
  .jetztbox { margin-top: 12px; padding: 11px 13px; }
  .jtitel { font-size: 15px; }
  .jvor { font-size: 12px; color: var(--leise); margin-bottom: 2px; }
  .pillen { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .pillen button { padding: 7px 13px; border-radius: 999px; background: var(--karte); font-size: 13px; font-weight: 600; }
  .pillen button:active { transform: scale(.95); }
  .pillen .zahl { margin-left: auto; font-size: 12px; color: var(--leise); }
  .jmeld { font-size: 13px; margin-top: 8px; }
  .wahl .dauerfrei { min-width: 0; width: 100px; height: 36px; padding: 0 10px; border-radius: 12px;
    background: var(--rosa-hell); color: var(--rosa); font-weight: 600; font-variant-numeric: tabular-nums; }
  .wahl .dauerfrei.an { box-shadow: inset 0 0 0 2px var(--rosa); }
  /* Heute Karte nach Vorschau */
  :root { --akzent-hell: #E6F1FB; --gruen: #3B6D11; --gruen-hell: #EAF3DE; --kreis: #B4B2A9;
    --gold: #8A6A00; --gold-hell: #FBF1D2; --rosa: #A3416F; --rosa-hell: #F8E3ED; --rosa-voll: #C2507F; --rosa-auf: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --akzent-hell: rgba(123,164,240,.18); --gruen: #97C459; --gruen-hell: rgba(151,196,89,.16); --kreis: #5F5E5A;
    --gold: #E9C46A; --gold-hell: rgba(233,196,106,.16); --rosa: #E7B3CC; --rosa-hell: rgba(213,166,189,.2); --rosa-voll: #E7B3CC; --rosa-auf: #4B1528; } }
  #heuteBox { padding: 0; border-top: 0; }
  .hz-kopf { display: flex; align-items: center; gap: 10px; }
  .hz-kopf .n { font-size: 15px; font-weight: 500; flex: 1; }
  .hz-zeit { font-size: 15px; font-weight: 500; padding: 3px 10px; border-radius: 8px; background: var(--rosa-hell); color: var(--rosa); font-variant-numeric: tabular-nums; }
  .hz-plus { width: 36px; height: 36px; border-radius: 18px; background: var(--rosa-voll); color: var(--rosa-auf); font-size: 26px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
  .hz-plus:active { transform: scale(.92); }
  .hz-leg { display: flex; justify-content: space-between; font-size: 12px; color: var(--leise); }
  .hz-von { font-size: 13px; color: var(--leise); font-variant-numeric: tabular-nums; }
  .hz-seg { display: flex; gap: 3px; height: 8px; margin: 10px 0 4px; }
  .hz-seg span { position: relative; min-width: 4px; border-radius: 4px; background: var(--rosa-hell); overflow: hidden; }
  .hz-seg span.rest { background: var(--chip); }
  .hz-seg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--rosa-voll); }
  .hz-uhr { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .hz-uhr b { font-size: 20px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .hz-uhr span { font-size: 12px; color: var(--leise); }
  .hz-knoepfe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .hz-knoepfe button { height: 40px; border-radius: 10px; background: var(--karte); font-size: 13px; font-weight: 500; transition: transform .08s; }
  .hz-knoepfe button:active { transform: scale(.94); }
  .hz-knoepfe .hz-dran { background: var(--gruen-hell); color: var(--gruen); font-weight: 600; }
  @keyframes hzpuls { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .hz-knoepfe .hz-dran.puls { animation: hzpuls 1.4s ease-in-out infinite; }
  .hz-zeitbox { position: relative; }
  .hz-zeit.pop { animation: hzpop .4s ease-out; display: inline-block; }
  @keyframes hzflug { 0% { opacity: 0; transform: translate(-50%, 4px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -22px); } }
  .hz-flug { position: absolute; left: 50%; top: -6px; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--gruen); pointer-events: none; animation: hzflug 1.8s ease-out forwards; }
  @keyframes hzfeier { 0% { background: var(--rosa-voll); } 100% { background: var(--chip); } }
  .hz-jetzt.feier { animation: hzfeier 1.4s ease-out; }
  .hz-jetzt { background: var(--chip); border-radius: 12px; padding: 11px 13px; margin-top: 14px; }
  .hz-vor { font-size: 12px; color: var(--leise); margin-bottom: 2px; }
  .hz-titel { font-size: 15px; font-weight: 500; line-height: 1.35; }
  .hz-bar { height: 6px; border-radius: 3px; background: var(--karte); overflow: hidden; margin: 9px 0 6px; }
  .hz-bar i { display: block; height: 100%; background: var(--akzent); }
  .hz-zeile { display: flex; justify-content: space-between; font-size: 12px; color: var(--leise); }
  .hz-zeile b { font-weight: 500; color: var(--text); }
  .hz-meta { font-size: 12px; color: var(--leise); margin-top: 3px; }
  .hz-melde { font-size: 13px; margin-top: 8px; }
  .hz-melde.lob { color: var(--gruen); font-weight: 500; }
  @keyframes hzpop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .hz-melde.hops { animation: hzpop .35s ease-out; display: block; transform-origin: left center; }
.hz-start { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; height: 52px; margin-top: 12px; border-radius: 12px; background: var(--akzent); color: #fff; font-size: 16px; font-weight: 600; }
.hz-start .play { font-size: 12px; }
.hz-start i { font-style: normal; font-weight: 500; opacity: .8; }
.hz-start:active { transform: scale(.97); }
  .hz-k2 { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 2px; }
  .hz-k2 .h { font-size: 13px; font-weight: 500; }
  .hz-k2 .s { font-size: 12px; color: var(--leise); }

const ZENTRALE_API = 'https://script.google.com/macros/s/AKfycby_mlOvm6veeRy8tqW0SyjI4XqaZJRVt_dUFyv5VV2n9KsCfKVsX45EeMVUHlcNyV0FXA/exec';

  if (document.getElementById('schluessel')) return;
  const d = document.createElement('div');
  d.id = 'schluessel';
  d.innerHTML = '<div class="sk-innen"><b>Zentrale</b><p>' + (falsch ? 'Der Schlüssel stimmt nicht.' : 'Einmal den Schlüssel eingeben.') +

<script>
/* ── Einstellungen ── */

const komma = x => String(x).replace('.', ',');
const HAKEN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function tagPlus(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);

}

function voll(f) { return f.toene ? ton(f, 3) : 'background:' + f.farbe + ';'; }

/* ── Hilfen ── */
function werteVon(iso) { return P.werte[iso || tagIso]; }
function zelle(spalte, iso) { const t = werteVon(iso); return t ? t[spalte] : null; }
function wertVon(spalte, iso) { const x = zelle(spalte, iso); return x ? x.wert : null; }
function anzeigeVon(spalte, iso) { const x = zelle(spalte, iso); return x ? x.anzeige : ''; }
function zeitText(x) {
  if (typeof x !== 'number') return '';
  const min = Math.round(x * 1440) % 1440;
  return zwei(Math.floor(min / 60)) + ':' + zwei(min % 60);
}
function melden(text) {
  const m = $('meldung'); m.textContent = text; m.classList.add('sichtbar');
  clearTimeout(melden.t); melden.t = setTimeout(() => m.classList.remove('sichtbar'), 3200);
}
function tageListe() {
  const h = heute();
  const s = new Set(P.tage); s.add(h);
  return [...s].filter(t => t <= h).sort();
}

/* ── Zeichnen ── */
/* Antippen: Stelle merken. Wird danach neu gezeichnet, bekommt das Element an derselben Stelle die Feder Animation */
let letzterTipp = null;
const TIPP_ZIEL = 'button, .schalter, label, input[type=time], .klappbar, .ci-status, .pille';
document.addEventListener('pointerdown', e => {
  letzterTipp = { x: e.clientX, y: e.clientY, t: Date.now() };
  tippAnimation(e.target);
}, { passive: true });
function tippAnimation(el) {
  const z = el && el.closest ? el.closest(TIPP_ZIEL) : null;
  if (!z) return;
  z.classList.remove('tipp'); void z.offsetWidth; z.classList.add('tipp');
  setTimeout(() => z.classList.remove('tipp'), 400);
}
function tippNachZeichnen() {
  if (!letzterTipp || Date.now() - letzterTipp.t > 700) return;
  const t = letzterTipp;
  requestAnimationFrame(() => tippAnimation(document.elementFromPoint(t.x, t.y)));
}
function zeichnen() {
  spaeterZeichnen = false;
  if (!P) return;
  tippNachZeichnen();
  $('navTag').classList.toggle('aktiv', ansicht === 'tag');
  $('navWoche').classList.toggle('aktiv', ansicht === 'woche');
  document.body.classList.toggle('wochenansicht', ansicht === 'woche');
  const zeigeNav = ansicht === 'tag';
  $('zurueck').style.visibility = $('vor').style.visibility = zeigeNav ? 'visible' : 'hidden';
  if (ansicht === 'woche') return zeichneWoche();
  zeichneTag();
}

function zeichneTag() {
  const h = heute(), liste = tageListe(), i = liste.indexOf(tagIso);
  $('kopfTitel').textContent = tagIso === h ? 'Heute' : tagIso === tagPlus(h, -1) ? 'Gestern' : label(tagIso);
  $('kopfDatum').textContent = label(tagIso);
  $('zurueck').disabled = i <= 0;
  $('vor').disabled = i === -1 || i >= liste.length - 1;

  if (!werteVon()) {
    $('inhalt').innerHTML = '<div class="karte"><b>Noch keine Zeile für diesen Tag.</b>' +
      '<div class="hinweis">Die Zeile entsteht, wenn die Skripte laufen.</div>' +
      '<button class="knopf" onclick="aktualisieren()">Jetzt aktualisieren</button></div>';
    return;
  }

  let html = '';
  const oben = P.felder.filter(f => f.typ === 'oben');
  P.felder.filter(f => f.typ === 'gross').forEach(f => {
    const live = tagLive(tagIso), w = live != null ? live : wertVon(f.spalte), s = stufe(f, w);
    html += '<div class="tageszahl"><div class="neben links">' + nebenWerte(f, 'l') + '</div><div class="ringe"><div class="ringe-kreis" id="tagRinge">' + ringeSvg(tagIso) + '<div class="zahl" id="tagZahl" style="' + (ton(f, s) || 'background:var(--chip)') + '">' +
      (live != null ? live.toFixed(1).replace('.', ',') : esc(anzeigeVon(f.spalte)) || '–') + '</div></div>' + ringeLegende() + '</div><div class="neben">' + nebenWerte(f, 'r') +
      oben.map(o => '<div' + (o.liste ? ' class="klappbar' + (auf.has(o.spalte) ? ' auf' : '') + '" onclick="umklappen(' + P.felder.indexOf(o) + ')"' : '') +
        '><small>' + esc(o.spalte) + (o.liste ? '<span class="pfeil">▸</span>' : '') + '</small><b style="' + ton(o, stufe(o, wertVon(o.spalte))) + '">' +
        (esc(anzeigeVon(o.spalte)) || '–') + '</b></div>').join('') + '</div></div>';
  });
  if (tagIso === heute()) html += schrittHtml();

  let listen = '';
  oben.filter(o => o.liste && auf.has(o.spalte)).forEach(o => {
    listen += '<div class="karte klappbar auf" onclick="umklappen(' + P.felder.indexOf(o) + ')"><div class="bereich"><span class="punkt" style="background:' +
      o.farbe + '"></span>' + esc(o.spalte) + '</div>' + listeHtml(o) + '</div>';
  });

  const bereiche = [];
  P.felder.filter(f => f.typ !== 'gross' && f.typ !== 'oben').forEach(f => {
    let b = bereiche.find(x => x.name === f.bereich);
    if (!b) bereiche.push(b = { name: f.bereich, farbe: f.farbe, felder: [] });
    b.felder.push(f);
  });
  const karten = bereiche.map(b => {
    const bloecke = b.felder.some(f => f.typ === 'bloecke');
    const kopfZeile = bloecke ? '' :
      '<div class="bereich"><span class="punkt" style="background:' + b.farbe + '"></span>' + esc(b.name) +
      (b.felder.some(f => CHECKIN_FELDER.indexOf(f.spalte) !== -1) && checkinOffen() ? '<span class="ci-offen">' + checkinOffen() + ' offen</span>' : '') + '</div>';
    return { name: b.name, bloecke: bloecke, html: '<div class="karte">' + kopfZeile + b.felder.map(feldHtml).join('') + '</div>' };
  });

  /* Mac: Karten in Spalten. Links Handlung (Fokus, Struktur, Notiz), Mitte Eingaben, rechts Geld, Bewegung, Schlaf, Körper */
  const n = macSpalten();
  if (n < 2) { $('inhalt').innerHTML = html + listen + karten.map(k => k.html).join(''); nachTag(); return; }
  const sp = Array.from({ length: n }, () => '');
  sp[n === 3 ? 1 : 0] += listen;
  karten.forEach(k => {
    const name = String(k.name || '').toLowerCase();
    const i = k.bloecke || MAC_LINKS.includes(name) ? 0 : MAC_RECHTS.includes(name) ? 2 : 1;
    sp[Math.min(i, n - 1)] += k.html;
  });
  $('inhalt').innerHTML = html + '<div class="mac-spalten">' + sp.map(s => '<div class="mac-spalte">' + s + '</div>').join('') + '</div>';
  nachTag();
}

/* Neben der großen Zahl: nur der Schnitt Tag 1/10 der letzten 4 Tage, heute zählt mit. Links bleibt leer, damit die Zahl mittig steht.
   Ausgaben 7 Tage stehen in der Geld Karte, Schlaf in der Schlaf Karte. */
function nebenWerte(f, seite) {
  if (seite === 'l') return '';
  const tage = [0, -1, -2, -3].map(n => wertVon(f.spalte, tagPlus(tagIso, n))).filter(x => typeof x === 'number');
  const schnitt = tage.length ? Math.round(tage.reduce((x, y) => x + y, 0) / tage.length * 10) / 10 : null;
  return '<div><small>Ø 4 Tage</small><b style="' + (schnitt == null ? '' : ton(f, stufe(f, schnitt))) + '">' +
    (schnitt == null ? '–' : esc(komma(schnitt))) + '</b></div>';
}

function feldHtml(f) {
  const w = wertVon(f.spalte), s = stufe(f, w), id = 'f' + P.felder.indexOf(f);
  const name = esc(f.spalte.replace(' 1/10', ''));
  const kopf = (r, zusatz) => '<div class="feld" data-f="' + id + '"><div class="zeile"><span class="name">' + name + (zusatz || '') + '</span>' + r + '</div>';
  const pille = txt => '<span class="pille' + (txt ? '' : ' leer') + '" style="' + ton(f, s) + '">' + (txt ? esc(txt) : '–') + '</span>';

  switch (f.typ) {
    case 'skala': {
      if (f.mehrfach) return mehrfachHtml(f, id, w, s, kopf, pille);
      let k = '';
      for (let n = 1; n <= 10; n++) {
        const an = w === n;
        k += '<button onclick="setzen(\'' + id + '\',' + (an ? "''" : n) + ')" style="' + (an ? ton(f, s) || 'background:' + f.farbe : '') + '">' + n + '</button>';
      }
      return kopf(pille(typeof w === 'number' ? komma(w) : '')) + '<div class="skala">' + k + '</div></div>';
    }
    case 'wahl': {   // drei Knöpfe, in der Tabelle steht das Wort (Vb: nono, hmm, si)
      let k = '';
      WAHL.forEach(x => {
        const an = w === x;
        k += '<button onclick="setzen(\'' + id + '\',\'' + (an ? '' : x) + '\')" style="' + (an ? ton(f, s) || 'background:' + f.farbe : '') + '">' + x + '</button>';
      });
      return kopf(pille(typeof w === 'string' ? w : '')) + '<div class="skala wahl">' + k + '</div></div>';
    }
    case 'zahl': {
      const n = typeof w === 'number' ? w : null;
      return kopf('<div class="zaehler"><button onclick="setzen(\'' + id + '\',' + (n ? n - 1 : 0) + ')">−</button>' +
        pille(n == null ? '' : String(n)) +
        '<button onclick="setzen(\'' + id + '\',' + ((n || 0) + 1) + ')">+</button></div>') + '</div>';
    }
    case 'kaestchen':
      return kopf('<button class="schalter' + (w === true ? ' an' : '') + '" style="' + (w === true ? 'background:' + (f.gutWenn === 'leer' ? '#A8A69F' : f.farbe) : '') +
        '" onclick="setzen(\'' + id + '\',' + (w === true ? 'false' : 'true') + ')"></button>') + '</div>';
    case 'uhrzeit':
      return kopf('<span><input type="time" value="' + zeitText(w) + '" style="' + ton(f, s) + '" onchange="zeitSetzen(\'' + id + '\', this.value)">' +
        (w != null ? '<button class="loeschen" onclick="setzen(\'' + id + '\',\'\')">✕</button>' : '') + '</span>') + '</div>';
    case 'jetzt': {
      if (w === 'nein') {
        return kopf('<span><span class="pille">nicht genommen</span><button class="loeschen" onclick="setzen(\'' + id + '\',\'\')">✕</button></span>') + '</div>';
      }
      if (typeof w !== 'number') {
        return kopf('<span class="jetztwahl"><input type="time" onchange="zeitSetzen(\'' + id + '\', this.value)">' +
          '<button class="jetzt" style="' + voll(f) + '" onclick="jetztSetzen(\'' + id + '\')">Jetzt</button></span>') +
          '<div class="unter"><button class="nicht" onclick="setzen(\'' + id + '\',\'nein\')">Heute nicht genommen</button></div></div>';
      }
      const b = f.bezug ? wertVon(f.bezug) : null;
      const abstand = typeof b === 'number' ? Math.round((w - b) * 1440) : null;
      const info = abstand == null ? '' : abstand < 0 ? 'vor dem Aufwachen' :
        (abstand < 60 ? abstand + ' min' : Math.floor(abstand / 60) + ' h ' + zwei(abstand % 60) + ' min') + ' nach ' + (/^aufwach/i.test(f.bezug) ? 'dem Aufwachen' : esc(f.bezug));
      return kopf('<span><input type="time" value="' + zeitText(w) + '" style="' + ton(f, s) + '" onchange="zeitSetzen(\'' + id + '\', this.value)">' +
        '<button class="loeschen" onclick="setzen(\'' + id + '\',\'\')">✕</button></span>') +
        (info ? '<div class="unter">' + info + '</div>' : '') + '</div>';
    }
    case 'text':
      return kopf('<input type="text" value="' + esc(w == null ? '' : w) + '" onblur="textSetzen(\'' + id + '\', this.value)">') + '</div>';
    case 'notiz':
      return '<div class="feld"><div class="zeile"><span class="name">' + esc(f.spalte) + '</span></div>' +
        '<textarea onblur="textSetzen(\'' + id + '\', this.value)" placeholder="Was war heute?">' + esc(w == null ? '' : w) + '</textarea></div>';
    case 'termine':
      return kopf(pille(anzeigeVon(f.spalte))) + termineHtml(f) + '</div>';
    case 'tasks':
      if (P.felder.some(x => x.typ === 'bloecke')) return '';   // steht oben unter Erledigt
      return kopf(pille(anzeigeVon(f.spalte))) + tasksHtml(f) + '</div>';
    case 'bloecke':
      return '<div class="feld" id="heuteBox">' + heuteHtml(f) + '</div>';
    default:
      if (f.liste) {
        const a = auf.has(f.spalte);
        return '<div class="feld klappbar' + (a ? ' auf' : '') + '" onclick="umklappen(' + P.felder.indexOf(f) + ')"><div class="zeile"><span class="name">' +
          name + '<span class="pfeil">▸</span></span>' + pille(anzeigeVon(f.spalte)) + '</div>' + (a ? listeHtml(f) : '') + '</div>' + (f.spalte === 'Ausgaben' ? siebenHtml(f) : '');
      }
      return kopf(pille(anzeigeVon(f.spalte))) + '</div>';
  }
}

/* Check ins: drei Fenster pro Tag. Unter der Skala steht, welche schon eingetragen sind, das laufende ist markiert */
const CHECKIN_FELDER = ['Stimmung 1/10', 'Energie 1/10', 'Konzentration 1/10'];
const CHECKIN = [['Morgens', 0, 12 * 60], ['Mittags', 12 * 60, 17 * 60], ['Abends', 17 * 60, 24 * 60]];
function checkinFenster(liste) {
  return CHECKIN.map(([name, von, bis]) => {
    const drin = liste.filter(e => { const m = /^\d{1,2}:\d{2}$/.test(e.zeit) ? minVon(e.zeit) : -1; return m >= von && m < bis; });
    return { name: name, von: von, bis: bis, wert: drin.length ? drin[drin.length - 1].wert : null };
  });
}
/* Nur das laufende Fenster: offen pulsiert ein Punkt, eingetragen erscheint ein Haken mit kleinem Sprung */
let checkinNeu = { spalte: '', t: 0 };
function checkinHtml(f, liste) {
  if (tagIso !== heute()) return '';
  const jm = jetztMin(), c = checkinFenster(liste).find(x => jm >= x.von && jm < x.bis);
  if (!c) return '';
  const frisch = checkinNeu.spalte === f.spalte && Date.now() - checkinNeu.t < 1500;
  return c.wert != null
    ? '<div class="ci-status drin' + (frisch ? ' frisch' : '') + '"><span class="ci-haken">✓</span>' + c.name + ' drin</div>'
    : '<div class="ci-status offen"><span class="ci-punkt"></span>' + c.name + ' noch offen</div>';
}
/* Kopf Karte: wie viele Check ins im laufenden Fenster noch fehlen */
function checkinOffen() {
  if (tagIso !== heute() || !P) return 0;
  const jm = jetztMin(), c = CHECKIN.find(([, von, bis]) => jm >= von && jm < bis);
  if (!c) return 0;
  return CHECKIN_FELDER.filter(sp => {
    const liste = (zelle(sp) || {}).eintraege || [];
    return !checkinFenster(liste).some(x => x.name === c[0] && x.wert != null);
  }).length;
}

/* Mehrfach: jedes Antippen ist ein neuer Eintrag, oben steht der Schnitt */
function mehrfachHtml(f, id, w, s, kopf, pille) {
  const liste = (zelle(f.spalte) || {}).eintraege || [];
  // Der letzte Eintrag leuchtet in seiner Farbe, darunter steht, wann er war
  const letzter = liste[liste.length - 1];
  const lw = letzter ? letzter.wert : null;
  const ls = letzter ? stufe(f, lw) : 0;
  let k = '';
  for (let n = 1; n <= 10; n++) {
    const an = lw === n;
    k += '<button onclick="eintragNeu(\'' + id + '\',' + n + ')" style="' + (an ? (ton(f, ls) || voll(f)) + 'box-shadow:inset 0 0 0 2px ' + f.farbe + ';' : '') + '">' + n + '</button>';
  }
  const zeit = letzter && /^\d{1,2}:\d{2}$/.test(letzter.zeit) ? letzter.zeit : '';
  // Rechts steht der Schnitt des Tages, wie in der Tabelle
  return kopf(pille(typeof w === 'number' ? komma(w) : '')) +
    '<div class="skala">' + k + '</div>' +
    (CHECKIN_FELDER.indexOf(f.spalte) !== -1 ? checkinHtml(f, liste)
      : (zeit ? '<div class="unter"><span class="zuletzt">zuletzt</span> ' + esc(zeit) + '</div>' : '')) + '</div>';
}

/* Liste aus der Notiz der Zelle, z.B. Abbuchungen oder Konten */
function listeHtml(f) {
  const l = (zelle(f.spalte) || {}).liste || [];
  if (!l.length) return '<div class="hinweis">Keine Einträge.</div>';
  const mitZeit = l.some(p => p.zeit);
  return '<div class="liste">' + l.map(p => postenHtml(p, mitZeit)).join('') + '</div>';
}
/* Eine Zeile in Ausgaben und Kontostand. Ausgaben haben vorne die Uhrzeit (leer, wenn die Bank keine liefert) */
function postenHtml(p, mitZeit) {
  return '<div class="posten">' + (mitZeit ? '<span class="pzeit">' + esc(p.zeit || '') + '</span>' : '') +
    '<span class="ppunkt">' + esc(p.punkt) + '</span><span class="pname">' + esc(p.name) + '</span><span class="pbetrag">' + esc(p.betrag) + ' €</span></div>';
}
/* Geld Karte: Ausgaben der letzten 7 Tage (heute zählt mit). Antippen zeigt die Abbuchungen nach Tag, neuester zuerst */
const SIEBEN = 'Ausgaben 7 Tage';
function siebenHtml(f) {
  const tage = [0, -1, -2, -3, -4, -5, -6].map(n => tagPlus(tagIso, n));
  const werte = tage.map(iso => wertVon(f.spalte, iso)).filter(x => typeof x === 'number');
  const geld = x => x.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const summe = werte.reduce((x, y) => x + y, 0), schnitt = werte.length ? summe / werte.length : null;
  const a = auf.has(SIEBEN);
  let liste = '';
  if (a) {
    liste = tage.map(iso => {
      const w = wertVon(f.spalte, iso), l = (zelle(f.spalte, iso) || {}).liste || [];
      if (typeof w !== 'number' && !l.length) return '';
      return '<div class="tag7"><span>' + esc(label(iso)) + '</span><span>' + (typeof w === 'number' ? geld(w) : '') + '</span></div>' +
        (l.length ? l.map(p => postenHtml(p, l.some(x => x.zeit))).join('') : (w ? '<div class="hinweis">Keine Einzelposten.</div>' : ''));
    }).join('');
    liste = '<div class="liste">' + (liste || '<div class="hinweis">Keine Ausgaben.</div>') + '</div>';
  }
  return '<div class="feld klappbar' + (a ? ' auf' : '') + '" onclick="siebenKlappen()"><div class="zeile"><span class="name">Letzte 7 Tage<span class="pfeil">▸</span>' +
    (schnitt == null ? '' : '<small>Ø ' + Math.round(schnitt).toLocaleString('de-DE') + ' € pro Tag</small>') + '</span>' +
    '<span class="pille' + (werte.length ? '' : ' leer') + '" style="' + (schnitt == null ? '' : ton(f, stufe(f, schnitt))) + '">' + (werte.length ? esc(geld(summe)) : '–') + '</span></div>' + liste + '</div>';
}
function siebenKlappen() { if (auf.has(SIEBEN)) auf.delete(SIEBEN); else auf.add(SIEBEN); zeichnen(); }
function umklappen(i) {
  const f = P.felder[i];
  if (!f) return;
  if (auf.has(f.spalte)) auf.delete(f.spalte); else auf.add(f.spalte);
  zeichnen();
}

function termineHtml(f) {
  const t = P.termine[tagIso] || [];
  if (!t.length) return '<div class="hinweis">Keine Termine im Kalender.</div>';
  return '<div class="terminliste">' + t.map(x =>
    '<div class="termin"><span class="zeit">' + esc(x.zeit) + '</span>' +
    '<div class="was"><div>' + esc(x.titel) + '</div><small>' + esc(x.kalender) + '</small></div></div>'
  ).join('') + '</div>';
}

function tasksHtml(f) {
  const t = (zelle(f.spalte) || {}).tasks || [];
  if (!t.length) return '<div class="hinweis">Noch keine Tasks abgehakt.</div>';
  return '<div class="terminliste">' + t.map(x =>
    '<div class="termin"><span class="zeit">' + esc(x.zeit) + '</span>' +
    '<div class="was"><div>' + esc(x.titel) + '</div>' + (x.liste ? '<small>' + esc(x.liste) + '</small>' : '') + '</div></div>'
  ).join('') + '</div>';
}

/* ── Blöcke: Fokuspunkte. Gezählt wird das Anfangen. Dieselben Zahlen stehen in Bloecke.gs (BLK.PUNKTE) ── */
const BLOCK_FAKTOR = { gemacht: 1, teils: 0.5, nicht: 0 };
const ZAEHLT_NICHT = ['System'];   // wie BLK.ZAEHLT_NICHT: sichtbar, aber nicht in der Fokuszeit
const NACH_FAKTOR = 0.5;           // nachgetragene Blöcke zählen halb (wie BLK.NACH_FAKTOR)
const SEIT_MAX = 90;  // Los "seit …": höchstens so viele Minuten zurück (wie BLK.LOS_ZURUECK_MAX)
function zaehlt(b) { return ZAEHLT_NICHT.indexOf(b.bereich) === -1; }
const PUNKTE = { ERSTER: 3, WEITERE: 2, MAX_BLOECKE: 3, GANZ: 1, HALB: 0.5, MIN_DAUER: 25, TASK: 0.5, MAX_TASKS: 5 };
const PUNKTE_ZIEL = 7;   // Ersatz, falls Ziele noch keinen Wert hat
const PUNKTE_AB = '2026-11-05';   // Tage davor zählten Fokuszeit und werden nicht umgerechnet
const FOKUS_ZIEL_MIN = 180;        // Ersatz für das Tagesziel, falls Regeln keinen Wert hat (3 h)
const WAHL = ['nono', 'hmm', 'si'];   // Typ wahl im Tab App (Spalte Vb): nono zählt null, hmm halb, si voll
const ZEIT_AB = '2026-11-06';      // ab hier zählt Fokuszeit stufenlos im Tageswert, gleiche Grenze wie in Tage!C und Bloecke.gs

/* ── Tageswert in der App nachgebaut, gleiche Rechnung wie die Formel in Tage!C. Damit steigt er live mit der Fokuszeit.
   Nummern wie in der Formel: Regeln Spalte B = 1. Wer die Formel ändert, zieht hier mit. ── */
function regelFuer(iso) {
  let r = null;
  ((P && P.regeln) || []).forEach(x => { if (x.ab <= iso && (!r || x.ab >= r.ab)) r = x; });
  return r ? r.w : null;
}
function fokusZielMin(iso) {
  const R = regelFuer(iso), z = R ? Number(R[104]) : 0;
  return iso >= ZEIT_AB && z > 0 ? Math.round(z * 1440) : FOKUS_ZIEL_MIN;
}
function tagWertRechnen(iso, fokusMinuten, ueber, aus) {
  const w = P && P.werte[iso], R = regelFuer(iso);
  if (!w || !R) return null;

    '<div class="karte"><div class="bereich">Wie lange</div><div class="wahl raster">' +
      plan.dauern.slice(0, 5).map(d => chip(plan.min === d, dauerKurz(d), 'planSetzen(\'min\',' + d + ')')).join('') +
      '<input type="time" class="dauerfrei' + (plan.dauern.slice(0, 5).indexOf(plan.min) === -1 ? ' an' : '') + '" step="300" value="' + zwei(Math.floor(plan.min / 60)) + ':' + zwei(plan.min % 60) +
      '" onchange="planDauerFrei(this.value)" aria-label="Eigene Dauer"></div>' +
    '<div class="bereich" style="margin-top:14px">Wann</div><div class="wahl raster">' +
      chip(plan.tag === h, 'Heute', "planSetzen('tag','" + h + "')") +
      (plan.nach ? chip(plan.tag === tagPlus(h, -1), 'Gestern', "planSetzen('tag','" + tagPlus(h, -1) + "')") : chip(plan.tag === m, 'Morgen', "planSetzen('tag','" + m + "')")) +
      '<input type="time" class="dauerfrei' + (plan.start ? ' an' : '') + '" step="300" value="' + esc(plan.start) + '" onchange="planStart(this.value)" aria-label="Eigene Startzeit"></div>' +
    '<div class="slotinfo">' + slotText() + '</div></div>' +
    '<div class="karte"><div class="bereich">Was</div><div class="wahl raster zwei">' +
      chip(plan.quelle === 'task', 'Aus Tasks', "planSetzen('quelle','task')") + chip(plan.quelle === 'frei', 'Ohne Task', "planSetzen('quelle','frei')") +
    '</div><div class="planwas">' + was + '</div></div>' +
    '<div class="karte"><div class="bereich">Erster Schritt</div>' +
      '<input type="text" placeholder="Was tust du in den ersten 5 Minuten?" value="' + esc(plan.schritt) + '" oninput="planText(\'schritt\', this.value)"></div>' +
    (anzahl >= 3 && !plan.nach ? '<div class="warnung">An dem Tag stehen schon ' + anzahl + ' Blöcke. Mehr als drei sind meist zu viel.</div>' : '') +
    '<button class="planknopf" id="planOk" onclick="planAnlegen()"' + (planBereit() ? '' : ' disabled') + '>' +
      (plan.sendet ? 'Lege an …' : plan.nach ? 'Nachtragen' : anzahl >= 3 ? 'Trotzdem anlegen' : 'Block anlegen') + '</button></div>';
}
function planAnlegen() {
  if (!planBereit()) return;
  const w = plan.quelle === 'task' ? plan.wahl : [];
  const t = w.length === 1 ? w[0] : null;
  const o = w.length > 1
    ? { tag: plan.tag, min: plan.min, bereich: w[0].bereich, titel: 'Kleinkram (' + w.length + ' Tasks)', schritt: plan.schritt,
        taskRef: '', taskTitel: w.map(x => x.titel).join(', '), taskRefs: w.map(x => x.ref) }
    : { tag: plan.tag, min: plan.min, bereich: t ? t.bereich : plan.bereich, titel: t ? t.titel : plan.titel,
        schritt: plan.schritt, taskRef: t ? t.ref : '', taskTitel: t ? t.titel : '' };
  o.start = plan.start || '';
  if (plan.nach) o.nach = true;
  plan.sendet = true;
  planZeichnen();
  server('appBlockPlanen', o).then(d => {
    planSchliessen();
    if (d && d.paket) uebernehmen(d.paket); else abfragen(true);
    if (d && d.key) merken({ art: 'plan', tag: tagIso, key: d.key, name: 'Block geplant' });
    melden(d && d.meldung ? d.meldung : 'Eingeplant');
  }).catch(e => {
    if (plan) { plan.sendet = false; planZeichnen(); }
    melden(e.message || String(e));
  });
}
function taskFertig(iso, i) {
  const b = bloeckeVon(iso)[i];
  if (!b || !b.task) return;
  merken({ art: 'task', tag: tagIso, key: b.key, name: 'Task abgehakt' });
  b.taskFertig = true;
  zeichnen();
  melden('Task „' + (b.taskTitel || b.titel) + '“ abgehakt');
  nacheinander('appTaskErledigt', b.key);
}

function zeichneWoche() {
  $('kopfTitel').textContent = 'Letzte 14 Tage';
  $('kopfDatum').textContent = '';
  const h = heute();
  const gross = P.felder.find(f => f.typ === 'gross');
  const mini = P.felder.filter(f => f.uebersicht && f.typ !== 'gross');
  const zeilen = P.tage.filter(t => t <= h).slice(-14).reverse().map(iso => {
    const gw = gross ? wertVon(gross.spalte, iso) : null;
    return '<button class="tag-zeile" onclick="oeffnen(\'' + iso + '\')"><span class="datum">' + esc(label(iso)) + '</span>' +
      (gross ? '<span class="pille" style="' + ton(gross, stufe(gross, gw)) + '">' + (esc(anzeigeVon(gross.spalte, iso)) || '–') + '</span>' : '') +
      '<span class="mini">' + mini.map(f => {
        if (f.typ === 'bloecke' && P.bloecke && P.bloecke[iso]) { const m = fokusTagMin(iso); return m > 0 ? '<span>Fokus ' + hm(m) + '</span>' : ''; }
        const a = anzeigeVon(f.spalte, iso);
        if (!a && a !== 0) return '';
        return '<span style="' + ton(f, stufe(f, wertVon(f.spalte, iso))) + '">' + esc(f.spalte.replace(' 1/10', '')) + ' ' + esc(a) + '</span>';
      }).join('') + '</span></button>';
  }).join('');
  $('inhalt').innerHTML = '<div class="karte">' + (zeilen || '<div class="hinweis">Noch keine Tage.</div>') + '</div>';
}

/* ── Aktionen ── */
function feldVon(id) { return P.felder[Number(id.slice(1))]; }
function lokal(f, wert) {
  const t = werteVon();
  const x = t[f.spalte] || (t[f.spalte] = { wert: null, anzeige: '' });
  x.wert = wert === '' ? null : wert;
  if (f.typ !== 'notiz' && f.typ !== 'text') x.anzeige = wert === '' ? '' : wert === 'nein' ? 'nein' : (f.typ === 'uhrzeit' || f.typ === 'jetzt' ? zeitText(wert) : komma(wert));
}
/* Rückgängig: jede Eingabe merkt sich, wie es vorher war */
function merken(a) {
  verlauf.push(a);
  if (verlauf.length > 30) verlauf.shift();
  $('undo').disabled = false;
}
function rueckgaengig() {
  const a = verlauf.pop();
  $('undo').disabled = !verlauf.length;
  if (!a || !P) return;
  ansicht = 'tag';
  tagIso = a.tag;
  if (a.art === 'feld') {
    const f = feldVon(a.id);
    if (f.typ === 'notiz' || f.typ === 'text') {
      lokal(f, a.alt); zeichnen();
      nacheinander('appSpeichern', a.tag, f.spalte, a.alt, f.typ);
    } else {
      setzen(a.id, a.alt, true);
    }
  } else if (a.art === 'block') {
    const j = a.key ? bloeckeVon(a.iso).findIndex(x => x.key === a.key) : a.i;
    if (j >= 0) blockSetzen(a.iso, j, a.alt, true);
  } else if (a.art === 'plan') {
    Object.keys(P.bloecke || {}).forEach(t => { P.bloecke[t] = P.bloecke[t].filter(x => x.key !== a.key); });
    zeichnen();
    nacheinander('appBlockLoeschen', a.key);
  } else if (a.art === 'task') {
    Object.keys(P.bloecke || {}).forEach(t => P.bloecke[t].forEach(x => { if (x.key === a.key) x.taskFertig = false; }));
    zeichnen();
    nacheinander('appTaskOeffnen', a.key);
  } else if (a.art === 'eintrag') {
    const f = feldVon(a.id);
    const liste = ((zelle(f.spalte) || {}).eintraege || []).slice();
    liste.splice(a.index, 1);
    eintragLokal(f, liste); zeichnen();
    nacheinander('appEintrag', a.tag, f.spalte, 'weg', a.index);
  } else if (a.art === 'startzeit') {
    const b = bloeckeVon(a.iso).find(x => x.key === a.key);
    if (b) b.gestartet = a.alt;
    fokusLokal(a.iso);
    zeichnen();
    const [hh, mm] = String(a.alt).split(':').map(Number), d = new Date();
    d.setHours(hh, mm, 0, 0);
    nacheinander('appBlockStarten', a.key, true, d.getTime());
  } else if (a.art === 'start') {
    const b = bloeckeVon(a.iso).find(x => x.key === a.key);
    if (b) b.gestartet = '';
    fokusLokal(a.iso);
    if (dranMeldung && dranMeldung.key === a.key) dranMeldung = null;
    zeichnen();
    nacheinander('appBlockStarten', a.key, false);
  } else if (a.art === 'dran' || a.art === 'frueh') {
    const d = dranVon(a.key);
    if (a.art === 'frueh') {
      d.fertig = false;
      const b = bloeckeVon(heute()).find(x => x.key === a.key);
      if (b) b.beendet = '';
      fokusLokal(heute());
      nacheinander('appBlockBeenden', a.key, false);
    } else if (a.ja) d.dran = Math.max(0, d.dran - 1); else d.weg = Math.max(0, d.weg - 1);
    if (a.art === 'dran') d.zuletzt = a.vorher || 0;
    dranSpeichern(a.key, d);
    if (dranMeldung && dranMeldung.key === a.key) dranMeldung = null;
    zeichnen();
  } else if (a.art === 'heuteab') {
    heuteTasks = heuteTasks || [];
    heuteTasks.splice(Math.min(a.i, heuteTasks.length), 0, a.t);
    const tf = P.felder.find(x => x.typ === 'tasks'), w = P.werte[heute()];
    const x = tf && w && w[tf.spalte];
    if (x && x.tasks) { const j = x.tasks.map(y => y.titel).lastIndexOf(a.t.titel); if (j >= 0) x.tasks.splice(j, 1); }
    const ft = (P.fokTasks || {})[heute()];
    if (ft) { const k = ft.lastIndexOf(a.t.ref); if (k >= 0) ft.splice(k, 1); }
    fokusLokal(heute());
    zeichnen();
    nacheinander('appHeuteZurueck', a.t.ref);
  } else if (a.art === 'heutewahl') {
    heuteTasks = a.vorher;
    zeichnen();
    const h = heute();
    (a.aend || []).forEach(x => server('appHeuteSetzen', x.weg, x.dazu, x.t)
      .then(l => { if (x.t === h) { heuteTasks = l || heuteTasks; heuteNeu(); } })
      .catch(e => melden(e.message || String(e))));
  } else if (a.art === 'taskneu') {
    twLokalWeg(new Set([a.ref]));
    if (hwahl) heuteWahlZeichnen();
    zeichnen();
    server('appTaskLoeschen', a.ref).then(twFrisch).catch(e => melden(e.message || String(e)));
  } else if (a.art === 'taskname') {
    taskTitelLokal(a.ref, a.alt);
    zeichnen();
    server('appTaskUmbenennen', a.ref, a.alt).catch(e => melden(e.message || String(e)));
  } else if (a.art === 'taskweg') {
    server('appTaskWiederherstellen', a.liste, a.alt).then(twFrisch).catch(e => melden(e.message || String(e)));
  }
  melden('Rückgängig: ' + a.name);
}
function nameVon(f) { return f.spalte.replace(' 1/10', ''); }

function setzen(id, wert, ohneVerlauf) {
  const f = feldVon(id);
  if (f.typ === 'zahl' && wert < 0) wert = 0;
  if (!ohneVerlauf) {
    const alt = wertVon(f.spalte);
    merken({ art: 'feld', tag: tagIso, id: id, alt: alt == null ? '' : alt, name: nameVon(f) });
  }
  lokal(f, wert); zeichnen();
  nacheinander('appSpeichern', tagIso, f.spalte, wert, f.typ);
}
function eintragLokal(f, liste) {
  const t = werteVon();
  const x = t[f.spalte] || (t[f.spalte] = { wert: null, anzeige: '' });
  x.eintraege = liste;
  if (!liste.length) { x.wert = null; x.anzeige = ''; return; }
  x.wert = Math.round(liste.reduce((s, e) => s + e.wert, 0) / liste.length * 10) / 10;
  x.anzeige = komma(x.wert);
}
function eintragNeu(id, n) {
  const f = feldVon(id);
  checkinNeu = { spalte: f.spalte, t: Date.now() };
  haptik();
  const liste = ((zelle(f.spalte) || {}).eintraege || []).concat([{ zeit: jetztZeit(), wert: n }]);
  merken({ art: 'eintrag', tag: tagIso, id: id, index: liste.length - 1, name: nameVon(f) + ' ' + n });
  eintragLokal(f, liste); zeichnen();
  melden(f.spalte.replace(' 1/10', '') + ' ' + n + ' gespeichert');
  nacheinander('appEintrag', tagIso, f.spalte, 'neu', n);
}
function eintragWeg(id, i) {
  const f = feldVon(id);
  const liste = ((zelle(f.spalte) || {}).eintraege || []).slice();
  liste.splice(i, 1);
  eintragLokal(f, liste); zeichnen();
  nacheinander('appEintrag', tagIso, f.spalte, 'weg', i);
}
function jetztSetzen(id) {
  const d = new Date();
  setzen(id, d.getHours() / 24 + d.getMinutes() / 1440);
}
function zeitSetzen(id, txt) {
  if (!txt) return setzen(id, '');
  const [h, m] = txt.split(':').map(Number);
  setzen(id, h / 24 + m / 1440);
}
function textSetzen(id, txt) {
  const f = feldVon(id);
  const alt = wertVon(f.spalte);
  if ((alt == null ? '' : String(alt)) === txt) { if (spaeterZeichnen) zeichnen(); return; }
  merken({ art: 'feld', tag: tagIso, id: id, alt: alt == null ? '' : String(alt), name: nameVon(f) });
  lokal(f, txt);
  nacheinander('appSpeichern', tagIso, f.spalte, txt, f.typ);
  if (spaeterZeichnen) setTimeout(zeichnen, 0);
}
function oeffnen(iso) { ansicht = 'tag'; tagIso = iso; zeichnen(); }
function blaettern(r) {
  const liste = tageListe(), i = liste.indexOf(tagIso);
  if (liste[i + r]) { tagIso = liste[i + r]; zeichnen(); }
}
function aktualisieren() {
  const k = $('neu'); k.classList.add('dreht'); k.disabled = true;
  melden('Hole Schlaf, Geld und Termine …');
  server('appAktualisieren').then(d => {
    uebernehmen(d);
    melden(d.fehler && d.fehler.length ? 'Fehler: ' + d.fehler.join(' · ') : 'Aktualisiert');
  }).catch(e => melden(e.message || String(e)))
    .finally(() => { k.classList.remove('dreht'); k.disabled = false; });
}

/* ── Mac: breites Layout ab 760 px mit Maus oder Trackpad, drei Spalten ab 1100 px. Handy und iPad ohne Maus bleiben einspaltig ── */
const MAC_LINKS = ['struktur', 'notiz'];                     // dazu die Fokus Karte
const MAC_RECHTS = ['geld', 'bewegung', 'schlaf', 'körper', 'koerper'];  // alles andere kommt in die Mitte
const MAC_2 = matchMedia('(min-width: 760px) and (hover: hover) and (pointer: fine)');
const MAC_3 = matchMedia('(min-width: 1100px) and (hover: hover) and (pointer: fine)');
function macSpalten() { return MAC_3.matches ? 3 : MAC_2.matches ? 2 : 1; }
function macKlasse() {
  document.body.classList.toggle('mac', MAC_2.matches);
  document.body.classList.toggle('mac3', MAC_3.matches);
}
[MAC_2, MAC_3].forEach(m => m.addEventListener('change', () => { macKlasse(); if (P) zeichnen(); }));
macKlasse();

/* Mac Tasten: Pfeile links/rechts blättern Tage, Cmd+Z nimmt zurück, Esc schließt das Fenster */
function macFensterZu() { const x = $('planen').querySelector('.plankopf .rund'); if (x) x.click(); }
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('mac')) return;
  const fenster = $('planen').classList.contains('offen');
  if (e.key === 'Escape' && fenster) { macFensterZu(); return; }
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' || a.isContentEditable)) return;
  if (e.metaKey && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); if (!$('undo').disabled) rueckgaengig(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || fenster) return;
  if (e.key === 'ArrowLeft' && ansicht === 'tag' && !$('zurueck').disabled) blaettern(-1);
  else if (e.key === 'ArrowRight' && ansicht === 'tag' && !$('vor').disabled) blaettern(1);
});
$('planen').addEventListener('click', e => {
  if (e.target === $('planen') && document.body.classList.contains('mac')) macFensterZu();
});

$('zurueck').onclick = () => blaettern(-1);
$('vor').onclick = () => blaettern(1);
$('neu').onclick = aktualisieren;
$('undo').onclick = rueckgaengig;
$('navTag').onclick = () => { ansicht = 'tag'; zeichnen(); };
$('navWoche').onclick = () => { ansicht = 'woche'; zeichnen(); };

/* ── Ort: Standort beim Öffnen, höchstens einmal pro Stunde ── */
function ortMelden() {
  if (!navigator.geolocation) return;
  let zuletzt = 0;
  try { zuletzt = Number(localStorage.getItem('zentrale_ort_zeit') || 0); } catch (e) { /* egal */ }
  if (Date.now() - zuletzt < 3600000) return;
  navigator.geolocation.getCurrentPosition(pos => {
    try { localStorage.setItem('zentrale_ort_zeit', String(Date.now())); } catch (e) { /* egal */ }
    server('appOrt', heute(), pos.coords.latitude, pos.coords.longitude)
      .then(d => { if (d && d.geaendert) abfragen(true); })
      .catch(() => { /* Ort ist nicht wichtig genug für eine Fehlermeldung */ });
  }, () => { /* abgelehnt oder kein Signal */ }, { timeout: 15000, maximumAge: 600000, enableHighAccuracy: false });
}

/* ── Start ── */
function starttag() {
  const h = heute();
  return new Date().getHours() < HEUTE_AB ? tagPlus(h, -1) : h;
}
let zuletztSichtbar = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { zuletztSichtbar = Date.now(); return; }
  // Nach längerer Pause wieder beim passenden Tag starten
  if (Date.now() - zuletztSichtbar > 30 * 60000) { tagIso = starttag(); ansicht = 'tag'; zeichnen(); }
  abfragen();
  ortMelden();
  heuteNeu();
  heuteLaden(false);
  tasksVorladen(false);
});
setInterval(() => { if (document.visibilityState === 'visible') abfragen(); }, ABFRAGE_SEKUNDEN * 1000);
/* Zähler im Jetzt Feld: alle 30 Sekunden nur die Heute Karte neu, nicht während du tippst */
setInterval(() => {
  if (document.visibilityState !== 'visible' || ansicht !== 'tag' || !P || tagIso !== heute() || plan) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || a.type === 'text' || a.type === 'time')) return;
  heuteNeu();
}, 30000);

(function start() {
  tagIso = starttag();
  if (START && START.werte) {
    uebernehmen(START);
    abfragen();
  } else {
    try { const s = localStorage.getItem(SPEICHER); if (s) P = JSON.parse(s); } catch (e) { P = null; }
    if (P) zeichnen();
    abfragen(true);
  }
  ortMelden();
  heuteLaden(true);
  setTimeout(() => tasksVorladen(true), 1500);   // Tasks schon mal holen, damit das Plus Fenster sofort steht
})();
</script>
