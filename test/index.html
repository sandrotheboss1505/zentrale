<!DOCTYPE html>
<html lang="de">
<head>
<title>Zentrale Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Test">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#073763">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3EF; --karte: #FFFFFF; --text: #232321; --leise: #67655F; --linie: #E6E4DE; --titel: #3A3935;
    --akzent: #1155CC; --chip: #F1EFEA; --schatten: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --karte: #1F1F1D; --text: #EDEBE6; --leise: #ABA9A2; --linie: #2E2E2B; --titel: #D6D3CC;
            --akzent: #7BA4F0; --chip: #2A2A27; --schatten: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  .logo { background: #073763; padding: calc(16px + env(safe-area-inset-top)) 16px 16px; text-align: center; }
  .logo span { font: italic 800 34px/1 Inter, -apple-system, sans-serif; color: #FFFFFF; letter-spacing: .01em; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
  .titel { flex: 1; text-align: center; }
  .titel b { display: block; font-size: 17px; }
  .titel span { font-size: 12px; color: var(--leise); }
  .rund { width: 38px; height: 38px; border-radius: 19px; background: var(--karte); box-shadow: var(--schatten);
    display: grid; place-items: center; font-size: 18px; position: relative; }
  .rund:disabled { opacity: .3; }
  .rund.dreht svg { animation: drehen 1s linear infinite; }
  @keyframes drehen { to { transform: rotate(360deg); } }
  #neu.sync::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
    border-radius: 4px; background: var(--akzent); }

  main { padding: 4px 16px 16px; max-width: 560px; margin: 0 auto; }
  .karte { background: var(--karte); border-radius: 18px; box-shadow: var(--schatten); padding: 14px 16px; margin-bottom: 12px; }
  .bereich { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase; color: var(--titel); margin-bottom: 8px; }
  .punkt { width: 8px; height: 8px; border-radius: 4px; }

  .tageszahl { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 18px; padding: 10px 0 22px; }
  .neben { display: flex; flex-direction: column; gap: 10px; justify-self: start; }
  .neben.links { justify-self: end; text-align: right; }
  .neben small { display: block; white-space: nowrap; font-size: 11px; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .neben b { display: inline-block; font-size: 15px; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 8px; background: var(--chip); white-space: nowrap; }
  .tageszahl .zahl.pop { animation: hzpop .5s ease-out; }
  .tageszahl .zahl { width: 96px; height: 96px; border-radius: 48px; display: grid; place-items: center;
    font-size: 34px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

  .feld { padding: 10px 0; border-top: 1px solid var(--linie); }
  .bereich + .feld { border-top: 0; }
  .zeile { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
  .name { font-size: 15px; }
  .name small { color: var(--leise); font-size: 12px; margin-left: 6px; }
  .pille { padding: 4px 10px; border-radius: 10px; font-weight: 600; font-variant-numeric: tabular-nums;
    min-width: 44px; text-align: center; background: var(--chip); }
  .leer { color: var(--leise); font-weight: 400; }

  .skala { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 8px; }
  .skala button { height: 36px; border-radius: 10px; background: var(--chip); font-weight: 700; font-variant-numeric: tabular-nums;
    transition: transform .08s; }
  .skala button:active { transform: scale(.92); }
  .skala.wahl { grid-template-columns: repeat(3, 1fr); }
  .eintraege { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .eintraege button { font-size: 13px; padding: 4px 8px; border-radius: 9px; background: var(--chip);
    font-variant-numeric: tabular-nums; color: var(--text); }
  .eintraege button i { font-style: normal; color: var(--leise); margin-left: 4px; }

  .zaehler { display: flex; align-items: center; gap: 6px; }
  .zaehler button { width: 34px; height: 34px; border-radius: 17px; background: var(--chip); font-size: 20px; line-height: 1; }
  .zaehler .pille { min-width: 40px; }

  .schalter { width: 50px; height: 30px; border-radius: 15px; background: var(--linie); position: relative; transition: background .15s; }
  .schalter::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .schalter.an::after { transform: translateX(20px); }

  input[type=time], input[type=text], textarea {
    font: inherit; color: var(--text); background: var(--chip); border: 0; border-radius: 10px; padding: 7px 10px; }
  input[type=time] { min-width: 96px; text-align: center; }
  input[type=text] { width: 140px; text-align: right; }
  textarea { width: 100%; min-height: 84px; margin-top: 8px; resize: vertical; }
  .loeschen { font-size: 13px; color: var(--leise); margin-left: 6px; }
  .jetzt { padding: 8px 16px; border-radius: 12px; font-weight: 600; color: #fff; }
  .unter { font-size: 12px; color: var(--leise); text-align: right; margin-top: 4px; }
  .zuletzt { color: #D5A6BD; font-weight: 600; }
  .ci-offen { margin-left: auto; font-size: 11px; font-weight: 600; color: #B0577F; text-transform: none; letter-spacing: 0; }
  .ci-status { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; font-size: 12px; font-weight: 600; }
  .ci-status.offen { color: #B0577F; }
  .ci-status.drin { color: var(--leise); font-weight: 500; }
  .ci-punkt { width: 8px; height: 8px; border-radius: 4px; background: #D5A6BD; animation: ciatmen 1.6s ease-in-out infinite; }
  @keyframes ciatmen { 0%, 100% { transform: scale(.8); opacity: .6; } 50% { transform: scale(1.3); opacity: 1; } }
  .ci-haken { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 8px; background: #D5A6BD; color: #fff; font-size: 10px; }
  .ci-status.frisch .ci-haken { animation: cihaken .5s cubic-bezier(.3, 1.6, .5, 1); }
  .ci-status.frisch { animation: ciein .5s ease-out; }
  @keyframes cihaken { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes ciein { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
  /* Jedes Antippen federt kurz nach, auch wenn die Ansicht dabei neu gezeichnet wird */
  .tipp { animation: tipp .32s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tipp { 0% { transform: scale(.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .jetztwahl { display: flex; align-items: center; gap: 6px; }
  .jetztwahl .jetzt { padding: 7px 14px; }
  .nicht { font-size: 12px; color: var(--leise); text-decoration: underline; margin-top: 6px; }

  .termin { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--linie); }
  .termin:first-child { border-top: 0; }
  .termin .zeit { width: 44px; font-variant-numeric: tabular-nums; color: var(--leise); font-size: 14px; }
  .termin .was { flex: 1; min-width: 0; }
  .termin .was div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .termin .was small { color: var(--leise); font-size: 12px; }
  .haken { width: 30px; height: 30px; border-radius: 15px; border: 2px solid var(--linie); display: grid; place-items: center; flex: none; }
  .haken svg { opacity: 0; }
  .haken.an svg { opacity: 1; }
  .terminliste { margin-top: 6px; }
  .hinweis { font-size: 13px; color: var(--leise); padding: 6px 0 2px; }

  .tag-zeile { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linie); width: 100%; text-align: left; }
  .tag-zeile:first-child { border-top: 0; }
  .tag-zeile .datum { width: 86px; font-weight: 600; white-space: nowrap; flex: none; }
  .tag-zeile .mini { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; }
  .mini span { font-size: 12px; padding: 2px 7px; border-radius: 7px; background: var(--chip); font-variant-numeric: tabular-nums; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--karte); border-top: 1px solid var(--linie);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; padding: 12px 0 10px; font-size: 13px; color: var(--leise); }
  nav button.aktiv { color: var(--akzent); font-weight: 600; }

  #meldung { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #2b2b29; color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; z-index: 9; }
  #meldung.sichtbar { opacity: 1; }
  .laden { text-align: center; color: var(--leise); padding: 60px 0; }
  .klappbar { cursor: pointer; }
  .pfeil { display: inline-block; color: var(--leise); font-size: 11px; margin-left: 6px; transition: transform .15s; }
  .klappbar.auf .pfeil { transform: rotate(90deg); }
  .liste { margin-top: 8px; }
  .mac-balken { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
  .mac-balken span { min-width: 3px; }
  .posten { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; border-top: 1px solid var(--linie); }
  .posten:first-child { border-top: 0; }
  .posten .pzeit { font-size: 12px; color: var(--leise); font-variant-numeric: tabular-nums; width: 38px; flex: none; }
  .posten .ppunkt { font-size: 10px; width: 14px; text-align: center; flex: none; }
  .posten .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .posten .pbetrag { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .knopf { display: inline-block; margin-top: 10px; padding: 9px 14px; border-radius: 12px; background: var(--akzent); color: #fff; font-weight: 600; }

  /* Blöcke */
  .block { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linie); }
  .terminliste .block:first-child { border-top: 0; }
  .block.spaeter { opacity: .55; }
  .block .zeit { width: 44px; font-variant-numeric: tabular-nums; color: var(--leise); font-size: 14px; flex: none; }
  .block .was { flex: 1; min-width: 0; }
  .block .was div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block .was small { color: var(--leise); font-size: 12px; }
  .stat { display: flex; gap: 5px; flex: none; }
  .stat button { width: 34px; height: 34px; border-radius: 17px; background: var(--chip); font-weight: 700; font-size: 15px;
    color: var(--leise); transition: transform .08s; }
  .stat button:active { transform: scale(.9); }
  .stat button.g.an { background: #0B8043; color: #fff; }
  .stat button.t.an { background: #F6BF26; color: #3A2F00; }
  .stat button.n.an { background: #616161; color: #fff; }
  .pkt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; color: var(--leise); flex: none; white-space: nowrap; }
  .pkt.plus { color: #0B8043; }
  .unterkopf { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--titel); margin: 12px 0 0; }
  @keyframes hops { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .hops { animation: hops .4s ease-out; display: inline-block; }
  /* Heute Karte */
  .lbl { font-size: 12px; color: var(--leise); margin: 14px 0 6px; }
  .jetztbox { background: var(--chip); border-radius: 14px; padding: 12px 14px; }
  .jtitel { font-size: 16px; font-weight: 700; line-height: 1.35; }
  .jmeta { font-size: 12px; color: var(--leise); margin-top: 3px; }
  .balken { height: 6px; border-radius: 3px; background: var(--linie); margin: 10px 0 6px; overflow: hidden; }
  .balken i { display: block; height: 100%; background: var(--akzent); }
  .jzeit { display: flex; justify-content: space-between; font-size: 13px; color: var(--leise); }
  .jzeit b { color: var(--text); }
  .dranbox { border-top: 1px solid var(--linie); margin-top: 10px; padding-top: 10px; font-size: 14px; }
  .reihe { display: grid; gap: 8px; margin-top: 8px; }
  .reihe.zwei { grid-template-columns: 1fr 1fr; }
  .reihe.drei { grid-template-columns: repeat(3, 1fr); }
  .reihe button { height: 42px; border-radius: 12px; background: var(--karte); font-weight: 600; }
  .reihe button:active { transform: scale(.96); }
  .jfuss { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--leise); margin-top: 6px; }
  .jfuss .nicht { margin-top: 0; }
  .lob { color: #0B8043; font-weight: 600; }
  .erl { display: flex; gap: 10px; align-items: baseline; font-size: 14px; padding: 6px 0; }
  .erl .z { width: 40px; flex: none; color: var(--leise); font-size: 13px; font-variant-numeric: tabular-nums; }
  .erl .r { margin-left: auto; font-size: 13px; color: #0B8043; font-weight: 600; white-space: nowrap; }
  .erl .r.leise { color: var(--leise); font-weight: 400; }
  .erl.task { color: var(--leise); }
  .aendern { font-size: 11px; color: var(--leise); font-weight: 400; margin-left: 6px; }
  .ok { color: #0B8043; } .halb { color: #C99A06; } .weg { color: var(--leise); }
  .trenn { border-top: 1px solid var(--linie); margin-top: 14px; }
  /* Heute Karte, Variante B */
  .hkopf { display: flex; align-items: center; gap: 10px; }
  .hkopf .name { flex: 1; }
  .plus { width: 34px; height: 34px; border-radius: 17px; background: var(--chip); font-size: 22px; line-height: 1; }
  .tbar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; margin: 10px 0 3px; }
  .tbar i { display: block; height: 100%; background: var(--akzent); border-radius: 3px; }
  .tlegende { display: flex; justify-content: space-between; font-size: 11px; color: var(--leise); }
  .jetztbox { margin-top: 12px; padding: 11px 13px; }
  .jtitel { font-size: 15px; }
  .jvor { font-size: 12px; color: var(--leise); margin-bottom: 2px; }
  .pillen { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .pillen button { padding: 7px 13px; border-radius: 999px; background: var(--karte); font-size: 13px; font-weight: 600; }
  .pillen button:active { transform: scale(.95); }
  .pillen .zahl { margin-left: auto; font-size: 12px; color: var(--leise); }
  .jmeld { font-size: 13px; margin-top: 8px; }
  .wahl .dauerfrei { min-width: 0; width: 100px; height: 36px; padding: 0 10px; border-radius: 12px;
    background: var(--rosa-hell); color: var(--rosa); font-weight: 600; font-variant-numeric: tabular-nums; }
  .wahl .dauerfrei.an { box-shadow: inset 0 0 0 2px var(--rosa); }
  /* Heute Karte nach Vorschau */
  :root { --akzent-hell: #E6F1FB; --gruen: #3B6D11; --gruen-hell: #EAF3DE; --kreis: #B4B2A9;
    --gold: #8A6A00; --gold-hell: #FBF1D2; --rosa: #A3416F; --rosa-hell: #F8E3ED; --rosa-voll: #C2507F; --rosa-auf: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --akzent-hell: rgba(123,164,240,.18); --gruen: #97C459; --gruen-hell: rgba(151,196,89,.16); --kreis: #5F5E5A;
    --gold: #E9C46A; --gold-hell: rgba(233,196,106,.16); --rosa: #E7B3CC; --rosa-hell: rgba(213,166,189,.2); --rosa-voll: #E7B3CC; --rosa-auf: #4B1528; } }
  #heuteBox { padding: 0; border-top: 0; }
  .hz-kopf { display: flex; align-items: center; gap: 10px; }
  .hz-kopf .n { font-size: 16px; font-weight: 700; flex: 1; }
  .hz-zeit { font-size: 15px; font-weight: 800; padding: 3px 10px; border-radius: 8px; background: var(--rosa-hell); color: var(--rosa); font-variant-numeric: tabular-nums; }
  .hz-plus { width: 36px; height: 36px; border-radius: 18px; background: var(--rosa-voll); color: var(--rosa-auf); font-size: 26px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
  .hz-plus:active { transform: scale(.92); }
  .hz-leg { display: flex; justify-content: space-between; font-size: 12px; color: var(--leise); }
  .hz-von { font-size: 13px; color: var(--leise); font-variant-numeric: tabular-nums; }
  .hz-seg { display: flex; gap: 3px; height: 8px; margin: 10px 0 4px; }
  .hz-seg span { position: relative; min-width: 4px; border-radius: 4px; background: var(--rosa-hell); overflow: hidden; }
  .hz-seg span.rest { background: var(--chip); }
  .hz-seg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--rosa-voll); }
  .hz-uhr { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .hz-uhr b { font-size: 20px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .hz-uhr span { font-size: 12px; color: var(--leise); }
  .hz-knoepfe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .hz-knoepfe button { height: 40px; border-radius: 10px; background: var(--karte); font-size: 13px; font-weight: 500; transition: transform .08s; }
  .hz-knoepfe button:active { transform: scale(.94); }
  .hz-knoepfe .hz-dran { background: var(--gruen-hell); color: var(--gruen); font-weight: 600; }
  @keyframes hzpuls { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .hz-knoepfe .hz-dran.puls { animation: hzpuls 1.4s ease-in-out infinite; }
  .hz-zeitbox { position: relative; }
  .hz-zeit.pop { animation: hzpop .4s ease-out; display: inline-block; }
  @keyframes hzflug { 0% { opacity: 0; transform: translate(-50%, 4px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -22px); } }
  .hz-flug { position: absolute; left: 50%; top: -6px; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--gruen); pointer-events: none; animation: hzflug 1.8s ease-out forwards; }
  @keyframes hzfeier { 0% { background: var(--rosa-voll); } 100% { background: var(--chip); } }
  .hz-jetzt.feier { animation: hzfeier 1.4s ease-out; }
  .hz-jetzt { background: var(--chip); border-radius: 12px; padding: 11px 13px; margin-top: 14px; }
  .hz-vor { font-size: 12px; color: var(--leise); margin-bottom: 2px; }
  .hz-titel { font-size: 15px; font-weight: 500; line-height: 1.35; }
  .hz-bar { height: 6px; border-radius: 3px; background: var(--karte); overflow: hidden; margin: 9px 0 6px; }
  .hz-bar i { display: block; height: 100%; background: var(--akzent); }
  .hz-zeile { display: flex; justify-content: space-between; font-size: 12px; color: var(--leise); }
  .hz-zeile b { font-weight: 500; color: var(--text); }
  .hz-meta { font-size: 12px; color: var(--leise); margin-top: 3px; }
  .hz-melde { font-size: 13px; margin-top: 8px; }
  .hz-melde.lob { color: var(--gruen); font-weight: 500; }
  @keyframes hzpop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .hz-melde.hops { animation: hzpop .35s ease-out; display: block; transform-origin: left center; }
.hz-start { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; height: 52px; margin-top: 12px; border-radius: 12px; background: var(--akzent); color: #fff; font-size: 16px; font-weight: 600; }
.hz-start .play { font-size: 12px; }
.hz-start i { font-style: normal; font-weight: 500; opacity: .8; }
.hz-start:active { transform: scale(.97); }
  .hz-k2 { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 2px; }
  .hz-k2 .h { font-size: 13px; font-weight: 500; }

/* ── Woche am Mac: die nächsten sieben Tage. Feste Schritte auf ihrem Tag, der Rest wie der Chief ihn verteilen würde ── */
function cosWochePlan() {
  const h = heute(), alle = cosAlleBloecke(), ueber = cosUeber(alle), proTag = (Number(C.kapazitaet) || COS_KAP) / 7;
  const tage = [];
  for (let i = 0; i < 7; i++) {
    const cap = Math.floor(proTag * (i + 1) + 1e-9) - Math.floor(proTag * i + 1e-9);
    tage.push({ iso: tagPlus(h, i), cap: cap, k: 0, items: [], geschafft: 0 });
  }
  tage[0].geschafft = cosTag(h).farben.length;
  tage[0].cap = Math.max(0, tage[0].cap - tage[0].geschafft);
  const aktiv = C.projekte.filter(p => p.status === 'aktiv');
  const warte = {};
  aktiv.forEach(p => {
    warte[p.id] = [];
    cosListe(p).forEach(s => {
      if (!cosOffen(s)) return;
      const rest = Math.max(0, s.k - Math.floor(cosMin(s, alle) / COS_MIN));
      if (!rest) return;
      const t = s.wann && tage.find(x => x.iso === s.wann);
      if (t) { t.items.push({ p: p, s: s, k: rest, fest: true }); t.k += rest; }
      else if (!s.wann || s.wann < h) warte[p.id].push({ p: p, s: s, rest: rest });
    });
  });
  // Wie am Tag: externe Deadline auf Rot zuerst, dann Rang 1, dann was nicht mehr passt, dann der Rang
  const rot = p => (ueber[p.name] || 0) > 0, idx = p => aktiv.indexOf(p);
  const ext = aktiv.filter(p => rot(p) && p.art === 'extern').sort((a, b) => a.deadline.localeCompare(b.deadline));
  const sonst = aktiv.filter(p => ext.indexOf(p) < 0);
  const reihe = ext.concat(sonst.length ? [sonst[0]].concat(sonst.slice(1).sort((a, b) => (rot(b) - rot(a)) || idx(a) - idx(b))) : []);
  tage.forEach(t => {
    let frei = t.cap - t.k, ri = 0, leer = 0;
    while (frei > 0 && reihe.length && leer < reihe.length) {
      const p = reihe[ri % reihe.length]; ri++;
      const q = warte[p.id];
      if (!q.length) { leer++; continue; }
      leer = 0;
      const x = q[0], n = Math.min(COS_SITZUNG, frei, x.rest);
      const da = t.items.find(y => y.s.id === x.s.id);
      if (da) da.k += n; else t.items.push({ p: p, s: x.s, k: n, fest: false });
      t.k += n; frei -= n; x.rest -= n;
      if (!x.rest) q.shift();
    }
  });
  return tage;
}
function cosWocheHtml() {
  const tage = cosWochePlan(), kap = Number(C.kapazitaet) || COS_KAP;
  const summe = tage.reduce((n, t) => n + t.k + t.geschafft, 0);
  return '<div class="karte"><div class="cos-woche-k"><span class="cos-ab">Nächste 7 Tage</span><b>' + summe + ' von ' + kap + '</b></div>' +
    tage.map(t => '<div class="cos-tag" data-iso="' + t.iso + '" ondragover="cosTagUeber(event)" ondragleave="cosTagRaus(event)" ondrop="cosTagAblegen(event)"><b>' + cosTagName(t.iso) + '</b><div>' +
      '<div class="kr">' + (t.geschafft ? cosViele(t.geschafft, 'var(--gruen)', 'an', 12) : '') + t.items.map(x => cosViele(x.k, cosFarbe(x.p.bereich), '', 12)).join('') +
      (!t.k && !t.geschafft ? '<span class="cos-tag-t" style="margin:0">frei</span>' : '') + '</div>' +
      (t.items.length ? '<div class="cos-tag-t">' + t.items.map(x => x.fest ? '<b>' + esc(x.s.titel) + '</b>' : esc(x.s.titel)).join(' · ') + '</div>' : '') + '</div></div>').join('') +

}

</style>
<div id="senBlatt" class="sen-blatt"></div>
<script>
/* ── Sensi: Tiefe ist Muße, nicht Arbeit. Nur Plus, ändert nichts am Tageswert. Daten aus appSensi (Tabs Signale und Werke) ──
   Aufbau als Liste von Abschnitten (SEN_ABSCHNITTE). Neuer Abschnitt: eine Zeile dort und eine Funktion, die HTML liefert. */

const SEN_SPEICHER = 'zentrale_sensi_1', SEN_UHR_SPEICHER = 'zentrale_sensi_uhr';
const SEN_ABSCHNITTE = [
  { id: 'kopf', breit: true, html: senKopfHtml },
  { id: 'lesen', html: senLesenHtml },
  { id: 'gesehen', html: senGesehenHtml },
  { id: 'audio', html: senAudioHtml },
  { id: 'handy', html: senHandyHtml }
];
let SN = {};                  // Pakete je Tag vom Server
let senUhrL = null;           // laufende Uhr { art, werkId, start }
let senFehlt = false, senAusstehend = 0, senPopBis = 0, senNeuBis = 0;
const senLaedt = {}, senGeladen = {};
let senB = null;              // offenes Blatt
try { SN = JSON.parse(localStorage.getItem(SEN_SPEICHER) || '{}') || {}; } catch (e) { SN = {}; }
try { senUhrL = JSON.parse(localStorage.getItem(SEN_UHR_SPEICHER) || 'null'); } catch (e) { senUhrL = null; }

/* ── Laden: sofort aus dem Gerätespeicher, frisch im Hintergrund ── */
function senLaden(iso, erzwingen) {
  if (!iso || senLaedt[iso] || typeof server !== 'function') return;
  if (!erzwingen && SN[iso] && Date.now() - (senGeladen[iso] || 0) < 60000) return;
  if (!erzwingen && senFehlt && Date.now() - (senGeladen[iso] || 0) < 300000) return;
  senLaedt[iso] = true;
  const ab = Date.now();
  server('appSensi', iso).then(d => {
    senGeladen[iso] = Date.now(); senFehlt = false;
    if (!d || senAusstehend > 0 || ab < senLetzte) return;   // eine Änderung ist unterwegs, deren Antwort bringt den neuen Stand
    senUebernehmen(d);
  }).catch(e => {
    senGeladen[iso] = Date.now();
    if (/Unbekannte Funktion/.test(String(e && e.message))) { senFehlt = true; if (ansicht === 'sensi') zeichnen(); }
  }).finally(() => { senLaedt[iso] = false; });
}
let senLetzte = 0;
function senUebernehmen(d) {
  if (!d || !d.datum) return;
  SN[d.datum] = d;
  const tage = Object.keys(SN).sort();
  tage.slice(0, Math.max(0, tage.length - 10)).forEach(t => { delete SN[t]; });
  if (!d.fehlt && senAusstehend === 0) senUhrSetzenL(d.uhr || null);
  senSpeichern();
  if (ansicht === 'sensi' && tagIso === d.datum) zeichneSensi();
}
function senSpeichern() { try { localStorage.setItem(SEN_SPEICHER, JSON.stringify(SN)); } catch (e) { /* ohne Speicher */ } }
function senUhrSetzenL(u) {
  senUhrL = u && u.start ? u : null;
  try { localStorage.setItem(SEN_UHR_SPEICHER, JSON.stringify(senUhrL)); } catch (e) { /* egal */ }
}
/* Wie nacheinander, gibt die Antwort zurück. Kommt ein Paket mit, ersetzt es den Stand, sobald nichts mehr unterwegs ist */
function senNach(fn, ...args) {
  offen++; senAusstehend++; senLetzte = Date.now();
  let erg = null;
  kette = kette.then(() => server(fn, ...args)
    .then(d => { erg = d; })
    .catch(e => { erg = null; melden(e.message || String(e)); }))
    .then(() => {
      offen--; geschrieben++; senAusstehend--;
      if (erg && erg.paket && senAusstehend === 0) senUebernehmen(erg.paket);
      else if (!erg && senAusstehend === 0) senLaden(tagIso, true);   // ging schief: Stand vom Server holen
    });
  return kette.then(() => erg);
}

/* ── Rechnen wie der Server (nur für die sofortige Anzeige, die Antwort ersetzt es) ── */
function senP() { const d = SN[tagIso]; return (d && d.punkte) || { lesen: { je: 15, punkte: 1, ab: 15 }, buch: { fertig: 3, ganz: 2 }, film: { ganz: 3, handyWeg: 1, nichtGanz: 0 }, serie: 0 }; }
function senLesenPkt(min) { const L = senP().lesen; return min >= L.ab ? Math.floor(min / L.je) * L.punkte : 0; }
function senFilmPkt(f) { const F = senP().film; if (f.art === 'Serie') return senP().serie || 0; return f.ganz ? F.ganz + (f.handyWeg || f.ort === 'Kino' ? F.handyWeg : 0) : F.nichtGanz; }
function senZahl(x) { return String(Math.round((Number(x) || 0) * 10) / 10).replace('.', ','); }
function senKopie(x) { return JSON.parse(JSON.stringify(x)); }
function senMin() { return senUhrL ? Math.max(0, Math.round((Date.now() - senUhrL.start) / 60000)) : 0; }
/* Tag einer Lesesitzung: bis 5 Uhr zählt zum Vortag (der Server nimmt dazu die Einschlafzeit) */
function senTagVon(ms) { const d = new Date(ms); return d.getHours() < 5 ? tagPlus(isoVon(d), -1) : isoVon(d); }
/* Punkte sofort sichtbar: Zahl ändern, Plus fliegt vom Finger zur Zahl, Meldung mit vorher und nachher */
function senGewinn(iso, punkte, text, teil) {
  const d = SN[iso];
  if (!d) { melden(text); return; }
  const vorher = d.tiefe || 0;
  d.tiefe = Math.round((vorher + punkte) * 10) / 10;
  d.woche = Math.round(((d.woche || 0) + punkte) * 10) / 10;
  (d.wocheTage || []).forEach(t => { if (t.tag === iso) t.tiefe = d.tiefe; });
  if (teil) { (d.teile = d.teile || []).push(teil); senNeuBis = Date.now() + 900; }
  melden(text + (punkte > 0 ? ' · +' + senZahl(punkte) + ' Tiefe · ' + senZahl(vorher) + ' → ' + senZahl(d.tiefe) : ''));
  if (punkte > 0) { senPopBis = Date.now() + 1200; senFliegt(punkte); }
}
function senFliegt(p) {
  const von = letzterTipp;
  if (!von || !document.body.animate) return;
  setTimeout(() => {
    const ziel = $('senHeute');
    if (!ziel) return;
    const r = ziel.getBoundingClientRect(), el = document.createElement('div');
    el.className = 'flug-plus'; el.style.background = 'var(--sen)'; el.style.color = 'var(--sen-auf)';
    el.textContent = '+' + senZahl(p);
    el.style.left = von.x + 'px'; el.style.top = von.y + 'px';
    document.body.appendChild(el);
    const dx = r.left + r.width / 2 - von.x, dy = r.top + r.height / 2 - von.y;
    const a = el.animate([
      { transform: 'translate(-50%, -50%) scale(.6)', opacity: 0 },
      { transform: 'translate(-50%, calc(-50% - 26px)) scale(1.15)', opacity: 1, offset: 0.3 },
      { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(.6)', opacity: 0.85 }
    ], { duration: 900, easing: 'cubic-bezier(.45,0,.8,.6)' });
    a.onfinish = () => { el.remove(); const z = $('senHeute'); if (z) { z.classList.remove('pop'); void z.offsetWidth; z.classList.add('pop'); } };
  }, 60);
}

/* ── Zeichnen ── */
function zeichneSensi() {
  const h = heute(), liste = tageListe(), i = liste.indexOf(tagIso);
  $('kopfTitel').textContent = tagIso === h ? 'Heute' : tagIso === tagPlus(h, -1) ? 'Gestern' : label(tagIso);
  $('kopfDatum').textContent = 'Sensi · ' + label(tagIso);
  $('zurueck').disabled = i <= 0;
  $('vor').disabled = i === -1 || i >= liste.length - 1;
  senLaden(tagIso, false);
  const box = $('inhalt'), d = SN[tagIso];
  if (!d) {
    box.innerHTML = senFehlt ? '<div class="karte"><b>Der Server kennt Sensi noch nicht.</b><div class="hinweis">Einmal im Terminal: ./bereitstellen.sh server</div></div>' : '<div class="laden">Lädt …</div>';
    return;
  }
  if (d.fehlt) { box.innerHTML = '<div class="karte"><b>Die Tabs Signale und Werke fehlen.</b><div class="hinweis">Einmal senEinrichten im Editor ausführen.</div></div>'; return; }
  const teile = SEN_ABSCHNITTE.map(a => ({ a: a, html: a.html(d) })).filter(x => x.html);
  const n = macSpalten();
  if (n < 2) { box.innerHTML = teile.map(x => x.html).join(''); senTick(); return; }
  // Mac: breite Abschnitte oben, der Rest der Reihe nach auf die Spalten
  const sp = Array.from({ length: n }, () => '');
  teile.filter(x => !x.a.breit).forEach((x, j) => { sp[j % n] += x.html; });
  box.innerHTML = teile.filter(x => x.a.breit).map(x => x.html).join('') + '<div class="mac-spalten">' + sp.map(s => '<div class="mac-spalte">' + s + '</div>').join('') + '</div>';
  senTick();
}

/* Kopf: Tiefe heute, Wochenring (ohne Ziel), Tiefe Woche, darunter woher die Punkte kommen */
function senKopfHtml(d) {
  const pop = Date.now() < senPopBis ? ' class="pop"' : '';
  const teile = (d.teile || []).map((t, i, l) => '<div class="sen-teil' + (Date.now() < senNeuBis && i === l.length - 1 ? ' neu' : '') + '"><span>' + esc(t.text) + '</span>' +
    (t.punkte ? '<b>+' + senZahl(t.punkte) + '</b>' : '') + '</div>').join('');
  const name = d.datum === heute() ? 'Tiefe heute' : d.datum === tagPlus(heute(), -1) ? 'Tiefe gestern' : 'Tiefe ' + label(d.datum);
  return '<div class="sen-kopf"><div class="sen-zahl"><small>' + esc(name) + '</small><b id="senHeute"' + pop + '>' + senZahl(d.tiefe) + '</b></div>' +
    senRingHtml(d) + '<div class="sen-zahl"><small>Tiefe Woche</small><b id="senWoche">' + senZahl(d.woche) + '</b></div></div>' +
    '<div class="sen-teile">' + (teile || '<div class="sen-teil">Lesen und Filme geben Tiefe.</div>') + '</div>';
}
/* Sieben Bögen, Montag oben. Je mehr Tiefe, desto kräftiger. Der gezeigte Tag ist etwas dicker */
function senRingHtml(d) {
  const r = 46, u = 2 * Math.PI * r, lu = u / 7, gap = 14;
  const segs = (d.wocheTage || []).map((t, i) => {
    const an = t.tiefe > 0, deck = an ? 0.35 + 0.65 * Math.min(1, t.tiefe / 6) : 1;
    return '<circle class="seg' + (an ? ' an' : '') + '" cx="56" cy="56" r="' + r + '" stroke="' + (an ? 'var(--sen)' : 'var(--linie)') + '" style="opacity:' + deck.toFixed(2) +
      (t.tag === d.datum ? ';stroke-width:12' : '') + ';animation-delay:' + (i * 0.05) + 's" stroke-dasharray="' + (lu - gap).toFixed(1) + ' ' + (u - lu + gap).toFixed(1) +
      '" stroke-dashoffset="' + (-(i * lu + gap / 2)).toFixed(1) + '"/>';
  }).join('');
  const kw = 'KW ' + senKw(d.datum);
  return '<div class="sen-ring"><svg viewBox="0 0 112 112" aria-hidden="true">' + segs + '</svg><div class="sen-ring-in"><b>' + esc(kw) + '</b><small>' +
    (d.wocheTage || []).filter(t => t.tiefe > 0).length + ' von 7</small></div></div>';
}

/* ISO Kalenderwoche eines Tages (die Woche gehört zum Jahr ihres Donnerstags) */
function senKw(iso) {
  const [y, m, t] = iso.split('-').map(Number), d = new Date(Date.UTC(y, m - 1, t));
  d.setUTCDate(d.getUTCDate() + 3 - (d.getUTCDay() + 6) % 7);
  return Math.floor((d - Date.UTC(d.getUTCFullYear(), 0, 1)) / 86400000 / 7) + 1;
}
function senCover(w, klein) {
  const b = String(w.titel || '?').trim().charAt(0).toUpperCase();
  return '<span class="sen-cover' + (klein ? ' klein' : '') + '">' + esc(b) + (w.cover ? '<img src="' + esc(w.cover) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</span>';
}

/* Lesen: aktuelles Buch mit Cover und Seite, Start oder laufende Uhr, weitere Bücher, Sitzungen des Tages */
function senLesenHtml(d) {
  const buecher = d.buecher || [];
  const laeuft = senUhrL && senUhrL.art === 'lesen' ? senUhrL : null;
  const haupt = (laeuft && buecher.find(b => b.id === laeuft.werkId)) || buecher[0] || null;
  const minHeute = (d.lesen || []).reduce((a, x) => a + x.min, 0);
  let h = '<div class="karte"><div class="bereich"><span class="punkt" style="background:var(--sen)"></span>Lesen' +
    (minHeute ? '<span class="sen-rechts">' + minHeute + ' min</span>' : '') + '</div>';
  if (haupt) {
    const pr = haupt.umfang ? Math.min(100, Math.round(haupt.seite / haupt.umfang * 100)) : 0;
    h += '<div class="sen-buch"><button onclick="senBuchBlatt(\'' + esc(haupt.id) + '\')" aria-label="Buch bearbeiten">' + senCover(haupt) + '</button><div class="sen-buch-r"><b>' + esc(haupt.titel) + '</b>' +
      (haupt.von ? '<small>' + esc(haupt.von) + '</small>' : '') + '<div class="sen-seite">S. ' + (haupt.seite || 0) + (haupt.umfang ? ' von ' + haupt.umfang : '') + '</div>' +
      (haupt.umfang ? '<div class="sen-fort"><i style="width:' + pr + '%"></i></div>' : '') + '</div></div>';
    h += laeuft ? '<div class="sen-uhr"><div class="sen-uhr-t"><span id="senUhrZeit">' + senUhrText() + '</span><small id="senUhrPkt">' + senUhrPktText() + '</small></div>' +
      '<button onclick="senStoppBlatt()">Stopp</button></div>'
      : '<button class="sen-knopf" onclick="senStart(\'' + esc(haupt.id) + '\')">Start</button>';
  } else {
    h += '<div class="hinweis">Noch kein Buch. Mit Buch hinzufügen geht es los.</div>';
  }
  const andere = buecher.filter(b => b !== haupt);
  const sitz = d.lesen || [];
  if (andere.length || sitz.length) {

/* ── Rückgängig (aus rueckgaengig in AppSeite) ── */
function senRueck(a) {
  if (a.art === 'senStart') {
    senUhrSetzenL(null); zeichnen();
    senNach('appSensiStopp', { verwerfen: true });
  } else if (a.art === 'senVerwerfen') {
    senUhrSetzenL(a.uhr); zeichnen();

  } else if (a.art === 'senStopp') {
    if (a.kaputt) { melden('Das wurde nicht gespeichert.'); return; }
    if (!a.schluessel) { verlauf.push(a); $('undo').disabled = false; melden('Einen Moment, das wird noch gespeichert. Dann geht Rückgängig.'); return; }
    if (a.vorher) SN[a.iso] = a.vorher;
    senUhrSetzenL(a.uhr); zeichnen();
    senNach('appSensiZurueck', a.schluessel, true);
  } else if (a.art === 'senWerk') {
    if (!a.zurueck) { verlauf.push(a); $('undo').disabled = false; melden('Einen Moment, das wird noch gespeichert. Dann geht Rückgängig.'); return; }
    if (a.vorher) SN[a.iso] = a.vorher;

  melden('Rückgängig: ' + a.name);
}

  merken(eintrag);
  zeichnen();
  return senNach('appSensiWerk', op, Object.assign({ tag: iso }, daten)).then(r => {

    else { const i = verlauf.indexOf(eintrag); if (i >= 0) verlauf.splice(i, 1); $('undo').disabled = !verlauf.length; }
    return r;
  });
}

  const SENSI = "/**\n * ZENTRALE · Sensi (Sensibilität)\n *\n * Tiefe ist Muße, nicht Arbeit: Lesen, Filme, später Musik, Zeitlupe, Gang ohne Input.\n * Grundsätze: Nur Plus (Tiefe gibt Punkte, nimmt nie welche). Tiefe ändert nichts an Tageswert,\n * Gewichtung oder Tab Regeln, sie ist nur Anzeige. Kästchen bleiben beim Fokus.\n *\n * Tabs:\n *   Signale: eine Zeile pro Ereignis (Lesesitzung, Handy abgelegt, aufgenommen …), Schlüssel gegen Doppelte.\n *   Werke:   eine Zeile pro Buch, Film oder Serie.\n *   Audio:   eine Zeile pro gehörtem Titel aus Spotify (zuletzt gehört), alle 15 Minuten geholt.\n *   Sensi Tage: eine Zeile pro Tag mit Tiefe, Lesen, Gesehen, Audio, Unruhe (mit Notiz). Schreibt senTagRechnen_.\n *   Der Tab Tage bleibt unberührt (Sandro, 18.11.2026: erst eigener Tab, verknüpfen später).\n *\n * Tagesgrenze wie bei den Ausgaben (finGrenze_ in Finnzen.js): nach Mitternacht zählt bis zum Einschlafen, mindestens bis 5 Uhr, zum Vortag.\n * Läuft nach jeder Änderung aus der App und alle 15 Minuten mit den Blöcken (senTakt_ für heute und gestern).\n * Einmalig: senEinrichten im Editor ausführen.\n *\n * Schnittstelle (doPost, auch für die Kurzbefehle am iPhone):\n *   appSensi(datum), appSensiSignal(art, daten), appSensiZurueck(schluessel, uhrWieder),\n *   appSensiWerk(op, daten), appSensiStart(art, werkId, startMs), appSensiStopp(daten)\n */\n\nconst SEN = {\n  VERSION: 1,\n  BLATT_SIGNALE: 'Signale',\n  BLATT_WERKE: 'Werke',\n  ERSTE_ZEILE: 3,\n  SIGNALE: ['Zeit', 'Tag', 'Quelle', 'Art', 'Titel', 'Wert', 'Einheit', 'Notiz', 'Schlüssel'],\n  WERKE: ['ID', 'Art', 'Titel', 'Von', 'Jahr', 'Umfang', 'Cover', 'Status', 'Start', 'Ende', 'Seite', 'Ganz', 'Handy weg', 'Ort', 'Bewertung', 'Nachhall', 'Quelle', 'Link'],\n  BLATT_TAGE: 'Sensi Tage',\n  BLATT_AUDIO: 'Audio',\n  // Eigener Tab, eine Zeile pro Tag, neuester oben. Neue Spalten einfach hinten anhängen (gefunden wird über den Namen)\n  TAG_SPALTEN: ['Datum', 'Tiefe', 'Lesen', 'Gesehen', 'Audio', 'Unru en_();\n    if (d.fehlt) throw new Error('Tab Signale fehlt. Einmal senEinrichten ausführen.');\n    const da = d.sig.find(s => s.schluessel === schluessel);\n    if (da) { erg = { ok: true, doppelt: true, schluessel: schluessel, tag: senTagVon_(da.zeit, d.grenzen) }; return; }\n    const tag = senIsoOk_(daten.tag) || senTagVon_(ms, d.grenzen);\n    senSignalAnhaengen_({ zeit: ms, tag: tag, quelle: daten.quelle || (art === 'abgelegt' || art === 'aufgenommen' ? 'Kurzbefehl' : 'App'),\n      art: art, titel: daten.titel || '', wert: daten.wert == null ? '' : daten.wert, einheit: daten.einheit || '', notiz: daten.notiz || '', schluessel: schluessel });\n    senTagRechnen_(tag);\n    erg = { ok: true, schluessel: schluessel, tag: tag };\n  });\n  erg.meldung = erg.doppelt ? 'Schon eingetragen.' : (art === 'abgelegt' ? 'Handy abgelegt ' : art === 'aufgenommen' ? 'Handy aufgenommen ' : art + ' ') + senUhr_(ms);\n  return erg;\n}\n\n/** Rückgängig für ein Ereignis. uhrWieder: bei einer Lesesitzung läuft die Uhr danach wieder ab ihrem alten Start. */\nfunction appSensiZurueck(schluessel, uhrWieder) {\n  schluessel = String(schluessel || '');\n  if (!schluessel) throw new Error('Schlüssel fehlt.');\n  let tag = null;\n  senSperre_(() => {\n    const d = senDaten_();\n    if (d.fehlt) return;\n    const s = d.sig.find(x => x.schluessel === schluessel);\n    if (!s) return;\n    tag = senTagVon_(s.zeit, d.grenzen);\n    const werkId = senWerkVonKey_(s.schluessel);\n    const w = werkId ? d.werke.find(x => x.id === werkId) : null;\n    if (w && s.art === 'lesen') {\n      const m = s.notiz.match(/S\\. (\\d+) bis (\\d+)/);\n      if (m && Number(w.seite) === Number(m[2])) w.seite = Number(m[1]);\n      let beendet = null;\n      if (/ · beendet/.test(s.notiz) && w.status === 'fertig') { beendet = w.ende; w.status = 'läuft'; w.ende = ''; w.ganz = false; }\n      senWerkSchreiben_(w);\n      if (beendet && beendet !== tag) senTagRechnen_(beendet);\n    }\n    senBlatt_(SEN.BLATT_SIGNALE).deleteRow(s.zeile);\n    if (uhrWieder === true && SEN.ARTEN_UHR.indexOf(s.art) >= 0) senUhrSetzen_({ art: s.art, werkId: werkId || '', start: s.zeit });\n    senTagRechnen_(tag);\n  });\n  return Object.assign({ ok: true, meldung: 'Zurückgenommen.' }, tag ? { paket: appSensi(tag) } : {});\n}\n\n/**\n * Bücher und Filme. op: suchen, neu, aendern, beenden, loeschen, wiederherstellen.\n * Jede Änderung gibt zurueck = { op, daten } mit, das genau sie wieder aufhebt.\n */\nfunction appSensiWerk(op, daten) {\n  daten = daten || {};\n  if (op === 'suchen') return { ok: true, treffer: senBuchSuchen_(String(daten.suche || daten.isbn || daten.titel || '')) };\n  const heute = basisHeute_();\n  let erg = null;\n  senSperre_(() => {\n    const d = senDaten_();\n    if (d.fehlt) throw new Error('Tab Werke fehlt. Einmal senEinrichten ausführen.');\n    const jetztTag = senIsoOk_(daten.tag) || senTagVon_(Date.now(), d.grenzen);\n    const nachId = id => { const w = d.werke.find(x => x.id === String(id || '')); if (!w) throw new Error('Werk nicht gefunden.'); return w; };\n    const tage = new Set();\n\n    if (op === 'neu') {\n      const w = senWerkNeu_(daten, jetztTag);\n      senWerkAnhaengen_(w);\n      if (w.ende) tage.add(w.ende);\n      erg = { werk: senWerkKurz_(w), zurueck: { op: 'loeschen', daten: { id: w.id } },\n        meldung: (w.art === 'Buch' ? '„' + w.titel + '“ liegt bereit.' : '„' + w.titel + '“ eingetragen.') };\n    } else if (op === 'aendern') {\n      const w = nachId(daten.id), alt = {};\n      const felder = senWerkFelder_(daten);\n      Object.keys(felder).forEach(k => { alt[k] = w[k]; w[k] = felder[k]; });\n      if (w.ort === 'Kino') w.handyWeg = true;\n      senWerkSchreiben_(w);\n      [alt.ende, w.ende].forEach(t => { if (t) tage.add(t); });\n      erg = { werk: senWerkKurz_(w), zurueck: { op: 'aendern', daten: Object.assign({ id: w.id }, alt) }, meldung: 'Geändert.' };\n    } else if (op === 'beenden') {\n      const w = nachId(daten.id);\n      const alt = { status: w.status, ende: w.ende, ganz: w.ganz };\n      w.status = daten.status === 'abgebrochen' ? 'abgebrochen' : 'fertig';\n      w.ende = senIsoOk_(daten.tag) || jetztTag;\n      if (w.art === 'Buch' && w.status === 'fertig') {   // ganz: genau eine Sitzung, von vorne bis zur letzten Seite\n        const l = d.sig.filter(s => s.art === 'lesen' && senWerkVonKey_(s.schluessel) === w.id);\n        const m = l.length === 1 ? l[0].notiz.match(/^S\\. [01] bis (\\d+)/) : null;\n        w.ganz = !!m && w.umfang > 0 && Number(m[1]) >= w.umfang;\n      }\n      senWerkSchreiben_(w);\n      [alt.ende, w.ende].forEach(t => { if (t) tage.add(t); });\n      erg = { werk: senWerkKurz_(w), zurueck: { op: 'aendern', daten: Object.assign({ id: w.id }, alt) },\n        meldung: w.status === 'fertig' ? '„' + w.titel + '“ beendet.' : '„' + w.titel + '“ abgebrochen.' };\n    } else if (op === 'loeschen') {\n      const w = nachId(daten.id);\n      senBlatt_(SEN.BLATT_WERKE).deleteRow(w.zeile);\n      if (w.ende) tage.add(w.ende);\n      const kopie = Object.assign({}, w); delete kopie.zeile;\n      erg = { zurueck: { op: 'wiederherstellen', daten: { werk: kopie } }, meldung: '„' + w.titel + '“ entfernt.' };\n    } else if (op === 'wiederherstellen') {\n      const w = senWerkFelder_(daten.werk || {}, true);\n      if (!w.id || !w.titel) throw new Error('Werk fehlt.');\n      if (!d.werke.some(x => x.id === w.id)) senWerkAnhaengen_(w);\n      if (w.ende) tage.add(w.ende);\n      erg = { werk: senWerkKurz_(w), zurueck: { op: 'loeschen', daten: { id: w.id } }, meldung: '„' + w.titel + '“ wieder da.' };\n    } else throw new Error('Unbekannt: ' + op);\n\n    tage.forEach(t => { if (t <= heute) senTagRechnen_(t); });\n    erg.tage = Array.from(tage);\n  });\n  erg.ok = true;\n  erg.paket = appSensi(senIsoOk_(daten.tag) || (erg.tage && erg.tage[0]) || heute);\n  return erg;\n}\n\n/** Uhr starten: art lesen (später zeitlupe, gang). startMs nur für Rückgängig (die Uhr läuft ab dem alten Start weiter). */\nfunction appSensiStart(art, werkId, startMs) {\n  art = String(art || '');\n  if (SEN.ARTEN_UHR.indexOf(art) < 0) throw new Error('Unbekannte Uhr: ' + art);\n  const uhr = { art: art, werkId: String(werkId || ''), start: Number(startMs) > 0 ? Number(startMs) : Date.now() };\n  let vorher = null;\n  senSperre_(() => {\n    vorher = senUhr();\n    senUhrSetzen_(uhr);\n  });\n  return { ok: true, uhr: uhr, vorher: vorher };\n}\n\n/**\n * Uhr stoppen. daten: { seite (beim Lesen: bis Seite), fertig (Buch beendet), verwerfen (Rückgängig für Start), ende (ms, sonst jetzt) }.\n * Legt die Sitzung in Signale ab und gibt den Schlüssel für Rückgängig zurück.\n */\nfunction appSensiStopp(daten) {\n  daten = daten || {};\n  let erg = null;\n  senSperre_(() => {\n    const uhr = senUhr();\n    if (!uhr) { erg = { ok: true, leer: true, meldung: 'Es lief keine Uhr.' }; return; }\n    senUhrSetzen_(null);\n    if (daten.verwerfen === true) { erg = { ok: true, verworfen: true, vorher: uhr, meldung: 'Doch nicht gestartet.' }; return; }\n    const ende = senMs_(daten.ende) || Date.now();\n    const min = Math.max(0, Math.round((ende - uhr.start) / 60000));\n    const d = senDaten_();\n    if (d.fehlt) throw new Error('Tab Signale fehlt. Einmal senEinrichten ausführen.');\n    const w = uhr.werkId ? d.werke.find(x => x.id === uhr.werkId) : null;\n    const tag = senTagVon_(uhr.start, d.grenzen);\n    let notiz = '';\n    if (w && uhr.art === 'lesen') {\n      const von = Number(w.seite) || 0;\n      const bis = daten.seite === '' || daten.seite == null || isNaN(Number(daten.seite)) ? von : Math.max(0, Math.round(Number(daten.seite)));\n      notiz = 'S. ' + von + ' bis ' + bis;\n      w.seite = bis;\n      if (daten.fertig === true && w.art === 'Buch') {\n        w.status = 'fertig'; w.ende = tag;\n        w.ganz = von <= 1 && !d.sig.some(s => s.art === 'lesen' && senWerkVonKey_(s.schluessel) === w.id);   // von vorne bis hinten in dieser einen Sitzung\n        notiz += ' · beendet';\n      }\n      senWerkSchreiben_(w);\n    }\n    const schluessel = uhr.art + '|' + (uhr.werkId || '-') + '|' + uhr.start;\n    senSignalAnhaengen_({ zeit: uhr.start, tag: tag, quelle: 'App', art: uhr.art, titel: w ? w.titel : '', wert: min, einheit: 'min', notiz: notiz, schluessel: schluessel });\n    senTagRechnen_(tag);\n    erg = { ok: true, schluessel: schluessel, min: min, tag: tag, punkte: uhr.art === 'lesen' ? senLesenPunkte_(min) : 0, vorher: uhr,\n      meldung: (uhr.art === 'lesen' ? 'Lesen ' : '') + min + ' min' };\n  });\n  if (erg.tag) erg.paket = appSensi(erg.tag);\n  return erg;\n}\n\n/** Laufende Uhr oder null. */\nfunction senUhr() {\n  try { const u = JSON.parse(PropertiesService.getScriptProperties().getProperty(SEN.UHR_PROP) || 'null'); return u && u.start ? u : null; }\n  catch (e) { return null; }\n}\n\n\n/* ───────────── Rechnen ───────────── */\n\n/** Alles, was zum Rechnen gebraucht wird, einmal gelesen. */\nfunction senDaten_() {\n  const sig = senSignale_(), werke = senWerke_();\n  if (!sig || !werke) return { fehlt: true };\n  return { sig: sig, werke: werke, grenzen: senGrenzen_(), audio: senAudio_() };\n}\n\nfunction senPaket_(iso, d) {\n  const t = senTagWerte_(iso, d.sig, d.werke, d.grenzen);\n  const mo = senMontag_(iso);\n  const wocheTage = [0, 1, 2, 3, 4, 5, 6].map(i => {\n    const tag = basisTagPlus_(mo, i);\n    return { tag: tag, tiefe: tag === iso ? t.summe : senTagWerte_(tag, d.sig, d.werke, d.grenzen).summe };\n  });\n  const letzte = art => {\n    let s = null;\n    d.sig.forEach(x => { if (x.art === art && (!s || x.zeit > s.zeit)) s = x; });\n    return s ? { ms: s.zeit, zeit: senUhr_(s.zeit), tag: senTagVon_(s.zeit, d.grenzen), kal: basisIso_(new Date(s.zeit)) } : null;\n  };\n  return {\n    version: SEN.VERSION, datum: iso, heute: basisHeute_(), punkte: SEN.PUNKTE, orte: SEN.ORTE,\n    tiefe: t.summe, woche: senRund_(wocheTage.reduce((a, x) => a + x.tiefe, 0)), wocheTage: wocheTage,\n    teile: t.teile, lesen: t.lesen, filme: t.filme,\n    buecher: d.werke.filter(w => w.art === 'Buch' && w.status === 'läuft').map(senWerkKurz_),\n    beendet: d.werke.filter(w => w.art === 'Buch' && w.ende === iso && w.status !== 'läuft').map(senWerkKurz_),\n    uhr: senUhr(),\n    handy: { abgelegt: letzte('abgelegt'), aufgenommen: letzte('aufgenommen') },\n    audio: Object.assign({ verbunden: senSpotifyVerbunden_() }, senAudioTag_(iso, d.audio || [], d.grenzen))\n  };\n}\n\n/** Punkte und Listen eines Tages. teile: [{ art, text, punkte }] für die Notiz in Tage und die App. */\nfunction senTagWerte_(iso, sig, werke, grenzen) {\n  const P = SEN.PUNKTE, teile = [], lesen = [], filme = [];\n  sig.filter(s => s.art === 'lesen' && senTagVon_(s.zeit, grenzen) === iso).sort((a, b) => a.zeit - b.zeit).forEach(s => {\n    const min = Math.round(Number(s.wert) || 0), p = senLesenPunkte_(min);\n    lesen.push({ zeit: senUhr_(s.zeit), ms: s.zeit, min: min, titel: s.titel, notiz: s.notiz, schluessel: s.schluessel, werk: senWerkVonKey_(s.schluessel), punkte: p });\n    teile.push({ art: 'lesen', text: 'Lesen ' + min + ' min' + (s.titel ? ' ' + s.titel : ''), punkte: p });\n  });\n  werke.filter(w => w.ende === iso).forEach(w => {\n    if (w.art === 'Buch' && w.status === 'fertig') {\n      const p = P.buch.fertig + (w.ganz ? P.buch.ganz : 0);\n      teile.push({ art: 'buch', text: w.titel + ' beendet' + (w.ganz ? ', in einer Sitzung' : ''), punkte: p });\n    } else if (w.art === 'Film' || w.art === 'Serie') {\n      const p = w.art === 'Film' ? senFilmPunkte_(w) : P.serie;\n      filme.push(Object.assign(senWerkKurz_(w), { punkte: p }));\n      teile.push({ art: w.art === 'Film' ? 'film' : 'serie', text: (w.art === 'Film' ? 'Film ' : 'Serie ') + w.titel, punkte: p });\n    }\n  });\n  return { summe: senRund_(teile.reduce((a, x) => a + x.punkte, 0)), teile: teile, lesen: lesen, filme: filme };\n}\n\nfunction senLesenPunkte_(min) {\n  const L = SEN.PUNKTE.lesen;\n  return min >= L.ab ? Math.floor(min / L.je) * L.punkte : 0;\n}\n\nfunction senFilmPunkte_(w) {\n  const F = SEN.PUNKTE.film;\n  if (!w.ganz) return F.nichtGanz;\n  return F.ganz + (w.handyWeg || w.ort === 'Kino' ? F.handyWeg : 0);\n}\n\n/**\n * Zeile eines Tages im Tab Sensi Tage: Tiefe, Lesen, Gesehen, Audio, Unruhe, jeweils mit Notiz.\n * Neuer Tag nur, wenn es etwas zu schreiben gibt. Nur Zellen, die sich ändern. Der Tab Tage bleibt unberührt.\n */\nfunction senTagRechnen_(datum, d) {\n  const iso = senIsoOk_(datum);\n  if (!iso) return false;\n  const blatt = senBlatt_(SEN.BLATT_TAGE);\n  if (!blatt) return false;   // vor senEinrichten\n  d = d || senDaten_();\n  if (d.fehlt) return false;\n  const t = senTagWerte_(iso, d.sig, d.werke, d.grenzen);\n  const au = senAudioTag_(iso, d.audio || [], d.grenzen);\n  const pkt = p => p ? ' +' + String(p).replace('.', ',') : '';\n  const lesenMin = t.lesen.reduce((a, x) => a + x.min, 0);\n  const leer = { w: '', n: '' };\n  const soll = {\n    Tiefe: t.teile.length ? { w: t.summe, n: t.teile.map(x => x.text + pkt(x.punkte)).join('\\n') } : leer,\n    Lesen: t.lesen.length ? { w: lesenMin, n: t.lesen.map(x => x.zeit + '  ' + x.min + ' min' + (x.titel ? '  ' + x.titel : '') + (x.notiz ? '  ' + x.notiz : '')).join('\\n') } : leer,\n    Gesehen: t.filme.length ? { w: t.filme.map(f => f.titel).join(' · '), n: t.filme.map(senFilmZeile_).join('\\n') } : leer,\n    Audio: au.titel ? { w: Math.round(au.min) / 1440, n: au.titel + ' Titel' + (au.alben.length ? '\\nAlben ganz: ' + au.alben.map(x => x.album + ' (' + x.kuenstler + ')').join(', ') : '') } : leer,\n    Unruhe: au.gezaehlt ? { w: au.quote, n: au.abbrueche + ' von ' + au.gezaehlt + ' abgebrochen' + (au.kurz.length ? '\\n' + au.kurz.slice(0, 15).join('\\n') : '') } : leer\n  };\n  const kopf = blatt.getRange(2, 1, 1, Math.max(1, blatt.getLastColumn())).getValues()[0].map(h => String(h).trim());\n  const etwas = Object.keys(soll).some(k => soll[k].w !== '');\n  let zeile = senTagZeile_(blatt, iso, etwas);\n  if (!zeile) return false;\n  const aufgaben = [];\n  Object.keys(soll).forEach(name => {\n    const sp = kopf.indexOf(name) + 1;\n    if (!sp) return;\n    const z = blatt.getRange(zeile, sp);\n    const alt = z.getValue(), altN = z.getNote(), s = soll[name];\n    if (String(alt) === String(s.w) && String(altN || '') === s.n) return;\n    aufgaben.push({ z: z, s: s, format: SEN.TAG_FORMATE[name] });\n  });\n  aufgaben.forEach(a => { a.z.setNumberFormat(a.format); a.z.setValue(a.s.w); a.z.setNote(a.s.n); });\n  return aufgaben.length > 0;\n}\n\n/** Zeilennummer des Tages in Sensi Tage. anlegen: fehlt sie, an der richtigen Stelle einfügen (neuester oben). */\nfunction senTagZeile_(blatt, iso, anlegen) {\n  const n = blatt.getLastRow() - SEN.ERSTE_ZEILE + 1;\n  const tage = n > 0 ? blatt.getRange(SEN.ERSTE_ZEILE, 1, n, 1).getValues().map(z => z[0] instanceof Date ? basisIso_(z[0]) : String(z[0]).slice(0, 10)) : [];\n  const i = tage.indexOf(iso);\n  if (i >= 0) return SEN.ERSTE_ZEILE + i;\n  if (!anlegen) return 0;\n  let pos = tage.findIndex(t => t && t < iso);\n  if (pos < 0) pos = tage.length;\n  const zeile = SEN.ERSTE_ZEILE + pos;\n  if (pos < tage.length) blatt.insertRowBefore(zeile);\n  blatt.getRange(zeile, 1).setNumberFormat(SEN.TAG_FORMATE.Datum).setValue(basisDatum_(iso));\n  return zeile;\n}\n\nfunction senFilmZeile_(f) {\n  return [f.titel + (f.art === 'Serie' ? ' (Serie)' : ''), f.ort, f.ganz ? 'ganz' : 'nicht ganz', f.handyWeg ? 'Handy weg' : '',\n    f.bewertung ? f.bewertung + ' von 5' : '', f.punkte ? '+' + f.punkte : ''].filter(Boolean).join(' · ');\n}\n\n/** Alle 15 Minuten (mit den Blöcken, in deren Sperre): heute und gestern neu rechnen. */\nfunction senTakt_() {\n  try { senAudioHolen_(true); } catch (e) { console.warn('Spotify: ' + e.message); }\n  const d = senDaten_();\n  if (d.fehlt) return 0;\n  const heute = basisHeute_();\n  let n = 0;\n  [heute, basisTagPlus_(heute, -1)].forEach(t => { if (senTagRechnen_(t, d)) n++; });\n  if (n && typeof appGeschrieben_ === 'function') appGeschrieben_();\n  return n;\n}\n\n/**\n * Tag eines Ereignisses: nach Mitternacht bis zum Einschlafen (mindestens 5 Uhr) zählt zum Vortag.\n * Nutzt die Grenze der Ausgaben (finGrenze_), damit beide gleich zählen.\n */\nfunction senTagVon_(ms, grenzen) {\n  const d = new Date(ms);\n  const kal = basisIso_(d);\n  const hm = Utilities.formatDate(d, BASIS.ZEITZONE, 'H:mm').split(':').map(Number);\n  const min = hm[0] * 60 + hm[1];\n  const grenze = typeof finGrenze_ === 'function' ? finGrenze_(kal, grenzen || {}) : SEN.NACHT_BIS;\n  return min < grenze ? basisTagPlus_(kal, -1) : kal;\n}\n\nfunction senGrenzen_() {\n  try { return typeof finNachtGrenzen_ === 'function' ? finNachtGrenzen_() : {}; } catch (e) { return {}; }\n}\n\n\n/* ───────────── Tabellen ───────────── */\n\nfunction senBlatt_(name) { return basisTabelle_().getSheetByName(name); }\n\nfunction senSignale_() {\n  const b = senBlatt_(SEN.BLATT_SIGNALE);\n  if (!b) return null;\n  const n = b.getLastRow() - SEN.ERSTE_ZEILE + 1;\n  if (n < 1) return [];\n  return b.getRange(SEN.ERSTE_ZEILE, 1, n, SEN.SIGNALE.length).getValues().map((z, i) => ({\n    zeile: SEN.ERSTE_ZEILE + i,\n    zeit: z[0] instanceof Date ? z[0].getTime() : Number(z[0]) || 0,\n    quelle: String(z[2]), art: String(z[3]).trim(), titel: String(z[4]),\n    wert: z[5] === '' ? '' : Number(z[5]), einheit: String(z[6]), notiz: String(z[7]), schluessel: String(z[8])\n  })).filter(s => s.art && s.zeit);\n}\n\nfunction senSignalAnhaengen_(s) {\n  const b = senBlatt_(SEN.BLATT_SIGNALE);\n  const zeile = Math.max(b.getLastRow(), SEN.ERSTE_ZEILE - 1) + 1;\n  b.getRange(zeile, 1, 1, SEN.SIGNALE.length).setValues([[new Date(s.zeit), basisDatum_(s.tag), s.quelle, s.art, s.titel, s.wert, s.einheit, s.notiz, s.schluessel]]);\n}\n\nfunction senWerke_() {\n  const b = senBlatt_(SEN.BLATT_WERKE);\n  if (!b) return null;\n  const n = b.getLastRow() - SEN.ERSTE_ZEILE + 1;\n  if (n < 1) return [];\n  const datum = v => v instanceof Date ? basisIso_(v) : (senIsoOk_(v) || '');\n  const ja = v => v === true || /^(ja|j|x|true|1)$/i.test(String(v).trim());\n  return b.getRange(SEN.ERSTE_ZEILE, 1, n, SEN.WERKE.length).getValues().map((z, i) => ({\n    zeile: SEN.ERSTE_ZEILE + i, id: String(z[0]).trim(), art: String(z[1]).trim() || 'Buch', titel: String(z[2]).trim(), von: String(z[3]).trim(),\n    jahr: z[4] === '' ? '' : String(z[4]), umfang: Number(z[5]) || 0, cover: String(z[6]).trim(), status: String(z[7]).trim() || 'läuft',\n    start: datum(z[8]), ende: datum(z[9]), seite: Number(z[10]) || 0, ganz: ja(z[11]), handyWeg: ja(z[12]), ort: String(z[13]).trim(),\n    bewertung: Number(z[14]) || 0, nachhall: String(z[15]), quelle: String(z[16]).trim(), link: String(z[17]).trim()\n  })).filter(w => w.id && w.titel);\n}\n\nfunction senWerkZeile_(w) {\n  const tag = t => t ? basisDatum_(t) : '';\n  return [w.id, w.art, w.titel, w.von || '', w.jahr || '', w.umfang || '', w.cover || '', w.status || '', tag(w.start), tag(w.ende),\n    w.art === 'Buch' ? (w.seite || 0) : '', w.art === 'Buch' && !w.ganz ? '' : (w.ganz ? 'ja' : 'nein'), w.art === 'Buch' ? '' : (w.handyWeg ? 'ja' : 'nein'),\n    w.ort || '', w.bewertung || '', w.nachhall || '', w.quelle || '', w.link || ''];\n}\n\nfunction senWerkSchreiben_(w) {\n  senBlatt_(SEN.BLATT_WERKE).getRange(w.zeile, 1, 1, SEN.WERKE.length).setValues([senWerkZeile_(w)]);\n}\n\nfunction senWerkAnhaengen_(w) {\n  const b = senBlatt_(SEN.BLATT_WERKE);\n  w.zeile = Math.max(b.getLastRow(), SEN.ERSTE_ZEILE - 1) + 1;\n  senWerkSchreiben_(w);\n}\n\n/** Für die App: nur was sie braucht. */\nfunction senWerkKurz_(w) {\n  return { id: w.id, art: w.art, titel: w.titel, von: w.von, jahr: w.jahr, umfang: w.umfang, cover: w.cover, status: w.status,\n    start: w.start, ende: w.ende, seite: w.seite, ganz: w.ganz, handyWeg: w.handyWeg, ort: w.ort, bewertung: w.bewertung, quelle: w.quelle, link: w.link };\n}\n\n/** Felder aus der App in die Form der Tab ];\n      if (!t) throw new Error('Zur ISBN ' + isbn + ' nichts gefunden. Titel von Hand eingeben.');\n      ['titel', 'von', 'jahr', 'umfang', 'cover', 'quelle'].forEach(k => { if (!w[k]) w[k] = t[k]; });\n    }\n    if (isbn && !w.link) w.link = 'isbn:' + isbn;\n    if (!w.titel) throw new Error('Titel fehlt.');\n    w.status = 'läuft'; w.ende = ''; w.ganz = false; w.handyWeg = false;\n  } else {\n    if (w.link) {\n      const og = senOgLesen_(w.link);\n      if (!w.titel && og.titel) w.titel = og.titel;\n      if (!w.cover && og.bild) w.cover = og.bild;\n    }\n    if (!w.titel) throw new Error('Titel fehlt.');\n    if (!w.quelle) w.quelle = SEN.FILM_QUELLE;\n    if (SEN.ORTE.indexOf(w.ort) < 0) w.ort = '';\n    if (w.ort === 'Kino') w.handyWeg = true;\n    w.status = 'fertig'; w.start = tag; w.ende = tag; w.seite = 0;\n  }\n  return w;\n}\n\n\n/* ───────────── Bücher suchen ───────────── */\n\n/** Google Books ohne Schlüssel, bei Fehlschlag Open Library. [{ titel, von, jahr, umfang, cover, isbn, quelle }] */\nfunction senBuchSuchen_(suche) {\n  suche = String(suche || '').trim();\n  if (!suche) return [];\n  const isbn = senIsbn_(suche);\n  let treffer = [];\n  try { treffer = senGoogleBooks_(isbn ? 'isbn:' + isbn : suche); } catch (e) { console.warn('Google Books: ' + e.message); }\n  if (!treffer.length) { try { treffer = senOpenLibrary_(isbn, suche); } catch (e) { console.warn('Open Library: ' + e.message); } }\n  return treffer.slice(0, 5);\n}\n\nfunction senGoogleBooks_(q) {\n  const r = UrlFetchApp.fetch('https://www.googleapis.com/books/v1/volumes?maxResults=5&printType=books&q=' + encodeURIComponent(q), { muteHttpExceptions: true });\n  if (r.getResponseCode() !== 200) throw new Error('HTTP ' + r.getResponseCode());\n  return (JSON.parse(r.getContentText()).items || []).map(x => {\n    const v = x.volumeInfo || {};\n    const ids = v.industryIdentifiers || [];\n    const i13 = ids.find(i => i.type === 'ISBN_13') || ids.find(i => i.type === 'ISBN_10') || {};\n    const bild = (v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || '';\n    return { titel: String(v.title || '') + (v.subtitle ? ': ' + v.subtitle : ''), von: (v.authors || []).join(', '), jahr: String(v.publishedDate || '').slice(0, 4),\n      umfang: Number(v.pageCount) || 0, cover: bild.replace(/^http:/, 'https:').replace('&edge=curl', ''), isbn: String(i13.identifier || ''), quelle: 'Google Books' };\n  }).filter(t => t.titel);\n}\n\nfunction senOpenLibrary_(isbn, suche) {\n  const url = 'https://openlibrary.org/search.json?limit=5&fields=title,author_name,first_publish_year,number_of_pages_median,cover_i,isbn&' +\n    (isbn ? 'isbn=' + isbn : 'q=' + encodeURIComponent(suche));\n  const r = UrlFetchApp.fetch(url, { muteHttpExceptions: true });\n  if (r.getResponseCode() !== 200) throw new Error('HTTP ' + r.getResponseCode());\n  return (JSON.parse(r.getContentText()).docs || []).map(x => ({\n    titel: String(x.title || ''), von: (x.author_name || []).slice(0, 3).join(', '), jahr: x.first_publish_year ? String(x.first_publish_year) : '',\n    umfang: Number(x.number_of_pages_median) || 0, cover: x.cover_i ? 'https://covers.openlibrary.org/b/id/' + x.cover_i + '-M.jpg' : '',\n    isbn: isbn || String((x.isbn || [])[0] || ''), quelle: 'Open Library'\n  })).filter(t => t.titel);\n}\n\n/** ISBN 10 oder 13 aus einem Text, sonst ''. */\nfunction senIsbn_(s) {\n  const z = String(s || '').replace(/[\\s-]/g, '').toUpperCase();\n  return /^(97[89]\\d{10}|\\d{9}[\\dX])$/.test(z) ? z : '';\n}\n\n/** og:title und og:image einer Seite (MUBI). Blockt die Seite, kommt {} zurück. */\nfunction senOgLesen_(link) {\n  if (!/^https:\\/\\/[^\\s/]+\\//i.test(String(link))) return {};\n  try {\n    const r = UrlFetchApp.fetch(link, { muteHttpExceptions: true, followRedirects: true });\n    if (r.getResponseCode() !== 200) return {};\n    const html = r.getContentText().slice(0, 200000);\n    const meta = name => {\n      const m = html.match(new RegExp('<meta[^>]+property=[\"\\']' + name + '[\"\\'][^>]*content=[\"\\']([^\"\\']*)[\"\\']', 'i')) ||\n        html.match(new RegExp('<meta[^>]+content=[\"\\']([^\"\\']*)[\"\\'][^>]*property=[\"\\']' + name + '[\"\\']', 'i'));\n      return m ? senEntities_(m[1]).trim() : '';\n    };\n    const titel = meta('og:title').replace(/\\s*\\|\\s*MUBI.*$/i, '').replace(/^Watch\\s+/i, '').trim();\n    return { titel: titel, bild: /^https:/.test(meta('og:image')) ? meta('og:image') : '' };\n  } catch (e) {\n    console.warn('og: ' + e.message);\n    return {};\n  }\n}\n\nfunction senEntities_(s) {\n  return String(s).replace(/&amp;/g, '&').replace(/&quot;/g, '\"').replace(/&#39;|&#x27;/g, \"'\").replace(/&lt;/g, '<').replace(/&gt;/g, '>')\n    .replace(/&#(\\d+);/g, (m, n) => String.fromCharCode(Number(n)));\n}\n\n\n/* ───────────── Hilfen ───────────── */\n\nfunction senSperre_(arbeit) {\n  if (typeof appMitSperre_ === 'function') return appMitSperre_(arbeit);\n  arbeit();\n}\n\nfunction senUhrSetzen_(uhr) {\n  const p = PropertiesService.getScriptProperties();\n  if (uhr) p.setProperty(SEN.UHR_PROP, JSON.stringify(uhr)); else p.deleteProperty(SEN.UHR_PROP);\n}\n\nfunction senWerkVonKey_(k) {\n  const t = String(k || '').split('|');\n  return t.length >= 3 && t[1] !== '-' ? t[1] : '';\n}\n\nfunction senIsoOk_(v) {\n  if (v instanceof Date) return basisIso_(v);\n  const s = String(v || '').slice(0, 10);\n  return /^\\d{4}-\\d{2}-\\d{2}$/.test(s) ? s : '';\n}\n\nfunction senMs_(v) {\n  if (v == null || v === '') return 0;\n  if (v instanceof Date) return v.getTime();\n  if (typeof v === 'number') return v;\n  const n = Number(v);\n  if (!isNaN(n) && n > 1e11) return n;\n  const t = new Date(String(v)).getTime();\n  return isNaN(t) ? 0 : t;\n}\n\nfunction senUhr_(ms) { return Utilities.formatDate(new Date(ms), BASIS.ZEITZONE, 'HH:mm'); }\n\nfunction senImFenster_(ms, f) {\n  const h = Number(Utilities.formatDate(new Date(ms), BASIS.ZEITZONE, 'H'));\n  return f[0] <= f[1] ? h >= f[0] && h < f[1] : h >= f[0] || h < f[1];\n}\n\nfunction senMontag_(iso) {\n  const [y, m, d] = iso.split('-').map(Number);\n  const wt = new Date(Date.UTC(y, m - 1, d)).getUTCDay();\n  return basisTagPlus_(iso, -((wt + 6) % 7));\n}\n\nfunction senRund_(x) { return Math.round(x * 10) / 10; }\n\n\n/* ───────────── Audio (Spotify, zuletzt gehört) ─────────────\n * Spotify liefert die letzten 50 Titel mit Zeitpunkt. Daraus: Hörzeit, Abbrüche (Unruhe) und ganze Alben.\n * Grenze: Titel, die kürzer als etwa 30 Sekunden liefen, meldet Spotify gar nicht. Ganz schnelles Skippen fehlt also.\n * Nur Anzeige, keine Punkte (Album ganz steht für später in SEN.PUNKTE).\n */\n\nfunction senAudioFaellig_() {\n  const p = PropertiesService.getScriptProperties();\n  return !!p.getProperty('sen_spotify_refresh') && Date.now() - Number(p.getProperty('sen_spotify_geholt') || 0) >= SEN.SPOTIFY.HOLEN_MIN * 60000;\n}\n\nfunction senSpotifyVerbunden_() {\n  return !!PropertiesService.getScriptProperties().getProperty('sen_spotify_refresh');\n}\n\n/** Neue Titel von Spotify holen und an Audio hängen. immer: auch wenn gerade erst geholt. Gibt die Zahl neuer Titel zurück. */\nfunction senAudioHolen_(immer) {\n  const props = PropertiesService.getScriptProperties();\n  if (!props.getProperty('sen_spotify_refresh')) return 0;\n  const b = senBlatt_(SEN.BLATT_AUDIO);\n  if (!b) return 0;\n  const zuletzt = Number(props.getProperty('sen_spotify_geholt') || 0);\n  if (!immer && Date.now() - zuletzt < SEN.SPOTIFY.HOLEN_MIN * 60000) return 0;\n  const token = senSpotifyToken_();\n  const nach = Number(props.getProperty('sen_spotify_nach') || 0);\n  const r = UrlFetchApp.fetch('https://api.spotify.com/v1/me/player/recently-played?limit=50' + (nach ? '&after=' + nach : ''),\n    { headers: { Authorization: 'Bearer ' + token }, muteHttpExceptions: true });\n  props.setProperty('sen_spotify_geholt', String(Date.now()));\n  if (r.getResponseCode() === 401) { props.deleteProperty('sen_spotify_token'); throw n
